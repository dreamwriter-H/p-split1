                            : null;
                    }

                    const displayData = applyDataOperations(committedProject.data || {}, remainingOperations);
                    const displayProject = {
                        ...committedProject,
                        data: displayData,
                        name: getProjectDisplayName(committedProject.type, displayData),
                        currentUserRole: activeProjectRef.current?.currentUserRole || (committedProject.ownerId === currentUser.uid ? 'owner' : 'editor')
                    };
                    if (activeProjectRef.current?.id === projectId) {
                        activeProjectRef.current = displayProject;
                        setActiveProjectData(displayProject);
                    }
                    setProjects(prev => prev.map(project => project.id === projectId ? { ...displayProject, currentUserRole: project.currentUserRole || displayProject.currentUserRole } : project));
                } catch (error) {
                    syncFailed = true;
                    console.error('Transaction sync error:', error);
                    showMessage({ title: '同步失敗', message: '這次修改仍保留在畫面上，但尚未同步到雲端；請確認網路後再修改一次。' });
                } finally {
                    syncInFlightRef.current = false;
                    if (!syncFailed && pendingProjectUpdateRef.current?.operations?.length) {
                        if (debounceTimer.current) clearTimeout(debounceTimer.current);
                        debounceTimer.current = setTimeout(flushPendingProjectUpdate, 250);
                    }
                }
            };

            const updateCurrentData = (newData, baseData) => {
                const currentProject = activeProjectRef.current || activeProjectData;
                if (!currentProject || !currentProjectId) return;

                const operations = buildDataOperations(baseData || currentProject.data || {}, newData);
                if (!operations.length) return;

                const existingPending = pendingProjectUpdateRef.current;
                const pendingOperations = existingPending?.projectId === currentProjectId
                    ? [...existingPending.operations, ...operations]
                    : operations;
                pendingProjectUpdateRef.current = { projectId: currentProjectId, operations: pendingOperations };

                const optimisticData = applyDataOperations(currentProject.data || {}, operations);
                const updatedProject = {
                    ...currentProject,
                    data: optimisticData,
                    name: getProjectDisplayName(currentProject.type, optimisticData),
                    updatedAt: new Date().toISOString()
                };
                activeProjectRef.current = updatedProject;
                setActiveProjectData(updatedProject);
                setProjects(prev => prev.map(project => project.id === currentProjectId ? { ...updatedProject, currentUserRole: project.currentUserRole || updatedProject.currentUserRole } : project));

                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                debounceTimer.current = setTimeout(flushPendingProjectUpdate, 800);
            };

            const handleShareProject = async () => {
                if (!user || !currentProjectId || !activeProjectData) return false;
                if (activeProjectData.ownerId !== user.uid) {
                    showMessage({ title: '無法建立邀請', message: '只有專案擁有者可以建立共編連結。' });
                    return false;
                }
                try {
                    const inviteId = createInviteToken();
                    await setDoc(inviteRefFor(currentProjectId, inviteId), {
                        status: 'active',
                        createdBy: user.uid,
                        createdAt: new Date().toISOString(),
                        role: 'editor'
                    });
                    const shareUrl = `${window.location.origin}${window.location.pathname}?invite=${currentProjectId}.${inviteId}`;
                    setShareInvite({ url: shareUrl, projectName: activeProjectData.name });
                    return true;
                } catch (error) {
                    console.error('Create invite error:', error);
                    showMessage({ title: '建立邀請失敗', message: '請檢查網路或 Firebase 權限設定。' });
                    return false;
                }
            };

            const handleSignOut = () => {
                setDialog({
                    type: 'confirm',
                    title: '登出 Split Easy',
                    message: '專案仍會安全保存在雲端，下次登入同一個 Google 帳號即可找回。',
                    confirmText: '確認登出',
                    onConfirm: () => signOut(auth).catch(error => console.error('Sign out error:', error))
                });
            };

            if (showSplash || !authReady) return <SplashScreen />;
            if (!user) return <LoginScreen onLogin={handleGoogleLogin} isLoggingIn={isLoggingIn} error={authError} hasInvite={hasPendingInvite} />;

            return (
                <div className="min-h-screen">
                    <DialogModal dialog={dialog} onClose={() => setDialog(null)} />
                    <ShareInviteModal invite={shareInvite} onClose={() => setShareInvite(null)} />
                    {showCollaborationManager && activeProjectData?.ownerId === user.uid && <CollaborationManagerModal project={activeProjectData} user={user} onClose={() => setShowCollaborationManager(false)} onCreateInvite={handleShareProject} requestConfirm={setDialog} showMessage={showMessage} />}
                    <header className="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
                        {view === 'activeProject' ? (
                            <button onClick={() => { setShowCollaborationManager(false); setView('projectList'); setCurrentProjectId(null); setActiveProjectData(null); }} className="flex items-center gap-1 text-slate-500 font-bold"><i className="fa-solid fa-arrow-left"></i> 首頁</button>
                        ) : (
                            <div className="flex items-center gap-2 text-teal-600 font-bold text-lg"><i className="fa-solid fa-calculator"></i> Split Easy</div>
                        )}

                        {view === 'activeProject' && activeProjectData ? (
                            <div className="flex items-center gap-2">
                                <h1 className="font-bold text-sm text-slate-800 truncate max-w-[105px]">{activeProjectData.name}</h1>
                                {activeProjectData.ownerId === user.uid ? <button onClick={() => setShowCollaborationManager(true)} className="bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-teal-200 transition"><i className="fa-solid fa-users-gear"></i> 共編管理</button> : <span className="bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full text-xs font-bold">協作者</span>}
                            </div>
                        ) : (
                            <div className="flex items-center gap-2">
                                {user.photoURL ? <img src={user.photoURL} alt="Google 帳號頭像" className="w-8 h-8 rounded-full" referrerPolicy="no-referrer" /> : <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center"><i className="fa-solid fa-user"></i></div>}
                                <div className="max-w-[150px] text-right leading-tight">
                                    <p className="text-[11px] font-bold text-slate-600 truncate" title={user.email || ''}>{user.email || user.displayName}</p>
                                    <p className="text-[9px] text-slate-400">UID …{user.uid.slice(-6)}</p>
                                </div>
                                <button onClick={handleSignOut} aria-label="登出" className="p-2 text-slate-400 hover:text-red-500"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                            </div>
                        )}
                    </header>

                    {authPersistenceWarning && <div className="max-w-md mx-auto bg-amber-50 border-b border-amber-100 px-4 py-3 text-xs leading-relaxed text-amber-800"><i className="fa-solid fa-lock-open mr-2"></i>{authPersistenceWarning}</div>}

                    <main className="max-w-md mx-auto min-h-[calc(100vh-60px)] relative bg-slate-50">
                        {view === 'projectList' && <ProjectList projects={projects} isLoading={projectsLoading} warning={projectIndexWarning} onSelect={(id) => { const selected = projects.find(project => project.id === id); if (selected?.accessPending) { setProjectsLoading(true); setProjectListRetryRevision(revision => revision + 1); setDialog({ type: 'alert', title: '正在重新確認', message: '這筆首頁索引仍保留。系統正在重新確認登入與專案權限，請稍後再點一次。' }); return; } setCurrentProjectId(id); setActiveProjectData(selected || null); setView('activeProject'); }} onCreate={() => setView('createProject')} onRemove={handleRemoveProject} />}
                        {view === 'createProject' && <CreateProjectScreen onCancel={() => setView('projectList')} onCreate={createProject} showMessage={showMessage} />}
                        {view === 'activeProject' && !activeProjectData && <div className="py-20 text-center text-slate-400"><i className="fa-solid fa-spinner fa-spin text-2xl"></i><p className="mt-3 text-sm">正在載入共編專案…</p></div>}
                        {view === 'activeProject' && activeProjectData?.type === 'travel' && <TravelMode projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} />}
                        {view === 'activeProject' && activeProjectData?.type === 'dining' && <DiningMode projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} />}
                        <div className="py-5 text-center"><VersionBadge /></div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
