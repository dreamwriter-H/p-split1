                                            <div className="pt-2 border-t border-slate-50 flex items-start gap-2"><i className="fa-solid fa-users text-xs text-slate-400 mt-1"></i><p className="text-xs text-slate-400">分攤: {exp.splitBetween.length === trip.people.length ? '全員' : exp.splitBetween.map(id => getPersonNameHelper(id, trip.people)).join(', ')}</p></div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => { setEditingExpense(null); setShowAddModal(true); }} aria-label={`新增第 ${activeDay} 天支出`} className="fixed bottom-24 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center z-10"><i className="fa-solid fa-plus text-xl"></i></button>
                            </div>
                        )}
                        {tab === 'settle' && <SettlementView trip={trip} showMessage={showMessage} />}
                    </div>
                    {showAddModal && <AddExpenseModal people={trip.people} dayCount={tripDayCount} defaultDay={activeDay} initialData={editingExpense} onClose={() => { setShowAddModal(false); setEditingExpense(null); }} onAdd={addExpense} onUpdate={updateExpense} getPersonName={(id) => getPersonNameHelper(id, trip.people)} showMessage={showMessage} />}
                </div>
            );
        };

        const SettlementView = ({ trip, showMessage }) => {
            const result = calculateSettlementHelper(trip);
            if (result.error) return <div className="p-6 pb-24 flex flex-col items-center justify-center h-full text-center"><div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i></div><h3 className="font-bold text-xl text-slate-800">資料格式異常</h3><p className="text-slate-500 text-sm mt-2 max-w-xs">偵測到異常，無法結算。</p></div>;
            const { overview, transactions } = result;
            const settlementRef = useRef(null);
            const settlementText = [`${trip.name || '本次旅遊'}｜結算`, ...transactions.map(transaction => `．${getPersonNameHelper(transaction.from, trip.people)} 付給 ${getPersonNameHelper(transaction.to, trip.people)} ${formatMoney(Math.round(transaction.amount))}`)].join('\n');

            const handleDownload = async () => { if (settlementRef.current && window.html2canvas) { const canvas = await window.html2canvas(settlementRef.current, { scale: 2 }); const link = document.createElement('a'); link.download = `結算清單.png`; link.href = canvas.toDataURL(); link.click(); } };

            return (
                <div className="p-6 pb-24">
                    <h2 className="text-2xl font-bold mb-4">結算中心</h2>
                    <div ref={settlementRef} className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 space-y-6">
                        <div className="text-center border-b border-slate-100 pb-4"><h3 className="font-bold text-lg">{trip.name || '本次旅遊'}</h3><p className="text-slate-500 text-xs">建議轉帳路徑</p></div>
                        <div className="space-y-3">{transactions.map((t, i) => (<div key={i} className="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-100"><div className="flex items-center gap-2"><span className="font-bold text-slate-700">{getPersonNameHelper(t.from, trip.people)}</span><span className="text-slate-400 text-xs">給</span><span className="font-bold text-slate-700">{getPersonNameHelper(t.to, trip.people)}</span></div><span className="font-bold text-teal-600">{formatMoney(Math.round(t.amount))}</span></div>))}{transactions.length === 0 && <div className="text-center text-green-600 font-bold py-4">帳目已平！</div>}</div>
                        <div className="pt-4 border-t border-slate-100"><h4 className="text-sm font-bold text-slate-400 uppercase mb-3">個人收支 (含錢包合併)</h4><div className="space-y-2">{overview.map(p => { if (p.payerId && p.payerId !== p.id && p.balance === 0) return null; return (<div key={p.id} className="flex justify-between text-sm"><span>{p.name}</span><span className={p.balance >= 0 ? 'text-blue-600 font-bold' : 'text-red-500 font-bold'}>{p.balance > 0 ? `應收 ${formatMoney(Math.round(p.balance))}` : `應付 ${formatMoney(Math.round(Math.abs(p.balance)))}`}</span></div>); })}</div></div>
                    </div>
                    <button onClick={() => { copyToClipboard(settlementText); showMessage({ message: '結算文字已複製！' }); }} disabled={transactions.length === 0} className="w-full mt-6 bg-blue-50 disabled:opacity-40 text-blue-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-copy"></i> 複製結算文字</button>
                    <button onClick={handleDownload} className="w-full mt-4 bg-slate-800 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-download"></i> 下載結算圖</button>
                </div>
            );
        };

        const AddExpenseModal = ({ people, dayCount, defaultDay, initialData, onClose, onAdd, onUpdate, getPersonName, showMessage }) => {
            const [desc, setDesc] = useState(''); 
            const [amount, setAmount] = useState(''); 
            const [payerMode, setPayerMode] = useState('single'); 
            const [mainPayer, setMainPayer] = useState(people[0]?.id); 
            const [multiPayers, setMultiPayers] = useState({}); 
            const [splitExcludes, setSplitExcludes] = useState([]);
            const safeDayCount = Math.max(1, parseInt(dayCount, 10) || 1);
            const [expenseDay, setExpenseDay] = useState(Math.min(safeDayCount, Math.max(1, parseInt(initialData?.day, 10) || parseInt(defaultDay, 10) || 1)));
            
            useEffect(() => { 
                if (initialData) { 
                    setDesc(initialData.desc); 
                    setAmount(initialData.amount); 
                    if (Object.keys(initialData.payers).length > 1) { 
                        setPayerMode('multi'); 
                        setMultiPayers(initialData.payers); 
                    } else { 
                        setPayerMode('single'); 
                        setMainPayer(parseInt(Object.keys(initialData.payers)[0])); 
                    } 
                    setSplitExcludes(people.filter(p => !initialData.splitBetween.includes(p.id)).map(p => p.id));
                    setExpenseDay(Math.min(safeDayCount, Math.max(1, parseInt(initialData.day, 10) || 1)));
                } else {
                    setExpenseDay(Math.min(safeDayCount, Math.max(1, parseInt(defaultDay, 10) || 1)));
                }
            }, [initialData, defaultDay]);
            
            const handleSubmit = () => { 
                if (!desc.trim() || !amount) return showMessage({message: '請填寫完整'});
                const total = parseFloat(amount);
                if (!Number.isFinite(total) || total <= 0) return showMessage({message: '金額必須大於 0'});
                let payers = {}; 
                if (payerMode === 'single') {
                    payers[mainPayer] = total; 
                } else { 
                    const validPayers = {}; 
                    let sum = 0; 
                    Object.entries(multiPayers).forEach(([pid, val]) => { 
                        const v = parseFloat(val); 
                        if (v > 0) { validPayers[pid] = v; sum += v; } 
                    }); 
                    if (Math.abs(sum - total) > 1) return showMessage({message: `付款金額總和不符 (您輸入了 ${sum}，總額 ${total})`}); 
                    payers = validPayers; 
                } 
                const split = people.filter(p => !splitExcludes.includes(p.id)).map(p => p.id);
                if (split.length === 0) return showMessage({message: '請至少選擇一位分攤成員'});
                const data = { desc: desc.trim(), amount: total, payers, splitBetween: split, day: expenseDay };
                initialData ? onUpdate({...data, id: initialData.id}) : onAdd(data); 
                onClose(); 
            };
            
            const activeSplitCount = people.length - splitExcludes.length; 
            const isAllSplit = activeSplitCount === people.length;
            const handleToggleAll = () => { if (splitExcludes.length === 0) setSplitExcludes(people.map(p => p.id)); else setSplitExcludes([]); };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
                    <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 h-[90vh] sm:h-auto overflow-y-auto animate-slide-up">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold">{initialData ? '編輯' : '新增'}消費</h3><button onClick={onClose} className="text-slate-400 font-bold text-lg">✕</button></div>
                        {/* 替換拍收據按鈕，改為直接觸發提示框 */}
                        {!initialData && (
                            <div className="mb-6">
                                <button onClick={() => showMessage({title: '系統提示', message: '努力更新中，敬請期待！'})} className="flex items-center justify-center gap-2 w-full p-3 rounded-xl border-2 border-dashed border-teal-300 bg-teal-50 text-teal-700 font-bold cursor-pointer hover:bg-teal-100">
                                    <i className="fa-solid fa-camera"></i> 拍收據自動填寫
                                </button>
                            </div>
                        )}
                        <div className="space-y-4">
                            <div><label className="text-xs text-slate-500 font-bold">記在哪一天？</label><select className="w-full p-3 border rounded-xl mt-1 bg-slate-50 font-bold text-slate-700" value={expenseDay} onChange={e => setExpenseDay(parseInt(e.target.value, 10))}>{Array.from({ length: safeDayCount }, (_, index) => index + 1).map(day => <option key={day} value={day}>第 {day} 天</option>)}</select></div>
                            <div><label className="text-xs text-slate-500 font-bold">品項</label><input className="w-full p-3 border rounded-xl mt-1 bg-slate-50" value={desc} onChange={e => setDesc(e.target.value)} /></div>
                            <div><label className="text-xs text-slate-500 font-bold">金額</label><input type="number" className="w-full p-3 border rounded-xl mt-1 text-xl font-bold bg-slate-50" value={amount} onChange={e => setAmount(e.target.value)} /></div>
                            <div className="bg-slate-50 p-4 rounded-xl"><div className="flex justify-between mb-2"><label className="text-xs font-bold text-slate-500">付款人</label><button onClick={() => setPayerMode(m => m === 'single' ? 'multi' : 'single')} className="text-xs text-teal-600 underline">{payerMode === 'single' ? '切換多人' : '切換單人'}</button></div>{payerMode === 'single' ? <select className="w-full p-3 border rounded-xl bg-white" value={mainPayer} onChange={e => setMainPayer(parseInt(e.target.value))}>{people.map(p => <option key={p.id} value={p.id}>{getPersonName(p.id)}</option>)}</select> : <div className="space-y-2">{people.map(p => <div key={p.id} className="flex justify-between items-center"><span className="text-sm">{getPersonName(p.id)}</span><input type="number" className="w-24 p-2 border rounded text-right" value={multiPayers[p.id]||''} onChange={e => setMultiPayers(prev=>({...prev, [p.id]:e.target.value}))} /></div>)}</div>}</div>
                            <div>
                                <div className="flex justify-between items-center mb-2"><label className="text-xs text-slate-500 font-bold block">分攤給？ <span className="text-teal-600 font-normal">{isAllSplit ? '(預設：全員均攤)' : `(指定 ${activeSplitCount} 人)`}</span></label><button onClick={handleToggleAll} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded transition">{splitExcludes.length === 0 ? '全不選' : '全選'}</button></div>
                                <div className="flex flex-wrap gap-2">{people.map(p => (<button key={p.id} onClick={() => setSplitExcludes(prev => prev.includes(p.id) ? prev.filter(id=>id!==p.id) : [...prev, p.id])} className={`px-3 py-2 rounded-full text-sm border transition-all ${!splitExcludes.includes(p.id) ? 'bg-teal-100 text-teal-700 font-bold border-teal-200' : 'bg-white text-slate-300 border-slate-100'}`}>{getPersonName(p.id)} {!splitExcludes.includes(p.id) && <i className="fa-solid fa-check ml-1 text-xs"></i>}</button>))}</div>
                            </div>
                        </div>
                        <button onClick={handleSubmit} className="w-full mt-8 bg-slate-800 text-white p-4 rounded-xl font-bold shadow-lg">確認</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [authReady, setAuthReady] = useState(false);
            const [authError, setAuthError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [view, setView] = useState('projectList');
            const [projects, setProjects] = useState([]);
            const [projectsLoading, setProjectsLoading] = useState(false);
            const [activeProjectData, setActiveProjectData] = useState(null);
            const [currentProjectId, setCurrentProjectId] = useState(null);
            const [user, setUser] = useState(null);
            const [dialog, setDialog] = useState(null);
            const [shareInvite, setShareInvite] = useState(null);
            const debounceTimer = useRef(null);
            const activeProjectRef = useRef(null);
            const pendingProjectUpdateRef = useRef(null);
            const syncInFlightRef = useRef(false);
            const processedInviteRef = useRef(false);

            useEffect(() => { activeProjectRef.current = activeProjectData; }, [activeProjectData]);

            const params = new URLSearchParams(window.location.search);
            const hasPendingInvite = Boolean(params.get('invite') || params.get('join'));

            useEffect(() => {
                let mounted = true;
                setPersistence(auth, browserLocalPersistence)
                    .catch(error => {
                        console.error('Auth persistence error:', error);
                        if (mounted) setAuthError('這個瀏覽器無法保存登入狀態，請改用外部 Chrome／Safari。');
                    });
                const unsubscribe = onAuthStateChanged(auth, nextUser => {
                    if (!mounted) return;
                    const isGoogleAccount = nextUser?.providerData?.some(provider => provider.providerId === 'google.com');
                    if (nextUser && (nextUser.isAnonymous || !isGoogleAccount)) {
                        signOut(auth).catch(error => console.warn('清除舊匿名登入失敗：', error));
                        setUser(null);
                        setAuthReady(true);
                        setShowSplash(false);
                        return;
                    }
                    setUser(nextUser);
                    setAuthReady(true);
                    setShowSplash(false);
                    if (!nextUser) {
                        setProjects([]);
                        setActiveProjectData(null);
                        setCurrentProjectId(null);
                        setView('projectList');
                    }
                });
                const safetyTimer = setTimeout(() => {
                    if (mounted) {
                        setAuthReady(true);
                        setShowSplash(false);
                    }
                }, 5000);
                return () => {
                    mounted = false;
                    clearTimeout(safetyTimer);
                    unsubscribe();
                };
            }, []);

            const handleGoogleLogin = async () => {
                setIsLoggingIn(true);
                setAuthError('');
                const popupTimer = window.setTimeout(() => {
                    setIsLoggingIn(false);
                    setAuthError('沒有看到 Google 登入視窗嗎？這個 App 內建瀏覽器可能會攔截彈出視窗，請將目前網址改用外部 Chrome／Safari 開啟。');
                }, 7000);
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error('Google login error:', error);
                    if (error.code === 'auth/unauthorized-domain') {
                        setAuthError('目前網址尚未加入 Firebase 授權網域，請由管理者完成設定後再試。');
                    } else if (error.code === 'auth/operation-not-allowed') {
                        setAuthError('Firebase 尚未啟用 Google 登入，請由管理者先開啟。');
                    } else if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error.code)) {
                        setAuthError('Google 登入視窗被瀏覽器攔截或關閉，請允許彈出式視窗，或改用外部 Chrome／Safari 開啟。');
                    } else {
                        setAuthError('Google 登入失敗，請確認網路後再試；若正在 App 內建瀏覽器，請改用外部 Chrome／Safari。');
                    }
                } finally {
                    window.clearTimeout(popupTimer);
                    setIsLoggingIn(false);
                }
            };

            useEffect(() => {
                if (!user) return;
                setProjectsLoading(true);
                const indexCollection = collection(db, 'users', user.uid, 'projects');
                const unsubscribe = onSnapshot(indexCollection, async indexSnapshot => {
                    try {
                        const loaded = await Promise.all(indexSnapshot.docs.map(async indexDoc => {
                            const indexData = indexDoc.data();
                            const cloudProject = await getDoc(projectRefFor(indexDoc.id));
                            if (!cloudProject.exists()) {
                                deleteDoc(indexDoc.ref).catch(() => {});
                                return null;
                            }
                            return {
                                id: cloudProject.id,
                                ...cloudProject.data(),
                                currentUserRole: indexData.role || (cloudProject.data().ownerId === user.uid ? 'owner' : 'editor')
                            };
                        }));
                        const cleanProjects = loaded.filter(Boolean).sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
                        setProjects(cleanProjects);
                    } catch (error) {
                        console.error('Project index error:', error);
                        setDialog({ type: 'alert', title: '讀取專案失敗', message: '無法讀取你的雲端專案，請確認網路或 Firebase 權限設定。' });
                    } finally {
                        setProjectsLoading(false);
                    }
                }, error => {
                    console.error('Project list listener error:', error);
                    setProjectsLoading(false);
                    setDialog({ type: 'alert', title: '讀取專案失敗', message: '目前無法連線到個人專案目錄。' });
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                if (!user || processedInviteRef.current) return;
                const joinParams = new URLSearchParams(window.location.search);
                const inviteCode = joinParams.get('invite');
                const legacyJoinId = joinParams.get('join');
                if (!inviteCode && !legacyJoinId) return;
                processedInviteRef.current = true;

                const processJoin = async () => {
                    if (legacyJoinId) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setDialog({ type: 'alert', title: '舊邀請連結已停用', message: '資料庫已升級，請向專案擁有者索取 v2 新邀請連結。' });
                        return;
                    }

                    const separatorIndex = inviteCode.indexOf('.');
                    const projectId = separatorIndex > 0 ? inviteCode.slice(0, separatorIndex) : '';
                    const inviteId = separatorIndex > 0 ? inviteCode.slice(separatorIndex + 1) : '';
                    if (!projectId || !inviteId) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setDialog({ type: 'alert', title: '邀請連結無效', message: '邀請連結格式錯誤。' });
                        return;
                    }

                    try {
                        const inviteSnap = await getDoc(inviteRefFor(projectId, inviteId));
                        if (!inviteSnap.exists() || inviteSnap.data().status !== 'active') throw new Error('邀請連結已失效或已被撤銷。');

                        let existingMembership = null;
                        try {
                            const memberSnap = await getDoc(memberRefFor(projectId, user.uid));
                            if (memberSnap.exists()) existingMembership = memberSnap.data();
                        } catch (membershipError) {
                            if (membershipError.code !== 'permission-denied') throw membershipError;
                        }

                        const joinedAt = new Date().toISOString();
                        const batch = writeBatch(db);
                        if (!existingMembership) {
                            batch.set(memberRefFor(projectId, user.uid), {
                                role: 'editor',
                                inviteId,
                                joinedAt,
                                displayName: user.displayName || '',
                                email: user.email || ''
                            });
                        }
                        batch.set(userProjectRefFor(user.uid, projectId), {
                            role: existingMembership?.role || 'editor',
                            joinedAt: existingMembership?.joinedAt || joinedAt
                        }, { merge: true });
                        await batch.commit();

                        const projectSnap = await getDoc(projectRefFor(projectId));
                        if (!projectSnap.exists()) throw new Error('找不到這個專案，可能已被刪除。');
                        const cloudData = { id: projectSnap.id, ...projectSnap.data(), currentUserRole: existingMembership?.role || 'editor' };
                        setCurrentProjectId(projectId);
                        setActiveProjectData(cloudData);
                        setView('activeProject');
                        setDialog({ type: 'alert', title: '已加入共編', message: `「${cloudData.name}」已加入你的專案清單。之後換裝置登入同一個 Google 帳號也找得到。` });
                    } catch (error) {
                        console.error('Join project error:', error);
                        setDialog({ type: 'alert', title: '無法加入專案', message: error.message || '請確認邀請連結是否有效。' });
                    } finally {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                };
                processJoin();
            }, [user]);

            useEffect(() => {
                if (!user || !currentProjectId || view !== 'activeProject') return;
                const unsubscribe = onSnapshot(projectRefFor(currentProjectId), snapshot => {
                    if (!snapshot.exists()) {
                        setDialog({ type: 'alert', title: '專案已刪除', message: '這個共編專案已被擁有者刪除。' });
                        deleteDoc(userProjectRefFor(user.uid, currentProjectId)).catch(() => {});
                        setProjects(prev => prev.filter(project => project.id !== currentProjectId));
                        setActiveProjectData(null);
                        setCurrentProjectId(null);
                        setView('projectList');
                        return;
                    }
                    const snapshotProject = snapshot.data();
                    const oldRole = activeProjectRef.current?.currentUserRole || (snapshotProject.ownerId === user.uid ? 'owner' : 'editor');
                    const pendingUpdate = pendingProjectUpdateRef.current?.projectId === currentProjectId ? pendingProjectUpdateRef.current : null;
                    const displayData = pendingUpdate
                        ? applyDataOperations(snapshotProject.data || {}, pendingUpdate.operations)
                        : snapshotProject.data;
                    const cloudData = {
                        id: snapshot.id,
                        ...snapshotProject,
                        data: displayData,
                        name: getProjectDisplayName(snapshotProject.type, displayData),
                        currentUserRole: oldRole
                    };
                    activeProjectRef.current = cloudData;
                    setActiveProjectData(cloudData);
                    setProjects(prev => prev.map(project => project.id === cloudData.id ? { ...cloudData, currentUserRole: project.currentUserRole || oldRole } : project));
                }, error => {
                    console.error('Project sync error:', error);
                    setDialog({ type: 'alert', title: '共編中斷', message: '你可能已離開此專案，或目前網路連線不穩定。' });
                });
                return () => unsubscribe();
            }, [user, currentProjectId, view]);

            const showMessage = (opt) => setDialog({ type: 'alert', title: opt.title || '提示', message: opt.message });

            const createProject = async (type) => {
                if (!user) return showMessage({ message: '請先使用 Google 帳號登入。' });
                const now = new Date().toISOString();
                const projectId = createInviteToken();
                const newProject = {
                    id: projectId,
                    schemaVersion: DATA_SCHEMA_VERSION,
                    name: type === 'dining' ? '未命名聚餐' : '未命名旅遊',
                    type,
                    ownerId: user.uid,
                    ownerName: user.displayName || '',
                    createdAt: now,
                    updatedAt: now,
                    data: type === 'dining'
                        ? { title: '', date: now.split('T')[0], people: [{ id: 1, name: '', payerId: 1 }, { id: 2, name: '', payerId: 2 }], totalBill: '', serviceChargeType: 'percent', serviceChargeValue: 10, splitMode: 'even', customAmounts: {}, diningItems: [], billPayerId: 1, invoiceMeta: null }
                        : { name: '', days: 1, people: [{id: 1, name: '', payerId: 1}, {id: 2, name: '', payerId: 2}], expenses: [] }
                };
                try {
                    const batch = writeBatch(db);
                    batch.set(projectRefFor(projectId), newProject);
                    batch.set(memberRefFor(projectId, user.uid), {
                        role: 'owner',
                        joinedAt: now,
                        displayName: user.displayName || '',
                        email: user.email || ''
                    });
                    batch.set(userProjectRefFor(user.uid, projectId), { role: 'owner', joinedAt: now });
                    await batch.commit();
                    const localProject = { ...newProject, currentUserRole: 'owner' };
                    setProjects(prev => [localProject, ...prev.filter(project => project.id !== projectId)]);
                    setCurrentProjectId(projectId);
                    setActiveProjectData(localProject);
                    setView('activeProject');
                } catch (error) {
                    console.error('Create project error:', error);
                    showMessage({ title: '建立失敗', message: '尚未成功建立雲端專案，請檢查網路或 Firebase 權限設定。' });
                }
            };

            const removeOwnedProject = async project => {
                const members = await getDocs(collection(db, 'apps', DATA_SPACE, 'projects', project.id, 'members'));
                const invites = await getDocs(collection(db, 'apps', DATA_SPACE, 'projects', project.id, 'invites'));
                if (members.size + invites.size > 450) throw new Error('專案成員或邀請資料過多，請由管理者協助刪除。');
                const batch = writeBatch(db);
                members.docs.forEach(memberDoc => batch.delete(memberDoc.ref));
                invites.docs.forEach(inviteDoc => batch.delete(inviteDoc.ref));
                batch.delete(projectRefFor(project.id));
                batch.delete(userProjectRefFor(user.uid, project.id));
                await batch.commit();
            };

            const handleRemoveProject = (project, event) => {
                event.stopPropagation();
                const isOwner = project.currentUserRole === 'owner' || project.ownerId === user?.uid;
                setDialog({
                    type: 'confirm',
                    title: isOwner ? '永久刪除專案' : '離開共編專案',
                    message: isOwner
                        ? '確定要永久刪除這個專案嗎？所有協作者都會失去存取權，且無法復原。'
                        : '確定要從自己的清單移除並離開這個共編專案嗎？專案本身不會被刪除。',
                    confirmText: isOwner ? '永久刪除' : '確認離開',
                    onConfirm: async () => {
                        if (!user) return;
                        try {
                            if (isOwner) {
                                await removeOwnedProject(project);
                            } else {
                                const batch = writeBatch(db);
                                batch.delete(memberRefFor(project.id, user.uid));
                                batch.delete(userProjectRefFor(user.uid, project.id));
                                await batch.commit();
                            }
                            setProjects(prev => prev.filter(item => item.id !== project.id));
                        } catch (error) {
                            console.error('Remove project error:', error);
                            showMessage({ title: '操作失敗', message: error.message || '目前無法完成，請稍後再試。' });
                        }
                    }
                });
            };

            const flushPendingProjectUpdate = async () => {
                if (syncInFlightRef.current) return;
                const pendingUpdate = pendingProjectUpdateRef.current;
                const currentUser = auth.currentUser;
                if (!pendingUpdate?.operations?.length || !currentUser) return;

                const projectId = pendingUpdate.projectId;
                const batchLength = pendingUpdate.operations.length;
                const batchOperations = pendingUpdate.operations.slice(0, batchLength);
                syncInFlightRef.current = true;
                let syncFailed = false;

                try {
                    const committedProject = await runTransaction(db, async transaction => {
                        const projectRef = projectRefFor(projectId);
                        const snapshot = await transaction.get(projectRef);
                        if (!snapshot.exists()) throw new Error('找不到共編專案，可能已被刪除。');

                        const latestProject = snapshot.data();
                        const mergedData = applyDataOperations(latestProject.data || {}, batchOperations);
                        const nextProject = {
                            ...latestProject,
                            data: mergedData,
                            name: getProjectDisplayName(latestProject.type, mergedData),
                            updatedAt: new Date().toISOString(),
                            lastUpdatedBy: currentUser.uid
                        };
                        transaction.set(projectRef, nextProject);
                        return { id: snapshot.id, ...nextProject };
                    });

                    const currentPending = pendingProjectUpdateRef.current;
                    let remainingOperations = [];
                    if (currentPending?.projectId === projectId) {
                        remainingOperations = currentPending.operations.slice(batchLength);
                        pendingProjectUpdateRef.current = remainingOperations.length
                            ? { ...currentPending, operations: remainingOperations }
                            : null;
                    }

                    const displayData = applyDataOperations(committedProject.data || {}, remainingOperations);
                    const displayProject = {
                        ...committedProject,
                        data: displayData,
                        name: getProjectDisplayName(committedProject.type, displayData),
                        currentUserRole: activeProjectRef.current?.currentUserRole || (committedProject.ownerId === currentUser.uid ? 'owner' : 'editor')
                    };
                    if (activeProjectRef.current?.id === projectId) {
                        activeProjectRef.current = displayProject;
                        setActiveProjectData(displayProject);
                    }
                    setProjects(prev => prev.map(project => project.id === projectId ? { ...displayProject, currentUserRole: project.currentUserRole || displayProject.currentUserRole } : project));
                } catch (error) {
                    syncFailed = true;
                    console.error('Transaction sync error:', error);
                    showMessage({ title: '同步失敗', message: '這次修改仍保留在畫面上，但尚未同步到雲端；請確認網路後再修改一次。' });
                } finally {
                    syncInFlightRef.current = false;
                    if (!syncFailed && pendingProjectUpdateRef.current?.operations?.length) {
                        if (debounceTimer.current) clearTimeout(debounceTimer.current);
                        debounceTimer.current = setTimeout(flushPendingProjectUpdate, 250);
                    }
                }
            };

            const updateCurrentData = (newData, baseData) => {
                const currentProject = activeProjectRef.current || activeProjectData;
                if (!currentProject || !currentProjectId) return;

                const operations = buildDataOperations(baseData || currentProject.data || {}, newData);
                if (!operations.length) return;

                const existingPending = pendingProjectUpdateRef.current;
                const pendingOperations = existingPending?.projectId === currentProjectId
                    ? [...existingPending.operations, ...operations]
                    : operations;
                pendingProjectUpdateRef.current = { projectId: currentProjectId, operations: pendingOperations };

                const optimisticData = applyDataOperations(currentProject.data || {}, operations);
                const updatedProject = {
                    ...currentProject,
                    data: optimisticData,
                    name: getProjectDisplayName(currentProject.type, optimisticData),
                    updatedAt: new Date().toISOString()
                };
                activeProjectRef.current = updatedProject;
                setActiveProjectData(updatedProject);
                setProjects(prev => prev.map(project => project.id === currentProjectId ? { ...updatedProject, currentUserRole: project.currentUserRole || updatedProject.currentUserRole } : project));

                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                debounceTimer.current = setTimeout(flushPendingProjectUpdate, 800);
            };

            const handleShareProject = async () => {
                if (!user || !currentProjectId || !activeProjectData) return;
                if (activeProjectData.ownerId !== user.uid) return showMessage({ title: '無法建立邀請', message: '只有專案擁有者可以建立共編連結。' });
                try {
                    const inviteId = createInviteToken();
                    await setDoc(inviteRefFor(currentProjectId, inviteId), {
                        status: 'active',
                        createdBy: user.uid,
                        createdAt: new Date().toISOString(),
                        role: 'editor'
                    });
                    const shareUrl = `${window.location.origin}${window.location.pathname}?invite=${currentProjectId}.${inviteId}`;
                    setShareInvite({ url: shareUrl, projectName: activeProjectData.name });
                } catch (error) {
                    console.error('Create invite error:', error);
                    showMessage({ title: '建立邀請失敗', message: '請檢查網路或 Firebase 權限設定。' });
                }
            };

            const handleSignOut = () => {
                setDialog({
                    type: 'confirm',
                    title: '登出 Split Easy',
                    message: '專案仍會安全保存在雲端，下次登入同一個 Google 帳號即可找回。',
                    confirmText: '確認登出',
                    onConfirm: () => signOut(auth).catch(error => console.error('Sign out error:', error))
                });
            };

            if (showSplash || !authReady) return <SplashScreen />;
            if (!user) return <LoginScreen onLogin={handleGoogleLogin} isLoggingIn={isLoggingIn} error={authError} hasInvite={hasPendingInvite} />;

            return (
                <div className="min-h-screen">
                    <DialogModal dialog={dialog} onClose={() => setDialog(null)} />
                    <ShareInviteModal invite={shareInvite} onClose={() => setShareInvite(null)} />
                    <header className="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
                        {view === 'activeProject' ? (
                            <button onClick={() => { setView('projectList'); setCurrentProjectId(null); setActiveProjectData(null); }} className="flex items-center gap-1 text-slate-500 font-bold"><i className="fa-solid fa-arrow-left"></i> 首頁</button>
                        ) : (
                            <div className="flex items-center gap-2 text-teal-600 font-bold text-lg"><i className="fa-solid fa-calculator"></i> Split Easy</div>
                        )}

                        {view === 'activeProject' && activeProjectData ? (
                            <div className="flex items-center gap-2">
                                <h1 className="font-bold text-sm text-slate-800 truncate max-w-[105px]">{activeProjectData.name}</h1>
                                {activeProjectData.ownerId === user.uid ? <button onClick={handleShareProject} className="bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-teal-200 transition"><i className="fa-solid fa-user-plus"></i> 邀請共編</button> : <span className="bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full text-xs font-bold">協作者</span>}
                            </div>
                        ) : (
                            <div className="flex items-center gap-2">
                                {user.photoURL ? <img src={user.photoURL} alt="Google 帳號頭像" className="w-8 h-8 rounded-full" referrerPolicy="no-referrer" /> : <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center"><i className="fa-solid fa-user"></i></div>}
                                <span className="text-xs font-bold text-slate-600 max-w-[90px] truncate">{user.displayName || user.email}</span>
                                <button onClick={handleSignOut} aria-label="登出" className="p-2 text-slate-400 hover:text-red-500"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                            </div>
                        )}
                    </header>

                    <main className="max-w-md mx-auto min-h-[calc(100vh-60px)] relative bg-slate-50">
                        {view === 'projectList' && <ProjectList projects={projects} isLoading={projectsLoading} onSelect={(id) => { const selected = projects.find(project => project.id === id); setCurrentProjectId(id); setActiveProjectData(selected || null); setView('activeProject'); }} onCreate={() => setView('createProject')} onRemove={handleRemoveProject} />}
                        {view === 'createProject' && <CreateProjectScreen onCancel={() => setView('projectList')} onCreate={createProject} showMessage={showMessage} />}
                        {view === 'activeProject' && !activeProjectData && <div className="py-20 text-center text-slate-400"><i className="fa-solid fa-spinner fa-spin text-2xl"></i><p className="mt-3 text-sm">正在載入共編專案…</p></div>}
                        {view === 'activeProject' && activeProjectData?.type === 'travel' && <TravelMode projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} />}
                        {view === 'activeProject' && activeProjectData?.type === 'dining' && <DiningMode projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
