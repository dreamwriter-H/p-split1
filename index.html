<body class="bg-slate-50 text-slate-800">

    <script type="text/babel" data-type="module">

        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyAK7SbGI_32ShLGvGeo0S5fa7ZvtxHPBM8",
            authDomain: "spliteasy-2026.firebaseapp.com",
            projectId: "spliteasy-2026",
            storageBucket: "spliteasy-2026.firebasestorage.app",
            messagingSenderId: "759829684406",
            appId: "1:759829684406:web:6d966fc7b7c2da5ed9c617"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // v1.2.0 已移除 Gemini；清除舊版可能留在瀏覽器裡的使用者金鑰。
        try { localStorage.removeItem('splitEasy_apiKey'); } catch (error) {}

        // --- 工具 ---
        const copyToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); } catch (err) { console.error(err); }
            document.body.removeChild(textArea);
        };

        const createInviteToken = () => {
            if (window.crypto?.randomUUID) return window.crypto.randomUUID();
            const bytes = new Uint8Array(24);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
        };

        const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(amount);
        const ANIMAL_NAMES = ['水豚君', '小海獺', '胖企鵝', '圓仔', '吉娃娃', '樹懶', '蜜袋鼯', '柯基', '兔兔', '招財貓'];

        const parseTaiwanInvoiceQrCodes = (rawCodes) => window.SplitEasyInvoice.parse(rawCodes);
        
        const getPersonNameHelper = (id, people) => {
            const p = people.find(x => x.id === parseInt(id));
            if (!p) return '未知';
            const idx = people.findIndex(x => x.id === parseInt(id));
            return p.name || ANIMAL_NAMES[(p.id + idx) % ANIMAL_NAMES.length];
        };

        // --- 旅遊結算邏輯 ---
        const calculateSettlementHelper = (data) => {
            try {
                let balances = {}; 
                const people = data.people || [];
                people.forEach(p => balances[p.id] = 0);

                const expenses = data.expenses || [];

                expenses.forEach(exp => {
                    if (!exp || !exp.payers || !exp.splitBetween) return;
                    const amount = parseFloat(exp.amount) || 0;
                    
                    Object.entries(exp.payers).forEach(([pId, amt]) => {
                        const cleanAmt = parseFloat(amt) || 0; 
                        balances[pId] = (balances[pId] || 0) + cleanAmt;
                    });

                    const splitCount = exp.splitBetween.length;
                    if (splitCount > 0) {
                        const perPerson = amount / splitCount;
                        exp.splitBetween.forEach(pId => {
                            if (balances[pId] !== undefined) balances[pId] -= perPerson;
                            else balances[pId] = (balances[pId] || 0) - perPerson;
                        });
                    }
                });

                people.forEach(p => {
                    if (p.payerId && p.payerId !== p.id) {
                        const mainPayerId = p.payerId;
                        const boundBalance = balances[p.id] || 0;
                        if (balances[mainPayerId] !== undefined) {
                            balances[mainPayerId] += boundBalance; 
                            balances[p.id] = 0; 
                        }
                    }
                });

                let debtors = [], creditors = [];
                Object.entries(balances).forEach(([id, amt]) => {
                    const val = Math.round(amt * 100) / 100;
                    if (val < -1) debtors.push({ id: parseInt(id), amount: val });
                    if (val > 1) creditors.push({ id: parseInt(id), amount: val });
                });

                debtors.sort((a, b) => a.amount - b.amount);
                creditors.sort((a, b) => b.amount - a.amount);

                const transactions = [];
                let i = 0, j = 0;
                let safety = 0;

                while (i < debtors.length && j < creditors.length && safety < 3000) {
                    safety++;
                    const debtor = debtors[i];
                    const creditor = creditors[j];
                    if(!debtor || !creditor) break;

                    const amount = Math.min(Math.abs(debtor.amount), creditor.amount);
                    if (amount < 0.01) {
                        if(Math.abs(debtor.amount) < creditor.amount) i++; else j++;
                        continue;
                    }

                    transactions.push({ from: debtor.id, to: creditor.id, amount });
                    debtor.amount += amount;
                    creditor.amount -= amount;

                    if (Math.abs(debtor.amount) < 1) i++;
                    if (creditor.amount < 1) j++;
                }

                return {
                    overview: people.map(p => ({ id: p.id, name: getPersonNameHelper(p.id, people), balance: balances[p.id] || 0, payerId: p.payerId })),
                    transactions,
                    error: false
                };
            } catch (e) {
                console.error("Critical Settlement Error:", e);
                return { overview: [], transactions: [], error: true };
            }
        };

        // --- UI 元件 ---
        const DialogModal = ({ dialog, onClose }) => {
            if (!dialog) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl transform scale-100 transition-transform">
                        <div className="flex items-center gap-3 mb-4">
                            {dialog.type === 'confirm' ? 
                                <div className="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-500"><i className="fa-solid fa-circle-question text-xl"></i></div> :
                                <div className="w-10 h-10 rounded-full bg-teal-100 flex items-center justify-center text-teal-600"><i className="fa-solid fa-circle-info text-xl"></i></div>
                            }
                            <h3 className="font-bold text-lg">{dialog.title || '系統提示'}</h3>
                        </div>
                        <p className="text-slate-600 text-sm mb-6 whitespace-pre-wrap">{dialog.message}</p>
                        <div className="flex gap-3 justify-end">
                            {dialog.type === 'confirm' && <button onClick={onClose} className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">取消</button>}
                            <button onClick={() => { if(dialog.onConfirm) dialog.onConfirm(); onClose(); }} className="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-bold shadow-md hover:bg-slate-900">
                                {dialog.confirmText || '確定'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const WalletSetupScreen = ({ people, onUpdate, onNext, onBack, showMessage }) => {
            const [localPeople, setLocalPeople] = useState(people);
            const [selectedId, setSelectedId] = useState(null);
            
            const handleBind = (childId, parentId) => { setLocalPeople(prev => prev.map(p => p.id === childId ? { ...p, payerId: parentId } : p)); };
            const handleUnbind = (childId) => { setLocalPeople(prev => prev.map(p => p.id === childId ? { ...p, payerId: p.id } : p)); };
            const handleSave = () => { onUpdate(localPeople); onNext(); };

            const handleAvatarClick = (id, isMaster) => {
                if (selectedId === null) {
                    const hasChildren = localPeople.some(p => p.payerId === id && p.id !== id);
                    if (isMaster && hasChildren) return showMessage({ message: "這個錢包已經有成員了，請先將成員移出，才能移動這個錢包主。" });
                    setSelectedId(id);
                } else {
                    if (selectedId === id) { setSelectedId(null); return; }
                    handleBind(selectedId, id);
                    setSelectedId(null);
                }
            };

            const wallets = localPeople.filter(p => !p.payerId || p.payerId === p.id).map(master => ({
                master, children: localPeople.filter(child => child.payerId === master.id && child.id !== master.id)
            }));

            return (
                <div className="p-6 h-full flex flex-col animate-fade-in">
                    <h2 className="text-2xl font-bold mb-2">誰幫誰付錢？</h2>
                    <p className="text-slate-500 text-sm mb-6">點選 A 頭像，再點選 B 頭像，即可將 A 併入 B 的錢包（共同結算）。</p>

                    <div className="flex-1 overflow-y-auto content-start grid grid-cols-2 gap-4 auto-rows-min">
                        {wallets.map(w => {
                            const masterName = getPersonNameHelper(w.master.id, localPeople);
                            return (
                                <div key={w.master.id} onClick={() => handleAvatarClick(w.master.id, true)} className={`relative p-4 rounded-2xl border-2 transition-all flex flex-col items-center justify-center min-h-[140px] ${selectedId === w.master.id ? 'border-teal-500 bg-teal-50 ring-2 ring-teal-200 scale-105 z-10' : 'border-slate-200 bg-white hover:border-teal-300'} ${selectedId !== null && selectedId !== w.master.id ? 'animate-pulse cursor-pointer border-dashed border-teal-400' : ''}`}>
                                    <div className="w-16 h-16 rounded-full bg-gradient-to-br from-orange-100 to-amber-100 flex items-center justify-center text-2xl font-bold text-orange-600 shadow-sm mb-2">{masterName[0]}</div>
                                    <span className="font-bold text-slate-700 truncate max-w-full">{masterName}</span>
                                    {w.children.length > 0 && <span className="text-xs text-slate-400">錢包主</span>}
                                    {w.children.length > 0 && (
                                        <div className="mt-3 flex flex-wrap justify-center gap-2 bg-slate-50 w-full p-2 rounded-xl border border-slate-100">
                                            {w.children.map(child => {
                                                const childName = getPersonNameHelper(child.id, localPeople);
                                                return (
                                                    <div key={child.id} onClick={(e) => { e.stopPropagation(); handleUnbind(child.id); }} className="flex items-center gap-1 bg-white px-2 py-1 rounded-full shadow-sm text-xs text-slate-600 border border-slate-200 cursor-pointer hover:bg-red-50 hover:text-red-500 hover:border-red-200">
                                                        <div className="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center text-[8px]">{childName[0]}</div>{childName}<i className="fa-solid fa-xmark ml-1 opacity-50"></i>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                    {selectedId === w.master.id && <div className="absolute -top-2 -right-2 bg-teal-600 text-white text-xs px-2 py-1 rounded-full animate-bounce">移動中...</div>}
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-auto pt-4 flex gap-4">
                        <button onClick={onBack} className="flex-1 p-4 rounded-xl bg-slate-100 font-bold text-slate-600">上一步</button>
                        <button onClick={handleSave} className="flex-1 p-4 rounded-xl bg-teal-600 font-bold text-white shadow-lg">確認分組 ({wallets.length} 組)</button>
                    </div>
                </div>
            );
        };

        const SplashScreen = ({ fadeOut }) => (
            <div className={`fixed inset-0 bg-teal-500 flex flex-col items-center justify-center z-50 transition-opacity duration-500 ${fadeOut ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                <div className="bg-white p-6 rounded-3xl shadow-2xl transform scale-110 mb-8 animate-bounce">
                    <i className="fa-solid fa-calculator text-6xl text-teal-600"></i>
                </div>
                <h1 className="text-3xl font-black text-white tracking-wider mb-2">Split Easy</h1>
                <p className="text-teal-100 text-lg font-medium">P人也懂用的「出遊分帳器」</p>
                <p className="text-teal-200 text-sm font-bold mt-1 tracking-widest">(專屬邀請共編版)</p>
                <div className="mt-8 flex gap-2">
                    <div className="w-2 h-2 bg-white rounded-full animate-ping"></div>
                    <div className="w-2 h-2 bg-white rounded-full animate-ping delay-75"></div>
                    <div className="w-2 h-2 bg-white rounded-full animate-ping delay-150"></div>
                </div>
            </div>
        );

        const ProjectList = ({ projects, onSelect, onCreate, onDelete }) => (
            <div className="p-6 animate-fade-in pb-24">
                <div className="mb-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">我的記帳本 <span className="relative flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-teal-500"></span></span></h2>
                        <p className="text-slate-500 text-sm">專屬包廂清單</p>
                    </div>
                </div>
                {projects.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-2xl border-2 border-dashed border-slate-200">
                        <i className="fa-regular fa-folder-open text-4xl text-slate-300 mb-2"></i>
                        <p className="text-slate-400">目前沒有任何紀錄</p>
                        <p className="text-slate-400 text-xs">趕快開始一個新的旅程吧！</p>
                    </div>
                ) : (
                    <div className="space-y-4">
                        {projects.map(p => (
                            <div key={p.id} onClick={() => onSelect(p.id)} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:border-teal-300 transition-all cursor-pointer active:scale-98 group relative">
                                <div className="flex justify-between items-start">
                                    <div className="flex gap-4">
                                        <div className={`p-3 rounded-full h-fit w-12 h-12 flex items-center justify-center ${p.type === 'travel' ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'}`}><i className={`fa-solid ${p.type === 'travel' ? 'fa-map' : 'fa-mug-hot'} text-xl`}></i></div>
                                        <div>
                                            <h3 className="font-bold text-lg text-slate-800">{p.name}</h3>
                                            <p className="text-xs text-slate-400 mt-1">最後更新: {new Date(p.updatedAt).toLocaleTimeString()}</p>
                                            <span className={`text-[10px] px-2 py-0.5 rounded-full mt-2 inline-block ${p.type === 'travel' ? 'bg-blue-50 text-blue-500' : 'bg-orange-50 text-orange-500'}`}>{p.type === 'travel' ? '多日旅遊' : '單次聚餐'}</span>
                                        </div>
                                    </div>
                                    <button onClick={(e) => onDelete(p.id, e)} className="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition"><i className="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
                <button onClick={onCreate} className="fixed bottom-8 right-6 w-14 h-14 bg-teal-600 text-white rounded-full shadow-xl flex items-center justify-center hover:scale-110 transition active:scale-95 z-20"><i className="fa-solid fa-plus text-xl"></i></button>
            </div>
        );

        const CreateProjectScreen = ({ onCancel, onCreate, showMessage }) => {
            const [type, setType] = useState(null);
            const handleCreate = () => { if (!type) return showMessage({ message: "請選擇一種類型" }); onCreate(type); };
            return (
                <div className="p-6 h-full flex flex-col animate-slide-up">
                    <h2 className="text-2xl font-bold mb-2">開始新的記帳</h2>
                    <p className="text-sm text-slate-500 mb-6">先選擇用途，下一步再設定這次活動的名稱。</p>
                    <div className="flex-1 space-y-6">
                        <div>
                            <label className="block text-sm font-bold text-slate-500 mb-2">選擇記帳類型</label>
                            <div className="grid grid-cols-1 gap-4">
                                <button onClick={() => setType('dining')} className={`p-4 rounded-2xl border-2 flex items-center gap-4 transition-all ${type === 'dining' ? 'border-orange-500 bg-orange-50 ring-2 ring-orange-200' : 'border-slate-100 bg-white hover:border-orange-200'}`}>
                                    <div className="bg-orange-100 p-3 rounded-full text-orange-600 w-12 h-12 flex items-center justify-center"><i className="fa-solid fa-mug-hot text-xl"></i></div>
                                    <div className="text-left"><h3 className="font-bold text-slate-800">單次聚餐</h3><p className="text-xs text-slate-500">適合餐廳拆帳、服務費計算</p></div>
                                    {type === 'dining' && <i className="fa-solid fa-circle-check ml-auto text-orange-500"></i>}
                                </button>
                                <button onClick={() => setType('travel')} className={`p-4 rounded-2xl border-2 flex items-center gap-4 transition-all ${type === 'travel' ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-200' : 'border-slate-100 bg-white hover:border-blue-200'}`}>
                                    <div className="bg-blue-100 p-3 rounded-full text-blue-600 w-12 h-12 flex items-center justify-center"><i className="fa-solid fa-map text-xl"></i></div>
                                    <div className="text-left"><h3 className="font-bold text-slate-800">多日旅遊</h3><p className="text-xs text-slate-500">適合連續記帳、複雜代墊</p></div>
                                    {type === 'travel' && <i className="fa-solid fa-circle-check ml-auto text-blue-500"></i>}
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="mt-auto flex gap-4 pt-6">
                        <button onClick={onCancel} className="flex-1 p-4 rounded-xl bg-slate-100 font-bold text-slate-600">取消</button>
                        <button onClick={handleCreate} disabled={!type} className="flex-1 p-4 rounded-xl bg-teal-600 font-bold text-white shadow-lg disabled:opacity-50">開始設定</button>
                    </div>
                </div>
            );
        };

        const TaiwanInvoiceScannerModal = ({ people, onClose, onApply, showMessage }) => {
            const fileInputRef = useRef(null);
            const [rawCodes, setRawCodes] = useState([]);
            const [manualText, setManualText] = useState('');
            const [parsed, setParsed] = useState(null);
            const [editableItems, setEditableItems] = useState([]);
            const [isScanning, setIsScanning] = useState(false);

            const prepareEditableItems = (result) => {
                if (result.status !== 'ready') {
                    setEditableItems([]);
                    return;
                }
                const participantIds = people.map(person => person.id);
                let nextItems = (result.items || []).map((item, index) => ({
                    id: `invoice-${Date.now()}-${index}`,
                    name: item.name,
                    amount: String(Math.round(item.amount * 100) / 100),
                    participantIds: [...participantIds]
                }));
                const itemTotal = nextItems.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                const invoiceTotal = result.invoice?.totalAmount || 0;
                const difference = Math.round((invoiceTotal - itemTotal) * 100) / 100;
                if (nextItems.length === 0 && invoiceTotal > 0) {
                    nextItems = [{ id: `invoice-total-${Date.now()}`, name: '電子發票總額', amount: String(invoiceTotal), participantIds: [...participantIds] }];
                } else if (invoiceTotal > 0 && Math.abs(difference) >= 0.01) {
                    nextItems.push({ id: `invoice-adjustment-${Date.now()}`, name: difference < 0 ? '發票折扣／差額' : '發票稅額／差額', amount: String(difference), participantIds: [...participantIds] });
                }
                setEditableItems(nextItems);
            };

            const consumeCodes = (codes) => {
                const uniqueCodes = [...new Set(codes.map(code => String(code || '').trim()).filter(Boolean))];
                const result = parseTaiwanInvoiceQrCodes(uniqueCodes);
                setRawCodes(uniqueCodes);
                setParsed(result);
                prepareEditableItems(result);
            };

            const handleFile = async (event) => {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;
                if (!window.Html5Qrcode) return showMessage({ title: '掃描元件未載入', message: '請確認網路連線後重新開啟頁面；也可以先用下方手動貼上 QR 內容。' });
                setIsScanning(true);
                const scanner = new window.Html5Qrcode('invoice-qr-reader');
                try {
                    const decodedText = await scanner.scanFile(file, true);
                    consumeCodes([...rawCodes, decodedText]);
                } catch (error) {
                    console.warn('QR 掃描失敗：', error);
                    showMessage({ title: '沒有讀到 QR', message: '請讓單一 QR 碼充滿畫面、保持清晰且避免反光，再重新拍攝。' });
                } finally {
                    try { await scanner.clear(); } catch (error) {}
                    setIsScanning(false);
                }
            };

            const handleManualParse = () => {
                const pastedCodes = manualText.split(/\r?\n/).map(value => value.trim()).filter(Boolean);
                if (!pastedCodes.length) return showMessage({ message: '請先貼上左方或右方 QR 的文字內容。' });
                consumeCodes([...rawCodes, ...pastedCodes]);
                setManualText('');
            };

            const updateEditableItem = (id, patch) => setEditableItems(items => items.map(item => item.id === id ? { ...item, ...patch } : item));
            const removeEditableItem = (id) => setEditableItems(items => items.filter(item => item.id !== id));
            const addEditableItem = () => setEditableItems(items => [...items, { id: `invoice-manual-${Date.now()}`, name: '', amount: '', participantIds: people.map(person => person.id) }]);
            const currentTotal = editableItems.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

            const handleApply = () => {
                const items = editableItems.filter(item => item.name.trim() && Number.isFinite(parseFloat(item.amount)) && parseFloat(item.amount) !== 0);
                if (!parsed?.invoice || !items.length) return showMessage({ message: '請先讀取發票並保留至少一筆有效品項。' });
                onApply({
                    items,
                    invoice: { ...parsed.invoice, importedAt: new Date().toISOString(), itemCount: items.length }
                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-[9998] flex items-end sm:items-center justify-center sm:p-4 animate-fade-in">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto shadow-2xl">
                        <div className="sticky top-0 bg-white z-10 px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                            <div><h3 className="font-black text-lg">掃描臺灣電子發票</h3><p className="text-xs text-slate-400">左右 QR 可分兩次拍攝</p></div>
                            <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 text-slate-500"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="p-5 space-y-5">
                            <div className="rounded-2xl bg-teal-50 border border-teal-100 p-4">
                                <p className="font-bold text-teal-800 text-sm"><i className="fa-solid fa-qrcode mr-2"></i>先拍左邊，再拍右邊</p>
                                <p className="text-xs text-teal-700 mt-1">左方包含發票號碼與總額；右方通常接續商品明細。拍完仍可手動校正。</p>
                                <button onClick={() => fileInputRef.current?.click()} disabled={isScanning} className="w-full mt-3 bg-teal-600 disabled:opacity-50 text-white p-3 rounded-xl font-bold shadow-sm">
                                    {isScanning ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>辨識中</> : <><i className="fa-solid fa-camera mr-2"></i>{rawCodes.length ? '再拍一個 QR' : '拍攝／選擇 QR 圖片'}</>}
                                </button>
                                <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
                                <div id="invoice-qr-reader" className="hidden"></div>
                            </div>

                            <details className="rounded-xl border border-slate-200 p-3">
                                <summary className="text-xs font-bold text-slate-500 cursor-pointer">無法拍攝？手動貼上 QR 文字</summary>
                                <textarea value={manualText} onChange={event => setManualText(event.target.value)} rows="3" className="w-full mt-3 p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono" placeholder="左、右 QR 各放一行"></textarea>
                                <button onClick={handleManualParse} className="w-full mt-2 p-2 rounded-lg bg-slate-800 text-white text-sm font-bold">解析貼上的內容</button>
                            </details>

                            {parsed && (
                                <div className={`rounded-2xl border p-4 ${parsed.status === 'ready' ? 'bg-white border-slate-200' : 'bg-amber-50 border-amber-200'}`}>
                                    <p className={`text-sm font-bold ${parsed.status === 'ready' ? 'text-slate-800' : 'text-amber-800'}`}>{parsed.message}</p>
                                    {parsed.status === 'ready' && <div className="grid grid-cols-2 gap-3 mt-3 text-xs"><div><span className="text-slate-400">發票號碼</span><p className="font-bold">{parsed.invoice.invoiceNumber}</p></div><div><span className="text-slate-400">日期</span><p className="font-bold">{parsed.invoice.date || '未提供'}</p></div><div><span className="text-slate-400">發票總額</span><p className="font-bold text-teal-700">{formatMoney(parsed.invoice.totalAmount)}</p></div><div><span className="text-slate-400">賣方統編</span><p className="font-bold">{parsed.invoice.sellerId}</p></div></div>}
                                </div>
                            )}

                            {parsed?.status === 'ready' && (
                                <div className="space-y-3">
                                    <div className="flex items-end justify-between"><div><h4 className="font-bold">確認匯入品項</h4><p className="text-xs text-slate-400">名稱與金額都可以修改</p></div><span className="text-sm font-black text-teal-700">{formatMoney(currentTotal)}</span></div>
                                    {editableItems.map((item, index) => <div key={item.id} className="grid grid-cols-[1fr_100px_32px] gap-2 items-center"><input value={item.name} onChange={event => updateEditableItem(item.id, { name: event.target.value })} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm" placeholder={`品項 ${index + 1}`} /><input type="number" value={item.amount} onChange={event => updateEditableItem(item.id, { amount: event.target.value })} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-right" placeholder="金額" /><button onClick={() => removeEditableItem(item.id)} className="text-slate-300 hover:text-red-500"><i className="fa-solid fa-trash"></i></button></div>)}
                                    <button onClick={addEditableItem} className="w-full p-3 rounded-xl border-2 border-dashed border-slate-200 text-slate-500 text-sm font-bold"><i className="fa-solid fa-plus mr-2"></i>補一筆品項</button>
                                </div>
                            )}

                            <div className="rounded-xl bg-amber-50 border border-amber-100 p-3 text-xs text-amber-800"><i className="fa-solid fa-triangle-exclamation mr-1"></i>本功能只解析發票 QR 內容，不會向財政部查驗真偽；匯入前請核對紙本總額。發票照片不會儲存或上傳。</div>
                            <button onClick={handleApply} disabled={parsed?.status !== 'ready' || editableItems.length === 0} className="w-full p-4 rounded-xl bg-orange-500 disabled:opacity-40 text-white font-black shadow-lg">確認並匯入混合分攤</button>
                        </div>
                    </div>
                </div>
            );
        };

        const DiningMode = ({ projectData, onUpdate, showMessage }) => {
            const [step, setStep] = useState(1);
            const [showInvoiceScanner, setShowInvoiceScanner] = useState(false);
            const withDiningDefaults = (source) => ({
                ...source,
                customAmounts: source.customAmounts || {},
                diningItems: source.diningItems || [],
                billPayerId: source.billPayerId || source.people?.[0]?.id || null,
                invoiceMeta: source.invoiceMeta || null
            });
            const [data, setData] = useState(() => withDiningDefaults(projectData));

            useEffect(() => { setData(withDiningDefaults(projectData)); }, [projectData]);
            useEffect(() => { if (JSON.stringify(data) !== JSON.stringify(projectData)) onUpdate(data); }, [data]);

            const updateData = (key, value) => setData(prev => ({ ...prev, [key]: value }));
            const addPerson = () => { setData(prev => ({...prev, people: [...prev.people, { id: Date.now(), name: '' }] })); };
            const removePerson = (id) => {
                if (data.people.length <= 1) return;
                setData(prev => {
                    const people = prev.people.filter(p => p.id !== id);
                    const diningItems = (prev.diningItems || []).map(item => ({ ...item, participantIds: (item.participantIds || []).filter(personId => personId !== id) }));
                    const customAmounts = { ...prev.customAmounts };
                    delete customAmounts[id];
                    return { ...prev, people, diningItems, customAmounts, billPayerId: prev.billPayerId === id ? people[0]?.id : prev.billPayerId };
                });
            };
            const updatePersonName = (id, name) => setData(prev => ({ ...prev, people: prev.people.map(p => p.id === id ? { ...p, name } : p) }));
            const getDisplayName = (person, index) => person.name || ANIMAL_NAMES[(person.id + index) % ANIMAL_NAMES.length];
            const getCustomSubtotal = () => data.people.reduce((sum, person) => sum + Math.max(0, parseFloat(data.customAmounts[person.id]) || 0), 0);
            const getMixedSubtotal = () => Math.max(0, (data.diningItems || []).reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0));
            const updateCustomAmount = (personId, value) => setData(prev => {
                const customAmounts = { ...prev.customAmounts, [personId]: value };
                const totalBill = prev.people.reduce((sum, person) => sum + Math.max(0, parseFloat(customAmounts[person.id]) || 0), 0);
                return { ...prev, customAmounts, totalBill };
            });
            const createDiningItem = (people = data.people) => ({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, name: '', amount: '', participantIds: people.map(p => p.id) });
            const selectMixedMode = () => setData(prev => ({ ...prev, splitMode: 'mixed', diningItems: prev.diningItems?.length ? prev.diningItems : [createDiningItem(prev.people)] }));
            const addDiningItem = () => setData(prev => ({ ...prev, diningItems: [...(prev.diningItems || []), createDiningItem(prev.people)] }));
            const updateDiningItem = (itemId, patch) => setData(prev => ({ ...prev, diningItems: (prev.diningItems || []).map(item => item.id === itemId ? { ...item, ...patch } : item) }));
            const deleteDiningItem = (itemId) => setData(prev => ({ ...prev, diningItems: (prev.diningItems || []).filter(item => item.id !== itemId) }));
            const toggleItemParticipant = (item, personId) => {
                const participantIds = (item.participantIds || []).includes(personId)
                    ? item.participantIds.filter(id => id !== personId)
                    : [...(item.participantIds || []), personId];
                updateDiningItem(item.id, { participantIds });
            };
            const toggleAllItemParticipants = (item) => {
                const allPersonIds = data.people.map(person => person.id);
                const selectedIds = (item.participantIds || []).filter(id => allPersonIds.includes(id));
                const isEveryoneSelected = allPersonIds.length > 0 && selectedIds.length === allPersonIds.length;
                updateDiningItem(item.id, { participantIds: isEveryoneSelected ? [] : allPersonIds });
            };
            const handleInvoiceApply = ({ items, invoice }) => {
                const subtotal = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                setData(prev => ({
                    ...prev,
                    splitMode: 'mixed',
                    diningItems: items,
                    totalBill: String(invoice.totalAmount || subtotal),
                    serviceChargeType: 'fixed',
                    serviceChargeValue: 0,
                    invoiceMeta: invoice,
                    date: invoice.date || prev.date
                }));
                showMessage({ title: '電子發票已匯入', message: `已帶入 ${items.length} 筆品項。發票總額已含稅，因此服務費已歸零；接著請為每筆品項選擇分攤成員。` });
            };
            const goToResult = () => {
                if (data.splitMode === 'custom' && getCustomSubtotal() <= 0) {
                    showMessage({ message: '請至少輸入一位成員的套餐金額。' });
                    return;
                }
                if (data.splitMode === 'mixed') {
                    const validItems = (data.diningItems || []).filter(item => Math.abs(parseFloat(item.amount) || 0) > 0);
                    if (validItems.length === 0) return showMessage({ message: '請至少新增一筆有金額的聚餐品項。' });
                    if (validItems.some(item => !(item.participantIds || []).length)) return showMessage({ message: '每一筆品項至少要選擇一位分攤成員。' });
                }
                setStep(4);
            };
            const getBillPreview = () => {
                const subtotal = data.splitMode === 'custom' ? getCustomSubtotal() : data.splitMode === 'mixed' ? getMixedSubtotal() : Math.max(0, parseFloat(data.totalBill) || 0);
                const serviceValue = Math.max(0, parseFloat(data.serviceChargeValue) || 0);
                const serviceCharge = data.serviceChargeType === 'percent' ? subtotal * (serviceValue / 100) : serviceValue;
                return { subtotal, serviceCharge, total: subtotal + serviceCharge };
            };

            const calculateResult = () => {
                const bill = data.splitMode === 'custom' ? getCustomSubtotal() : data.splitMode === 'mixed' ? getMixedSubtotal() : Math.max(0, parseFloat(data.totalBill) || 0);
                const scValue = Math.max(0, parseFloat(data.serviceChargeValue) || 0);
                let final = 0, scAmt = 0;
                if (data.serviceChargeType === 'percent') { scAmt = bill * (scValue / 100); final = bill + scAmt; } else { scAmt = scValue; final = bill + scAmt; }
                const results = [];
                if (data.splitMode === 'even') {
                    const per = final / data.people.length;
                    data.people.forEach((p, i) => results.push({ id: p.id, name: getDisplayName(p, i), amount: per, detail: `均攤` }));
                } else if (data.splitMode === 'custom') {
                    data.people.forEach((p, i) => {
                        const raw = Math.max(0, parseFloat(data.customAmounts[p.id]) || 0);
                        let personFinal = 0;
                        if (data.serviceChargeType === 'percent') personFinal = raw * (1 + (scValue / 100));
                        else { const ratio = bill > 0 ? (raw / bill) : (1 / data.people.length); personFinal = raw + (scAmt * ratio); }
                        results.push({ id: p.id, name: getDisplayName(p, i), amount: personFinal, detail: `個人餐點 ${formatMoney(raw)}` });
                    });
                } else {
                    const rawShares = Object.fromEntries(data.people.map(p => [p.id, 0]));
                    const itemNames = Object.fromEntries(data.people.map(p => [p.id, []]));
                    (data.diningItems || []).forEach(item => {
                        const amount = parseFloat(item.amount) || 0;
                        const participantIds = (item.participantIds || []).filter(id => data.people.some(p => p.id === id));
                        if (!amount || !participantIds.length) return;
                        const share = amount / participantIds.length;
                        participantIds.forEach(id => {
                            rawShares[id] = (rawShares[id] || 0) + share;
                            itemNames[id].push(item.name?.trim() || '未命名品項');
                        });
                    });
                    data.people.forEach((p, i) => {
                        const raw = rawShares[p.id] || 0;
                        const service = data.serviceChargeType === 'percent' ? raw * (scValue / 100) : (bill > 0 ? scAmt * (raw / bill) : 0);
                        results.push({ id: p.id, name: getDisplayName(p, i), amount: raw + service, detail: itemNames[p.id].join('、') || '未分攤品項' });
                    });
                }
                const roundedTotal = Math.round(final);
                const roundedResults = results.map((result, index) => ({ ...result, amount: Math.floor(result.amount), fraction: result.amount - Math.floor(result.amount), index }));
                let remaining = roundedTotal - roundedResults.reduce((sum, result) => sum + result.amount, 0);
                [...roundedResults].sort((a, b) => b.fraction - a.fraction || a.index - b.index).forEach(result => {
                    if (remaining > 0) { roundedResults[result.index].amount += 1; remaining -= 1; }
                });
                return { finalTotal: roundedTotal, serviceChargeAmount: scAmt, results: roundedResults, payerId: data.billPayerId || data.people[0]?.id };
            };

            return (
                <div className="pb-20">
                    <div className="flex gap-1 h-1 mb-6 px-6 pt-6">{[1, 2, 3, 4].map(s => <div key={s} className={`flex-1 rounded-full ${s <= step ? 'bg-orange-500' : 'bg-slate-200'}`} />)}</div>
                    {step === 1 && (
                        <div className="px-6 animate-fade-in">
                            <h2 className="text-2xl font-bold mb-6">這次聚餐是...</h2>
                            <div className="space-y-4">
                                <div><label className="block text-sm font-medium text-slate-500 mb-1">聚餐名稱</label><input type="text" placeholder="例如：慶祝小明升職" className="w-full p-4 rounded-xl bg-white border border-slate-200 outline-none" value={data.title} onChange={e => updateData('title', e.target.value)} /></div>
                                <div><label className="block text-sm font-medium text-slate-500 mb-1">日期</label><input type="date" className="w-full p-4 rounded-xl bg-white border border-slate-200 outline-none" value={data.date} onChange={e => updateData('date', e.target.value)} /></div>
                            </div>
                            <button onClick={() => setStep(2)} className="w-full mt-8 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">下一步</button>
                        </div>
                    )}
                    {step === 2 && (
                        <div className="px-6 animate-fade-in">
                            <h2 className="text-2xl font-bold mb-2">誰有來吃？</h2>
                            <div className="space-y-3 mb-6 max-h-[60vh] overflow-y-auto pr-2">
                                {data.people.map((p, idx) => (
                                    <div key={p.id} className="flex gap-2 items-center">
                                        <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-lg">{idx + 1}</div>
                                        <input type="text" placeholder={getDisplayName(p, idx)} className="flex-1 p-3 rounded-xl bg-white border border-slate-200 outline-none" value={p.name} onChange={e => updatePersonName(p.id, e.target.value)} />
                                        {data.people.length > 1 && <button onClick={() => removePerson(p.id)} className="p-3 text-slate-400 hover:text-red-500"><i className="fa-solid fa-trash"></i></button>}
                                    </div>
                                ))}
                                <button onClick={addPerson} className="flex items-center gap-2 text-orange-600 font-medium p-2 hover:bg-orange-50 rounded-lg transition w-full justify-center border border-dashed border-orange-300"><i className="fa-solid fa-plus"></i> 新增成員</button>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setStep(1)} className="flex-1 bg-slate-100 text-slate-600 p-4 rounded-xl font-bold">上一步</button>
                                <button onClick={() => setStep(3)} className="flex-1 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">下一步</button>
                            </div>
                        </div>
                    )}
                    {step === 3 && (
                        <div className="px-6 animate-fade-in">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold">帳單金額</h2>
                                <button onClick={() => setShowInvoiceScanner(true)} className="flex items-center gap-1 text-xs font-bold px-3 py-2 rounded-full shadow-sm transition bg-gradient-to-r from-teal-500 to-emerald-500 text-white hover:opacity-90 relative z-10">
                                    <i className="fa-solid fa-qrcode"></i> 掃描電子發票
                                </button>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
                                {data.splitMode === 'even' ? <div><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">餐點小計</label><div className="relative"><i className="fa-solid fa-dollar-sign absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="number" min="0" placeholder="0" className="w-full pl-10 pr-4 py-4 rounded-xl border border-slate-200 text-2xl font-bold outline-none bg-slate-50" value={data.totalBill} onChange={e => updateData('totalBill', e.target.value)} /></div></div> : <p className="text-xs text-orange-600">{data.splitMode === 'mixed' ? '各筆共享或個人品項會在下方自動加總。' : '個別套餐會在下方自動加總，不需要重複填寫餐點小計。'}</p>}
                                <div>
                                    <div className="flex justify-between items-center mb-2"><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider">服務費</label><div className="flex bg-slate-100 rounded-lg p-1"><button onClick={() => updateData('serviceChargeType', 'percent')} className={`px-3 py-1 text-xs rounded-md transition ${data.serviceChargeType === 'percent' ? 'bg-white shadow text-orange-600 font-bold' : 'text-slate-500'}`}>%</button><button onClick={() => updateData('serviceChargeType', 'fixed')} className={`px-3 py-1 text-xs rounded-md transition ${data.serviceChargeType === 'fixed' ? 'bg-white shadow text-orange-600 font-bold' : 'text-slate-500'}`}>$</button></div></div>
                                    <input type="number" min="0" className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 font-medium outline-none" value={data.serviceChargeValue} onChange={e => updateData('serviceChargeValue', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">分帳方式</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={() => updateData('splitMode', 'even')} className={`p-3 rounded-xl border-2 transition text-center ${data.splitMode === 'even' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-100 text-slate-500'}`}>完全均攤</button>
                                        <button onClick={() => updateData('splitMode', 'custom')} className={`p-3 rounded-xl border-2 transition text-center ${data.splitMode === 'custom' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-100 text-slate-500'}`}>各付各的</button>
                                        <button onClick={selectMixedMode} className={`p-3 rounded-xl border-2 transition text-center ${data.splitMode === 'mixed' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-100 text-slate-500'}`}>混合分攤</button>
                                    </div>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">這次由誰先付款？</label><select className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 font-medium" value={data.billPayerId || data.people[0]?.id} onChange={e => updateData('billPayerId', parseInt(e.target.value))}>{data.people.map((person, index) => <option key={person.id} value={person.id}>{getDisplayName(person, index)}</option>)}</select><p className="text-xs text-slate-400 mt-1">結算時會顯示其他人應轉給付款人的金額。</p></div>
                                <div className="rounded-2xl bg-gradient-to-br from-slate-800 to-slate-700 text-white p-5 shadow-lg"><p className="text-sm font-medium text-slate-300">預估應付總額</p><p className="text-4xl font-black mt-1 tracking-tight">{formatMoney(getBillPreview().total)}</p><div className="mt-4 pt-3 border-t border-white/20 flex items-center justify-between text-sm"><span className="text-slate-300">套餐合計 <span className="text-white font-bold">{formatMoney(getBillPreview().subtotal)}</span></span><span className="text-slate-300">服務費 <span className="text-white font-bold">{formatMoney(getBillPreview().serviceCharge)}</span></span></div></div>
                                {data.splitMode === 'custom' && (
                                    <div className="space-y-3 pt-4 border-t border-slate-100">
                                        <div><p className="text-sm font-bold text-slate-700">逐人輸入套餐</p><p className="text-xs text-slate-500 mt-1">填寫每個人的餐點小計；百分比服務費會直接加到各自餐點，固定服務費則依餐點比例分攤。</p></div>
                                        {data.people.map((p, idx) => (
                                            <div key={p.id} className="flex justify-between items-center">
                                                <span className="text-sm font-medium w-24 truncate">{getDisplayName(p, idx)}</span>
                                                <div className="flex items-center gap-2"><span className="text-slate-400 text-sm">$</span><input type="number" min="0" placeholder="套餐小計" className="w-32 p-2 text-right rounded-lg border border-slate-200 bg-slate-50 outline-none" value={data.customAmounts[p.id] || ''} onChange={e => updateCustomAmount(p.id, e.target.value)} /></div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {data.splitMode === 'mixed' && (
                                    <div className="space-y-4 pt-4 border-t border-slate-100">
                                        <div><p className="text-sm font-bold text-slate-700">共享與個人品項</p><p className="text-xs text-slate-500 mt-1">每筆可選全員、部分成員或單一成員分攤。</p></div>
                                        {(data.diningItems || []).map((item, itemIndex) => {
                                            const selectedCount = (item.participantIds || []).length;
                                            const shareLabel = selectedCount === data.people.length ? '全員共享' : selectedCount === 1 ? '個人負擔' : selectedCount > 1 ? `${selectedCount} 人共享` : '尚未選人';
                                            return (
                                                <div key={item.id} className="rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-3">
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-orange-600">品項 {itemIndex + 1}・{shareLabel}</span><button onClick={() => deleteDiningItem(item.id)} className="text-slate-300 hover:text-red-500 p-1" aria-label={`刪除品項 ${itemIndex + 1}`}><i className="fa-solid fa-trash"></i></button></div>
                                                    <div className="grid grid-cols-[1fr_110px] gap-2"><input type="text" placeholder="例如：包廂費、酒水、主餐" className="w-full p-3 rounded-xl border border-slate-200 bg-white" value={item.name} onChange={e => updateDiningItem(item.id, { name: e.target.value })} /><div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">$</span><input type="number" placeholder="金額" className="w-full pl-7 pr-2 py-3 rounded-xl border border-slate-200 bg-white text-right" value={item.amount} onChange={e => updateDiningItem(item.id, { amount: e.target.value })} /></div></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-slate-500">誰要分攤？</span><button type="button" onClick={() => toggleAllItemParticipants(item)} aria-pressed={selectedCount === data.people.length} aria-label={selectedCount === data.people.length ? '取消全員分攤' : '選取全員分攤'} className={`text-xs font-bold px-3 py-1.5 rounded-full border transition ${selectedCount === data.people.length ? 'bg-teal-100 text-teal-700 border-teal-200' : 'bg-white text-teal-600 border-teal-200'}`}><i className={`fa-solid ${selectedCount === data.people.length ? 'fa-check-double' : 'fa-users'} mr-1`}></i>全員</button></div>
                                                    <div className="flex flex-wrap gap-2">{data.people.map((person, index) => { const selected = (item.participantIds || []).includes(person.id); return <button key={person.id} onClick={() => toggleItemParticipant(item, person.id)} className={`px-3 py-2 rounded-full text-sm border transition ${selected ? 'bg-teal-100 text-teal-700 border-teal-200 font-bold' : 'bg-white text-slate-400 border-slate-200'}`}>{getDisplayName(person, index)} {selected && <i className="fa-solid fa-check ml-1 text-xs"></i>}</button>; })}</div>
                                                </div>
                                            );
                                        })}
                                        <button onClick={addDiningItem} className="w-full p-3 rounded-xl border-2 border-dashed border-orange-300 text-orange-600 font-bold hover:bg-orange-50"><i className="fa-solid fa-plus mr-2"></i>新增一筆品項</button>
                                    </div>
                                )}
                            </div>
                            <div className="flex gap-4 mt-8">
                                <button onClick={() => setStep(2)} className="flex-1 bg-slate-100 text-slate-600 p-4 rounded-xl font-bold">上一步</button>
                                <button onClick={goToResult} className="flex-1 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">開始計算</button>
                            </div>
                        </div>
                    )}
                    {step === 4 && <DiningResult data={data} calculation={calculateResult()} onBack={() => setStep(3)} showMessage={showMessage} />}
                    {showInvoiceScanner && <TaiwanInvoiceScannerModal people={data.people} onClose={() => setShowInvoiceScanner(false)} onApply={handleInvoiceApply} showMessage={showMessage} />}
                </div>
            );
        };

        const DiningResult = ({ data, calculation, onBack, showMessage }) => {
            const resultRef = useRef(null);
            const { finalTotal, serviceChargeAmount, results, payerId } = calculation;
            const payerIndex = data.people.findIndex(person => person.id === payerId);
            const payerName = payerIndex >= 0 ? getPersonNameHelper(payerId, data.people) : '付款人';
            const transfers = results.filter(result => result.id !== payerId && result.amount > 0).map(result => ({ from: result.name, to: payerName, amount: result.amount }));
            const resultText = [`${data.title || '本次聚餐'}｜總額 ${formatMoney(finalTotal)}`, `付款人：${payerName}`, ...results.map(result => `．${result.name}負擔 ${formatMoney(result.amount)}${result.detail ? `（${result.detail}）` : ''}`), '', ...transfers.map(item => `．${item.from} 轉給 ${item.to} ${formatMoney(item.amount)}`)].join('\n');

            const handleDownloadImage = async () => {
                if (resultRef.current && window.html2canvas) { 
                    const canvas = await window.html2canvas(resultRef.current, { scale: 2 }); 
                    const link = document.createElement('a'); 
                    link.download = `${data.title}_分帳卡.png`; 
                    link.href = canvas.toDataURL(); 
                    link.click(); 
                }
            };

            return (
                <div className="px-6 animate-fade-in pb-10">
                    <h2 className="text-2xl font-bold mb-4">計算結果</h2>
                    <div ref={resultRef} className="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 mb-6 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-400 to-red-500"></div>
                        <div className="flex justify-between items-end mb-6 pb-6 border-b border-dashed border-slate-200">
                            <div><h3 className="text-xl font-bold text-slate-800">{data.title || '快樂聚餐'}</h3><p className="text-slate-500 text-sm">{data.date}</p></div>
                            <div className="text-right"><p className="text-xs text-slate-400 uppercase">Total</p><p className="text-2xl font-black text-orange-600">{formatMoney(Math.round(finalTotal))}</p></div>
                        </div>
                        <div className="mb-4 rounded-xl bg-orange-50 border border-orange-100 p-3 flex items-center justify-between"><span className="text-sm text-orange-700">本次付款人</span><span className="font-black text-orange-700">{payerName}</span></div>
                        <div className="space-y-3">{results.map((r, i) => (<div key={i} className="flex justify-between items-start gap-3"><span className="font-medium text-slate-700">{r.name}</span><div className="text-right"><span className="block font-bold text-slate-800">{formatMoney(r.amount)}</span>{r.detail && <span className="block text-[10px] text-slate-400 max-w-[190px]">{r.detail}</span>}</div></div>))}</div>
                        {transfers.length > 0 && <div className="mt-6 pt-5 border-t border-dashed border-slate-200"><h4 className="text-xs font-bold text-slate-400 uppercase mb-3">建議轉帳</h4><div className="space-y-2">{transfers.map((item, index) => <div key={index} className="flex justify-between items-center rounded-lg bg-teal-50 px-3 py-2 text-sm"><span><b>{item.from}</b> 轉給 {item.to}</span><b className="text-teal-700">{formatMoney(item.amount)}</b></div>)}</div></div>}
                    </div>
                    <div className="grid grid-cols-2 gap-4 mb-4"><button onClick={() => {copyToClipboard(resultText); showMessage({message: '明細已複製！'});}} className="bg-blue-50 text-blue-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-copy"></i> 複製文字</button><button onClick={handleDownloadImage} className="bg-orange-50 text-orange-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-download"></i> 下載圖片</button></div>
                    <button onClick={onBack} className="w-full bg-slate-100 text-slate-600 p-4 rounded-xl font-bold">修改設定</button>
                </div>
            );
        };

        const TravelMode = ({ projectData, onUpdate, showMessage }) => {
            const normalizeTravelData = (source) => {
                const expenses = (source?.expenses || []).map(expense => ({
                    ...expense,
                    day: Math.max(1, parseInt(expense.day, 10) || 1)
                }));
                const highestExpenseDay = expenses.reduce((highest, expense) => Math.max(highest, expense.day), 1);
                return {
                    ...(source || {}),
                    people: source?.people || [],
                    expenses,
                    days: Math.max(1, parseInt(source?.days, 10) || 1, highestExpenseDay)
                };
            };
            const [tab, setTab] = useState('setup');
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingExpense, setEditingExpense] = useState(null);
            const [trip, setTrip] = useState(() => normalizeTravelData(projectData));
            const [showWalletSetup, setShowWalletSetup] = useState(false);
            const [activeDay, setActiveDay] = useState(1);

            useEffect(() => {
                const normalized = normalizeTravelData(projectData);
                setTrip(normalized);
                setActiveDay(currentDay => Math.min(Math.max(1, currentDay), normalized.days));
            }, [projectData]);
            useEffect(() => { if (JSON.stringify(trip) !== JSON.stringify(projectData)) onUpdate(trip); }, [trip]);

            const tripDayCount = Math.max(1, parseInt(trip.days, 10) || 1);
            const dayNumbers = Array.from({ length: tripDayCount }, (_, index) => index + 1);
            const activeDayExpenses = trip.expenses.filter(expense => (parseInt(expense.day, 10) || 1) === activeDay);
            const activeDayTotal = activeDayExpenses.reduce((sum, expense) => sum + (parseFloat(expense.amount) || 0), 0);
            const tripTotal = trip.expenses.reduce((sum, expense) => sum + (parseFloat(expense.amount) || 0), 0);

            const addPerson = () => {
                const id = Date.now();
                setTrip(prev => ({ ...prev, people: [...prev.people, { id, name: '', payerId: id }] }));
            };
            const removePerson = (id) => { if (trip.people.length > 1) setTrip(prev => ({ ...prev, people: prev.people.filter(p => p.id !== id) })); };
            const addTripDay = () => {
                const nextDay = tripDayCount + 1;
                setTrip(prev => ({ ...prev, days: nextDay }));
                setActiveDay(nextDay);
            };
            const addExpense = (newEx) => {
                const expenseDay = Math.max(1, parseInt(newEx.day, 10) || activeDay);
                setTrip(prev => ({ ...prev, expenses: [...prev.expenses, { ...newEx, day: expenseDay, id: Date.now() }] }));
                setActiveDay(expenseDay);
            };
            const updateExpense = (updated) => {
                const expenseDay = Math.max(1, parseInt(updated.day, 10) || 1);
                setTrip(prev => ({ ...prev, expenses: prev.expenses.map(expense => expense.id === updated.id ? { ...updated, day: expenseDay } : expense) }));
                setActiveDay(expenseDay);
            };
            const deleteExpense = (id) => setTrip(prev => ({ ...prev, expenses: prev.expenses.filter(e => e.id !== id) }));
            const handleEditClick = (expense) => {
                setEditingExpense(expense);
                setActiveDay(Math.max(1, parseInt(expense.day, 10) || 1));
                setShowAddModal(true);
            };

            if (showWalletSetup) return <WalletSetupScreen people={trip.people} onUpdate={(newPeople) => setTrip(prev => ({ ...prev, people: newPeople }))} onNext={() => setShowWalletSetup(false)} onBack={() => setShowWalletSetup(false)} showMessage={showMessage} />;

            return (
                <div className="h-full flex flex-col relative">
                    <div className="flex bg-white border-b border-slate-200">
                        {['setup', 'expenses', 'settle'].map(t => <button key={t} onClick={() => setTab(t)} className={`flex-1 py-3 text-sm font-bold ${tab === t ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>{t === 'setup' ? '設定' : t === 'expenses' ? '記帳' : '結算'}</button>)}
                    </div>
                    <div className="flex-1 overflow-y-auto bg-slate-50 no-scrollbar">
                        {tab === 'setup' && (
                            <div className="p-6 pb-24 space-y-4 bg-white m-4 rounded-2xl shadow-sm">
                                <div><label className="block text-sm text-slate-500 mb-1">旅遊名稱</label><input className="w-full p-3 border rounded-xl bg-slate-50" value={trip.name} onChange={e => setTrip({...trip, name: e.target.value})} /></div>
                                <div><label className="block text-sm text-slate-500 mb-2">成員</label><div className="space-y-2">{trip.people.map((p, idx) => (<div key={p.id} className="flex gap-2"><input className="flex-1 p-2 border rounded-lg" placeholder={getPersonNameHelper(p.id, trip.people)} value={p.name} onChange={e => { const np = [...trip.people]; np[idx].name = e.target.value; setTrip({...trip, people: np}); }} />{trip.people.length > 1 && <button onClick={() => removePerson(p.id)}><i className="fa-solid fa-trash text-slate-300"></i></button>}</div>))}<button onClick={addPerson} className="text-sm text-teal-600 font-bold">+ 新增成員</button></div></div>
                                <div className="pt-4 border-t border-slate-100"><button onClick={() => setShowWalletSetup(true)} className="w-full py-3 bg-teal-50 text-teal-700 rounded-xl font-bold flex items-center justify-center gap-2 border border-teal-200 hover:bg-teal-100"><i className="fa-solid fa-wallet"></i> 設定共同錢包 (家庭/情侶)</button></div>
                            </div>
                        )}
                        {tab === 'expenses' && (
                            <div className="p-4 pb-24">
                                <div className="mb-4">
                                    <div className="flex items-end justify-between gap-3 mb-3">
                                        <div><p className="text-sm font-bold text-slate-700">旅遊日程</p><p className="text-xs text-slate-400 mt-1">可隨時切回前面的天數新增或編輯</p></div>
                                        <button type="button" onClick={addTripDay} className="shrink-0 px-3 py-2 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 text-xs font-bold"><i className="fa-solid fa-plus mr-1"></i>新增一天</button>
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                        {dayNumbers.map(day => {
                                            const expenseCount = trip.expenses.filter(expense => (parseInt(expense.day, 10) || 1) === day).length;
                                            const selected = activeDay === day;
                                            return <button type="button" key={day} onClick={() => setActiveDay(day)} className={`shrink-0 min-w-[88px] px-4 py-3 rounded-xl border text-sm font-bold transition ${selected ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>第 {day} 天 <span className={`ml-1 text-[10px] ${selected ? 'text-blue-100' : 'text-slate-300'}`}>{expenseCount} 筆</span></button>;
                                        })}
                                    </div>
                                </div>
                                <div className="bg-teal-600 text-white p-6 rounded-2xl shadow-lg mb-6">
                                    <div className="flex items-start justify-between gap-3"><p className="text-teal-100 text-sm">第 {activeDay} 天支出</p><span className="text-xs bg-teal-700/50 px-3 py-1 rounded-full whitespace-nowrap">旅程累計 {formatMoney(tripTotal)}</span></div>
                                    <h2 className="text-4xl font-bold mt-1">{formatMoney(activeDayTotal)}</h2>
                                    <div className="mt-4 flex gap-2 text-sm text-teal-100"><span className="bg-teal-700/50 px-3 py-1 rounded-full">{activeDayExpenses.length} 筆</span><span className="bg-teal-700/50 px-3 py-1 rounded-full">{trip.people.length} 人</span></div>
                                </div>
                                <div className="space-y-3">
                                    {activeDayExpenses.length === 0 && <div className="bg-white border border-dashed border-slate-200 rounded-2xl py-10 px-6 text-center"><i className="fa-solid fa-receipt text-2xl text-slate-300"></i><p className="text-sm font-bold text-slate-500 mt-3">第 {activeDay} 天還沒有支出</p><p className="text-xs text-slate-400 mt-1">點右下角的加號新增第一筆</p></div>}
                                    {activeDayExpenses.map((exp) => (
                                        <div key={exp.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                            <div className="flex justify-between items-start mb-2"><div><p className="font-bold text-slate-800">{exp.desc}</p><div className="flex items-center gap-1 mt-1"><i className="fa-solid fa-arrow-right-arrow-left text-xs text-slate-400"></i><p className="text-xs text-slate-500">{Object.keys(exp.payers).map(pid => getPersonNameHelper(pid, trip.people)).join(', ')} 付款</p></div></div><div className="flex items-center gap-2"><span className="font-bold text-teal-600">{formatMoney(exp.amount)}</span><button onClick={() => handleEditClick(exp)} className="p-2 bg-slate-50 rounded text-slate-400" aria-label={`編輯${exp.desc}`}><i className="fa-solid fa-pencil"></i></button><button onClick={() => deleteExpense(exp.id)} className="p-2 bg-slate-50 rounded text-slate-400 hover:text-red-500" aria-label={`刪除${exp.desc}`}><i className="fa-solid fa-trash"></i></button></div></div>
                                            <div className="pt-2 border-t border-slate-50 flex items-start gap-2"><i className="fa-solid fa-users text-xs text-slate-400 mt-1"></i><p className="text-xs text-slate-400">分攤: {exp.splitBetween.length === trip.people.length ? '全員' : exp.splitBetween.map(id => getPersonNameHelper(id, trip.people)).join(', ')}</p></div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => { setEditingExpense(null); setShowAddModal(true); }} aria-label={`新增第 ${activeDay} 天支出`} className="fixed bottom-24 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center z-10"><i className="fa-solid fa-plus text-xl"></i></button>
                            </div>
                        )}
                        {tab === 'settle' && <SettlementView trip={trip} showMessage={showMessage} />}
                    </div>
                    {showAddModal && <AddExpenseModal people={trip.people} dayCount={tripDayCount} defaultDay={activeDay} initialData={editingExpense} onClose={() => { setShowAddModal(false); setEditingExpense(null); }} onAdd={addExpense} onUpdate={updateExpense} getPersonName={(id) => getPersonNameHelper(id, trip.people)} showMessage={showMessage} />}
                </div>
            );
        };

        const SettlementView = ({ trip, showMessage }) => {
            const result = calculateSettlementHelper(trip);
            if (result.error) return <div className="p-6 pb-24 flex flex-col items-center justify-center h-full text-center"><div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i></div><h3 className="font-bold text-xl text-slate-800">資料格式異常</h3><p className="text-slate-500 text-sm mt-2 max-w-xs">偵測到異常，無法結算。</p></div>;
            const { overview, transactions } = result;
            const settlementRef = useRef(null);
            const settlementText = [`${trip.name || '本次旅遊'}｜結算`, ...transactions.map(transaction => `．${getPersonNameHelper(transaction.from, trip.people)} 付給 ${getPersonNameHelper(transaction.to, trip.people)} ${formatMoney(Math.round(transaction.amount))}`)].join('\n');

            const handleDownload = async () => { if (settlementRef.current && window.html2canvas) { const canvas = await window.html2canvas(settlementRef.current, { scale: 2 }); const link = document.createElement('a'); link.download = `結算清單.png`; link.href = canvas.toDataURL(); link.click(); } };

            return (
                <div className="p-6 pb-24">
                    <h2 className="text-2xl font-bold mb-4">結算中心</h2>
                    <div ref={settlementRef} className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 space-y-6">
                        <div className="text-center border-b border-slate-100 pb-4"><h3 className="font-bold text-lg">{trip.name || '本次旅遊'}</h3><p className="text-slate-500 text-xs">建議轉帳路徑</p></div>
                        <div className="space-y-3">{transactions.map((t, i) => (<div key={i} className="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-100"><div className="flex items-center gap-2"><span className="font-bold text-slate-700">{getPersonNameHelper(t.from, trip.people)}</span><span className="text-slate-400 text-xs">給</span><span className="font-bold text-slate-700">{getPersonNameHelper(t.to, trip.people)}</span></div><span className="font-bold text-teal-600">{formatMoney(Math.round(t.amount))}</span></div>))}{transactions.length === 0 && <div className="text-center text-green-600 font-bold py-4">帳目已平！</div>}</div>
                        <div className="pt-4 border-t border-slate-100"><h4 className="text-sm font-bold text-slate-400 uppercase mb-3">個人收支 (含錢包合併)</h4><div className="space-y-2">{overview.map(p => { if (p.payerId && p.payerId !== p.id && p.balance === 0) return null; return (<div key={p.id} className="flex justify-between text-sm"><span>{p.name}</span><span className={p.balance >= 0 ? 'text-blue-600 font-bold' : 'text-red-500 font-bold'}>{p.balance > 0 ? `應收 ${formatMoney(Math.round(p.balance))}` : `應付 ${formatMoney(Math.round(Math.abs(p.balance)))}`}</span></div>); })}</div></div>
                    </div>
                    <button onClick={() => { copyToClipboard(settlementText); showMessage({ message: '結算文字已複製！' }); }} disabled={transactions.length === 0} className="w-full mt-6 bg-blue-50 disabled:opacity-40 text-blue-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-copy"></i> 複製結算文字</button>
                    <button onClick={handleDownload} className="w-full mt-4 bg-slate-800 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-download"></i> 下載結算圖</button>
                </div>
            );
        };

        const AddExpenseModal = ({ people, dayCount, defaultDay, initialData, onClose, onAdd, onUpdate, getPersonName, showMessage }) => {
            const [desc, setDesc] = useState(''); 
            const [amount, setAmount] = useState(''); 
            const [payerMode, setPayerMode] = useState('single'); 
            const [mainPayer, setMainPayer] = useState(people[0]?.id); 
            const [multiPayers, setMultiPayers] = useState({}); 
            const [splitExcludes, setSplitExcludes] = useState([]);
            const safeDayCount = Math.max(1, parseInt(dayCount, 10) || 1);
            const [expenseDay, setExpenseDay] = useState(Math.min(safeDayCount, Math.max(1, parseInt(initialData?.day, 10) || parseInt(defaultDay, 10) || 1)));
            
            useEffect(() => { 
                if (initialData) { 
                    setDesc(initialData.desc); 
                    setAmount(initialData.amount); 
                    if (Object.keys(initialData.payers).length > 1) { 
                        setPayerMode('multi'); 
                        setMultiPayers(initialData.payers); 
                    } else { 
                        setPayerMode('single'); 
                        setMainPayer(parseInt(Object.keys(initialData.payers)[0])); 
                    } 
                    setSplitExcludes(people.filter(p => !initialData.splitBetween.includes(p.id)).map(p => p.id));
                    setExpenseDay(Math.min(safeDayCount, Math.max(1, parseInt(initialData.day, 10) || 1)));
                } else {
                    setExpenseDay(Math.min(safeDayCount, Math.max(1, parseInt(defaultDay, 10) || 1)));
                }
            }, [initialData, defaultDay]);
            
            const handleSubmit = () => { 
                if (!desc.trim() || !amount) return showMessage({message: '請填寫完整'});
                const total = parseFloat(amount);
                if (!Number.isFinite(total) || total <= 0) return showMessage({message: '金額必須大於 0'});
                let payers = {}; 
                if (payerMode === 'single') {
                    payers[mainPayer] = total; 
                } else { 
                    const validPayers = {}; 
                    let sum = 0; 
                    Object.entries(multiPayers).forEach(([pid, val]) => { 
                        const v = parseFloat(val); 
                        if (v > 0) { validPayers[pid] = v; sum += v; } 
                    }); 
                    if (Math.abs(sum - total) > 1) return showMessage({message: `付款金額總和不符 (您輸入了 ${sum}，總額 ${total})`}); 
                    payers = validPayers; 
                } 
                const split = people.filter(p => !splitExcludes.includes(p.id)).map(p => p.id);
                if (split.length === 0) return showMessage({message: '請至少選擇一位分攤成員'});
                const data = { desc: desc.trim(), amount: total, payers, splitBetween: split, day: expenseDay };
                initialData ? onUpdate({...data, id: initialData.id}) : onAdd(data); 
                onClose(); 
            };
            
            const activeSplitCount = people.length - splitExcludes.length; 
            const isAllSplit = activeSplitCount === people.length;
            const handleToggleAll = () => { if (splitExcludes.length === 0) setSplitExcludes(people.map(p => p.id)); else setSplitExcludes([]); };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
                    <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 h-[90vh] sm:h-auto overflow-y-auto animate-slide-up">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold">{initialData ? '編輯' : '新增'}消費</h3><button onClick={onClose} className="text-slate-400 font-bold text-lg">✕</button></div>
                        {/* 替換拍收據按鈕，改為直接觸發提示框 */}
                        {!initialData && (
                            <div className="mb-6">
                                <button onClick={() => showMessage({title: '系統提示', message: '努力更新中，敬請期待！'})} className="flex items-center justify-center gap-2 w-full p-3 rounded-xl border-2 border-dashed border-teal-300 bg-teal-50 text-teal-700 font-bold cursor-pointer hover:bg-teal-100">
                                    <i className="fa-solid fa-camera"></i> 拍收據自動填寫
                                </button>
                            </div>
                        )}
                        <div className="space-y-4">
                            <div><label className="text-xs text-slate-500 font-bold">記在哪一天？</label><select className="w-full p-3 border rounded-xl mt-1 bg-slate-50 font-bold text-slate-700" value={expenseDay} onChange={e => setExpenseDay(parseInt(e.target.value, 10))}>{Array.from({ length: safeDayCount }, (_, index) => index + 1).map(day => <option key={day} value={day}>第 {day} 天</option>)}</select></div>
                            <div><label className="text-xs text-slate-500 font-bold">品項</label><input className="w-full p-3 border rounded-xl mt-1 bg-slate-50" value={desc} onChange={e => setDesc(e.target.value)} /></div>
                            <div><label className="text-xs text-slate-500 font-bold">金額</label><input type="number" className="w-full p-3 border rounded-xl mt-1 text-xl font-bold bg-slate-50" value={amount} onChange={e => setAmount(e.target.value)} /></div>
                            <div className="bg-slate-50 p-4 rounded-xl"><div className="flex justify-between mb-2"><label className="text-xs font-bold text-slate-500">付款人</label><button onClick={() => setPayerMode(m => m === 'single' ? 'multi' : 'single')} className="text-xs text-teal-600 underline">{payerMode === 'single' ? '切換多人' : '切換單人'}</button></div>{payerMode === 'single' ? <select className="w-full p-3 border rounded-xl bg-white" value={mainPayer} onChange={e => setMainPayer(parseInt(e.target.value))}>{people.map(p => <option key={p.id} value={p.id}>{getPersonName(p.id)}</option>)}</select> : <div className="space-y-2">{people.map(p => <div key={p.id} className="flex justify-between items-center"><span className="text-sm">{getPersonName(p.id)}</span><input type="number" className="w-24 p-2 border rounded text-right" value={multiPayers[p.id]||''} onChange={e => setMultiPayers(prev=>({...prev, [p.id]:e.target.value}))} /></div>)}</div>}</div>
                            <div>
