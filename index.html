                        <div className="pt-4 border-t border-slate-100"><h4 className="text-sm font-bold text-slate-400 uppercase mb-3">個人收支 (含錢包合併)</h4><div className="space-y-2">{overview.map(p => { if (p.payerId && p.payerId !== p.id && p.balance === 0) return null; return (<div key={p.id} className="flex justify-between text-sm"><span>{p.name}</span><span className={p.balance >= 0 ? 'text-blue-600 font-bold' : 'text-red-500 font-bold'}>{p.balance > 0 ? `應收 ${formatMoney(Math.round(p.balance))}` : `應付 ${formatMoney(Math.round(Math.abs(p.balance)))}`}</span></div>); })}</div></div>
                        <TravelExpenseDetails groups={expenseGroups} total={expenseTotal} />
                    </div>
                    <button onClick={() => { copyToClipboard(settlementText); showMessage({ message: '結算文字已複製！' }); }} disabled={expenseCount === 0 && transactions.length === 0} className="aa-primary w-full mt-6 bg-blue-50 disabled:opacity-40 text-blue-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-copy"></i> 複製結算文字</button>
                </div>
            );
        };

        const AddExpenseModal = ({ people, dayNumbers, defaultDay, initialData, prefillData, onScanReceipt, onClose, onAdd, onUpdate, getPersonName, showMessage }) => {
            const seedData = initialData || prefillData;
            const [desc, setDesc] = useState(seedData?.desc || ''); 
            const [amount, setAmount] = useState(seedData?.amount || ''); 
            const [payerMode, setPayerMode] = useState('single'); 
            const [mainPayer, setMainPayer] = useState(people[0]?.id); 
            const [multiPayers, setMultiPayers] = useState({}); 
            const [splitExcludes, setSplitExcludes] = useState([]);
            const safeDays = dayNumbers?.length ? dayNumbers : [1];
            const initialDay = parseInt(seedData?.day, 10) || parseInt(defaultDay, 10) || safeDays[0];
            const [expenseDay, setExpenseDay] = useState(safeDays.includes(initialDay) ? initialDay : safeDays[0]);
            
            useEffect(() => { 
                const seed = initialData || prefillData;
                if (seed) { 
                    setDesc(seed.desc || ''); 
                    setAmount(seed.amount || ''); 
                    if (seed.payers && Object.keys(seed.payers).length > 1) { 
                        setPayerMode('multi'); 
                        setMultiPayers(seed.payers); 
                    } else if (seed.payers && Object.keys(seed.payers).length === 1) { 
                        setPayerMode('single'); 
                        setMainPayer(parseInt(Object.keys(seed.payers)[0])); 
                    } else {
                        setPayerMode('single');
                        setMainPayer(people[0]?.id);
                        setMultiPayers({});
                    } 
                    setSplitExcludes(seed.splitBetween ? people.filter(p => !seed.splitBetween.includes(p.id)).map(p => p.id) : []);
                    setExpenseDay(parseInt(seed.day, 10) || parseInt(defaultDay, 10) || safeDays[0]);
                } else {
                    setDesc('');
                    setAmount('');
                    setPayerMode('single');
                    setMainPayer(people[0]?.id);
                    setMultiPayers({});
                    setSplitExcludes([]);
                    setExpenseDay(parseInt(defaultDay, 10) || safeDays[0]);
                }
            }, [initialData, prefillData, defaultDay]);
            
            const handleSubmit = () => { 
                if (!safeDays.includes(expenseDay)) return showMessage({message: '這一天已被刪除；請重新選擇天數，已填內容仍保留。'});
                if (!desc.trim() || !amount) return showMessage({message: '請填寫完整'});
                const total = parseFloat(amount);
                if (!Number.isFinite(total) || total <= 0) return showMessage({message: '金額必須大於 0'});
                let payers = {}; 
                if (payerMode === 'single') {
                    payers[mainPayer] = total; 
                } else { 
                    const validPayers = {}; 
                    let sum = 0; 
                    Object.entries(multiPayers).forEach(([pid, val]) => { 
                        const v = parseFloat(val); 
                        if (v > 0) { validPayers[pid] = v; sum += v; } 
                    }); 
                    if (Math.abs(sum - total) > 1) return showMessage({message: `付款金額總和不符 (您輸入了 ${sum}，總額 ${total})`}); 
                    payers = validPayers; 
                } 
                const split = people.filter(p => !splitExcludes.includes(p.id)).map(p => p.id);
                if (split.length === 0) return showMessage({message: '請至少選擇一位分攤成員'});
                const receiptMeta = initialData?.receiptMeta || prefillData?.receiptMeta || null;
                const data = { desc: desc.trim(), amount: total, payers, splitBetween: split, day: expenseDay, ...(receiptMeta ? { receiptMeta } : {}) };
                const saved = initialData ? onUpdate({...data, id: initialData.id}) : onAdd(data);
                if (saved === false) return;
                onClose(); 
            };
            
            const activeSplitCount = people.length - splitExcludes.length; 
            const isAllSplit = activeSplitCount === people.length;
            const handleToggleAll = () => { if (splitExcludes.length === 0) setSplitExcludes(people.map(p => p.id)); else setSplitExcludes([]); };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
                    <div className="aa-form-modal bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 h-[90vh] sm:h-auto overflow-y-auto animate-slide-up">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold">{initialData ? '編輯' : '新增'}消費</h3><button onClick={onClose} className="text-slate-400 font-bold text-lg">✕</button></div>
                        {!initialData && (
                            <div className="mb-6">
                                <button onClick={onScanReceipt} className="flex items-center justify-center gap-2 w-full p-3 rounded-xl border-2 border-dashed border-teal-300 bg-teal-50 text-teal-700 font-bold cursor-pointer hover:bg-teal-100">
                                    <i className="fa-solid fa-camera"></i> 拍收據自動填寫
                                </button>
                            </div>
                        )}
                        {seedData?.receiptMeta && <div className="mb-4 rounded-xl bg-blue-50 border border-blue-100 p-3 text-xs text-blue-700"><i className="fa-solid fa-receipt mr-1"></i>{seedData.receiptMeta.source === 'taiwan-einvoice' ? '已由臺灣電子發票帶入，請繼續選擇付款人與分攤者。' : `已由海外收據帶入：${seedData.receiptMeta.currency} ${seedData.receiptMeta.originalAmount}，目前以 ${formatMoney(amount || 0)} 記帳。`}</div>}
                        <div className="space-y-4">
                            {!safeDays.includes(expenseDay) && <p role="alert" className="text-sm text-red-600 mb-3">原本的天數已被刪除，請重新選擇天數。已填內容仍保留。</p>}<div><label className="text-xs text-slate-500 font-bold">記在哪一天？</label><select className="w-full p-3 border rounded-xl mt-1 bg-slate-50 font-bold text-slate-700" value={safeDays.includes(expenseDay) ? expenseDay : ''} onChange={e => setExpenseDay(parseInt(e.target.value, 10))}>{!safeDays.includes(expenseDay) && <option value="" disabled>請重新選擇有效天數</option>}{safeDays.map((day,index) => <option key={day} value={day}>第 {index+1} 天</option>)}</select></div>
                            <div><label className="text-xs text-slate-500 font-bold">品項</label><input className="w-full p-3 border rounded-xl mt-1 bg-slate-50" value={desc} onChange={event => applyInputValue(event, setDesc)} /></div>
                            <div><label className="text-xs text-slate-500 font-bold">記帳金額（新臺幣）</label><input type="number" className="w-full p-3 border rounded-xl mt-1 text-xl font-bold bg-slate-50" value={amount} onChange={e => setAmount(e.target.value)} /></div>
                            <div className="bg-slate-50 p-4 rounded-xl"><div className="flex justify-between mb-2"><label className="text-xs font-bold text-slate-500">付款人</label><button onClick={() => setPayerMode(m => m === 'single' ? 'multi' : 'single')} className="text-xs text-teal-600 underline">{payerMode === 'single' ? '切換多人' : '切換單人'}</button></div>{payerMode === 'single' ? <select className="w-full p-3 border rounded-xl bg-white" value={mainPayer} onChange={e => setMainPayer(parseInt(e.target.value))}>{people.map(p => <option key={p.id} value={p.id}>{getPersonName(p.id)}</option>)}</select> : <div className="space-y-2">{people.map(p => <div key={p.id} className="flex justify-between items-center"><span className="text-sm">{getPersonName(p.id)}</span><input type="number" className="w-24 p-2 border rounded text-right" value={multiPayers[p.id]||''} onChange={event => applyInputValue(event, value => setMultiPayers(prev => ({ ...prev, [p.id]: value })))} /></div>)}</div>}</div>
                            <div>
                                <div className="flex justify-between items-center mb-2"><label className="text-xs text-slate-500 font-bold block">分攤給？ <span className="text-teal-600 font-normal">{isAllSplit ? '(預設：全員均攤)' : `(指定 ${activeSplitCount} 人)`}</span></label><button onClick={handleToggleAll} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded transition">{splitExcludes.length === 0 ? '全不選' : '全選'}</button></div>
                                <div className="flex flex-wrap gap-2">{people.map(p => (<button key={p.id} onClick={() => setSplitExcludes(prev => prev.includes(p.id) ? prev.filter(id=>id!==p.id) : [...prev, p.id])} className={`px-3 py-2 rounded-full text-sm border transition-all ${!splitExcludes.includes(p.id) ? 'bg-teal-100 text-teal-700 font-bold border-teal-200' : 'bg-white text-slate-300 border-slate-100'}`}>{getPersonName(p.id)} {!splitExcludes.includes(p.id) && <i className="fa-solid fa-check ml-1 text-xs"></i>}</button>))}</div>
                            </div>
                        </div>
                        <button onClick={handleSubmit} className="w-full mt-8 bg-slate-800 text-white p-4 rounded-xl font-bold shadow-lg">確認</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [authReady, setAuthReady] = useState(false);
            const [splashHoldComplete, setSplashHoldComplete] = useState(false);

            // Keep the cover visible for one additional second after startup is ready.
            useEffect(() => {
                if (!authReady || showSplash) return;
                const timer = window.setTimeout(() => setSplashHoldComplete(true), 1000);
                return () => window.clearTimeout(timer);
            }, [authReady, showSplash]);
            const [authError, setAuthError] = useState('');
            const [authPersistenceWarning, setAuthPersistenceWarning] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [view, setView] = useState('projectList');
            const [projects, setProjects] = useState([]);
            const [projectsLoading, setProjectsLoading] = useState(false);
            const [activeProjectData, setActiveProjectData] = useState(null);
            const [currentProjectId, setCurrentProjectId] = useState(null);
            const [user, setUser] = useState(null);
            const [dialog, setDialog] = useState(null);
            const [shareInvite, setShareInvite] = useState(null);
            const [showCollaborationManager, setShowCollaborationManager] = useState(false);
            const [projectIndexWarning, setProjectIndexWarning] = useState('');
            const [projectListRetryRevision, setProjectListRetryRevision] = useState(0);
            const [activeSyncRevision, setActiveSyncRevision] = useState(0);
            const debounceTimer = useRef(null);
            const activeProjectRef = useRef(null);
            const pendingProjectUpdateRef = useRef(null);
            const syncInFlightRef = useRef(false);
            const recoveryStatusRef = useRef(null);
            const [recoveryBusy, setRecoveryBusy] = useState(false);
            const recoveryBusyRef = useRef(false);
            const [showRecovery, setShowRecovery] = useState(false);
            const [syncConflict, setSyncConflict] = useState(null);
            const processedInviteRef = useRef(false);
            const ensuredIndexKeysRef = useRef(new Set());

            useEffect(() => { activeProjectRef.current = activeProjectData; }, [activeProjectData]);

            const params = new URLSearchParams(window.location.search);
            const hasPendingInvite = Boolean(params.get('invite') || params.get('join'));

            useEffect(() => {
                let mounted = true;
                let unsubscribe = () => {};
                const initializeAuth = async () => {
                    try {
                        await setPersistence(auth, browserLocalPersistence);
                        if (mounted) setAuthPersistenceWarning('');
                    } catch (error) {
                        console.error('Auth persistence error:', error);
                        if (mounted) {
                            const warning = '這個瀏覽器無法長期保存登入狀態。Safari 私密瀏覽或 App 內建瀏覽器可能會在關閉後登出；請改用一般模式的外部 Chrome／Safari。';
                            setAuthPersistenceWarning(warning);
                            setAuthError(warning);
                        }
                    }

                    if (!mounted) return;
                    unsubscribe = onAuthStateChanged(auth, nextUser => {
                        if (!mounted) return;
                        const isGoogleAccount = nextUser?.providerData?.some(provider => provider.providerId === 'google.com');
                        if (nextUser && (nextUser.isAnonymous || !isGoogleAccount)) {
                            signOut(auth).catch(error => console.warn('清除舊匿名登入失敗：', error));
                            setUser(null);
                            setAuthReady(true);
                            setShowSplash(false);
                            return;
                        }
                        setUser(nextUser);
                        setAuthReady(true);
                        setShowSplash(false);
                        if (!nextUser) {
                            setProjects([]);
                            setActiveProjectData(null);
                            setCurrentProjectId(null);
                            setShowCollaborationManager(false);
                            setProjectIndexWarning('');
                            processedInviteRef.current = false;
                            ensuredIndexKeysRef.current.clear();
                            setView('projectList');
                        }
                    });
                };
                initializeAuth();
                const safetyTimer = setTimeout(() => {
                    if (mounted) {
                        setAuthReady(true);
                        setShowSplash(false);
                    }
                }, 8000);
                return () => {
                    mounted = false;
                    clearTimeout(safetyTimer);
                    unsubscribe();
                };
            }, []);

            const handleGoogleLogin = async () => {
                setIsLoggingIn(true);
                setAuthError('');
                const popupTimer = window.setTimeout(() => {
                    setIsLoggingIn(false);
                    setAuthError('沒有看到 Google 登入視窗嗎？這個 App 內建瀏覽器可能會攔截彈出視窗，請將目前網址改用外部 Chrome／Safari 開啟。');
                }, 7000);
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error('Google login error:', error);
                    if (error.code === 'auth/unauthorized-domain') {
                        setAuthError('目前網址尚未加入 Firebase 授權網域，請由管理者完成設定後再試。');
                    } else if (error.code === 'auth/operation-not-allowed') {
                        setAuthError('Firebase 尚未啟用 Google 登入，請由管理者先開啟。');
                    } else if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error.code)) {
                        setAuthError('Google 登入視窗被瀏覽器攔截或關閉，請允許彈出式視窗，或改用外部 Chrome／Safari 開啟。');
                    } else {
                        setAuthError('Google 登入失敗，請確認網路後再試；若正在 App 內建瀏覽器，請改用外部 Chrome／Safari。');
                    }
                } finally {
                    window.clearTimeout(popupTimer);
                    setIsLoggingIn(false);
                }
            };

            useEffect(() => {
                if (!user) return;
                let disposed = false;
                let retryTimer = null;
                let loadGeneration = 0;
                setProjectsLoading(true);
                const indexCollection = userProjectCollectionFor(user.uid);

                const loadIndexSnapshot = async (indexSnapshot, retryRound = 0) => {
                    const generation = ++loadGeneration;
                    if (indexSnapshot.metadata.hasPendingWrites && retryRound === 0) {
                        setProjectIndexWarning('專案目錄正在等待雲端確認，既有索引不會被刪除。');
                        setProjectsLoading(false);
                        return;
                    }
                    try {
                        let unresolvedCount = 0;
                        const loaded = await Promise.all(indexSnapshot.docs.map(async indexDoc => {
                            const indexData = indexDoc.data();
                            try {
                                const cloudProject = await getProjectWithRetry(indexDoc.id, retryRound === 0 ? 3 : 2);
                                if (!cloudProject.exists()) {
                                    unresolvedCount += 1;
                                    return {
                                        id: indexDoc.id,
                                        name: indexData.projectName || '等待確認的專案',
                                        type: indexData.projectType || 'travel',
                                        updatedAt: indexData.lastConfirmedAt || indexData.joinedAt || '',
                                        currentUserRole: indexData.role || 'editor',
                                        accessPending: true
                                    };
                                }
                                return {
                                    id: cloudProject.id,
                                    ...cloudProject.data(),
                                    currentUserRole: indexData.role || (cloudProject.data().ownerId === user.uid ? 'owner' : 'editor')
                                };
                            } catch (projectError) {
                                if (RETRYABLE_PROJECT_READ_CODES.has(projectError?.code)) {
                                    unresolvedCount += 1;
                                    return {
                                        id: indexDoc.id,
                                        name: indexData.projectName || '等待確認的專案',
                                        type: indexData.projectType || 'travel',
                                        updatedAt: indexData.lastConfirmedAt || indexData.joinedAt || '',
                                        currentUserRole: indexData.role || 'editor',
                                        accessPending: true
                                    };
                                }
                                throw projectError;
                            }
                        }));
                        if (disposed || generation !== loadGeneration) return;
                        const cleanProjects = loaded.sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
                        setProjects(cleanProjects);
                        if (unresolvedCount > 0) {
                            setProjectIndexWarning(`有 ${unresolvedCount} 個專案暫時無法確認權限；系統已保留首頁索引並自動重試，不會因單次錯誤刪除。`);
                            if (retryRound < 2) {
                                retryTimer = window.setTimeout(() => loadIndexSnapshot(indexSnapshot, retryRound + 1), 900 * (retryRound + 1));
                            }
                        } else {
                            setProjectIndexWarning('');
                        }
                    } catch (error) {
                        console.error('Project index error:', error);
                        if (!disposed) setProjectIndexWarning('目前無法完整讀取雲端專案；首頁索引已保留，請確認網路後重新整理。');
                    } finally {
                        if (!disposed && generation === loadGeneration) setProjectsLoading(false);
                    }
                };

                const unsubscribe = onSnapshot(indexCollection, { includeMetadataChanges: true }, indexSnapshot => {
                    if (retryTimer) window.clearTimeout(retryTimer);
                    loadIndexSnapshot(indexSnapshot);
                }, error => {
                    console.error('Project list listener error:', error);
                    setProjectsLoading(false);
                    setProjectIndexWarning('目前無法連線到個人專案目錄；既有索引不會被自動刪除。');
                });
                return () => {
                    disposed = true;
                    if (retryTimer) window.clearTimeout(retryTimer);
                    unsubscribe();
                };
            }, [user, projectListRetryRevision]);

            useEffect(() => {
                if (!user || processedInviteRef.current) return;
                const joinParams = new URLSearchParams(window.location.search);
                const inviteCode = joinParams.get('invite');
                const legacyJoinId = joinParams.get('join');
                if (!inviteCode && !legacyJoinId) return;
                processedInviteRef.current = true;

                const processJoin = async () => {
                    if (legacyJoinId) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setDialog({ type: 'alert', title: '舊邀請連結已停用', message: '資料庫已升級，請向專案擁有者索取 v2 新邀請連結。' });
                        return;
                    }

                    const separatorIndex = inviteCode.indexOf('.');
                    const projectId = separatorIndex > 0 ? inviteCode.slice(0, separatorIndex) : '';
                    const inviteId = separatorIndex > 0 ? inviteCode.slice(separatorIndex + 1) : '';
                    if (!projectId || !inviteId) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setDialog({ type: 'alert', title: '邀請連結無效', message: '邀請連結格式錯誤。' });
                        return;
                    }

                    try {
                        const inviteSnap = await getDoc(inviteRefFor(projectId, inviteId));
                        if (!inviteSnap.exists() || inviteSnap.data().status !== 'active') throw new Error('邀請連結已失效或已被撤銷。');

                        let existingMembership = null;
                        try {
                            const memberSnap = await getDoc(memberRefFor(projectId, user.uid));
                            if (memberSnap.exists()) existingMembership = memberSnap.data();
                        } catch (membershipError) {
                            if (membershipError.code !== 'permission-denied') throw membershipError;
                        }

                        const joinedAt = new Date().toISOString();
                        const batch = writeBatch(db);
                        if (!existingMembership) {
                            batch.set(memberRefFor(projectId, user.uid), {
                                role: 'editor',
                                inviteId,
                                joinedAt,
                                displayName: user.displayName || '',
                                email: user.email || ''
                            });
                        }
                        batch.set(userProjectRefFor(user.uid, projectId), {
                            role: existingMembership?.role || 'editor',
                            joinedAt: existingMembership?.joinedAt || joinedAt,
                            lastConfirmedAt: joinedAt
                        }, { merge: true });
                        await batch.commit();

                        const projectSnap = await getProjectWithRetry(projectId);
                        if (!projectSnap.exists()) throw new Error('找不到這個專案，可能已被刪除。');
                        const cloudData = { id: projectSnap.id, ...projectSnap.data(), currentUserRole: existingMembership?.role || 'editor' };
                        try {
                            await ensureUserProjectIndex({
                                uid: user.uid,
                                projectId,
                                role: cloudData.currentUserRole,
                                joinedAt: existingMembership?.joinedAt || joinedAt,
                                project: cloudData
                            });
                            ensuredIndexKeysRef.current.add(`${user.uid}:${projectId}`);
                        } catch (indexError) {
                            console.warn('Post-join index confirmation failed:', indexError);
                            setProjectIndexWarning('已成功加入專案，但首頁索引仍在等待確認；重新開啟邀請連結可再次自動修復。');
                        }
                        setCurrentProjectId(projectId);
                        setActiveProjectData(cloudData);
                        setView('activeProject');
                        setDialog({ type: 'alert', title: '已加入共編', message: `「${cloudData.name}」已加入你的專案清單。之後換裝置登入同一個 Google 帳號也找得到。` });
                    } catch (error) {
                        console.error('Join project error:', error);
                        setDialog({ type: 'alert', title: '無法加入專案', message: error.message || '請確認邀請連結是否有效。' });
                    } finally {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                };
                processJoin();
            }, [user]);

            useEffect(() => {
                if (!user || !currentProjectId || view !== 'activeProject') return;
                let disposed = false;
                const unsubscribe = onSnapshot(projectRefFor(currentProjectId), snapshot => {
                    if (!snapshot.exists()) {
                        setDialog({ type: 'alert', title: '暫時找不到專案', message: '目前無法確認專案是否已刪除；首頁索引會保留，不會因單次讀取結果自動清除。' });
                        setProjectIndexWarning('有專案目前無法確認狀態；索引已保留，請稍後重新整理。');
                        setActiveProjectData(null);
                        setCurrentProjectId(null);
                        setView('projectList');
                        return;
                    }
                    const snapshotProject = snapshot.data();
                    const oldRole = activeProjectRef.current?.currentUserRole || (snapshotProject.ownerId === user.uid ? 'owner' : 'editor');
                    const pendingUpdate = pendingProjectUpdateRef.current?.projectId === currentProjectId ? pendingProjectUpdateRef.current : null;
                    const displayData = pendingUpdate
                        ? applyDataOperations(snapshotProject.data || {}, pendingUpdate.operations)
                        : snapshotProject.data;
                    const cloudData = {
                        id: snapshot.id,
                        ...snapshotProject,
                        data: displayData,
                        name: getProjectDisplayName(snapshotProject.type, displayData),
                        currentUserRole: oldRole
                    };
                    activeProjectRef.current = cloudData;
                    setActiveProjectData(cloudData);
                    setProjects(prev => prev.map(project => project.id === cloudData.id ? { ...cloudData, currentUserRole: project.currentUserRole || oldRole } : project));
                    const indexKey = `${user.uid}:${currentProjectId}`;
                    if (!ensuredIndexKeysRef.current.has(indexKey) && !snapshot.metadata.hasPendingWrites) {
                        ensuredIndexKeysRef.current.add(indexKey);
                        ensureUserProjectIndex({ uid: user.uid, projectId: currentProjectId, role: oldRole, project: cloudData })
                            .catch(error => {
                                ensuredIndexKeysRef.current.delete(indexKey);
                                console.warn('Ensure project index failed:', error);
                                if (!disposed) setProjectIndexWarning('專案內容已讀取，但首頁索引尚未修復；請確認網路後再試。');
                            });
                    }
                }, error => {
                    console.error('Project sync error:', error);
                    if (error.code === 'permission-denied') {
                        getProjectWithRetry(currentProjectId, 3)
                            .then(projectSnapshot => {
                                if (disposed) return;
                                if (projectSnapshot.exists()) {
                                    setActiveSyncRevision(revision => revision + 1);
                                    return;
                                }
                                throw new Error('project-not-found');
                            })
                            .catch(retryError => {
                                if (disposed) return;
                                console.warn('Project permission retry did not recover:', retryError);
                                setActiveProjectData(null);
                                setCurrentProjectId(null);
                                setView('projectList');
                                setProjectIndexWarning('此專案的權限仍無法確認；索引已保留，沒有自動刪除。若你確定已被移除，可由專案擁有者再次分享。');
                                setDialog({ type: 'alert', title: '暫時無法確認共編權限', message: '系統已安全重試，但目前仍無法讀取。可能是短暫連線／登入問題，也可能是擁有者已移除權限；首頁索引不會因此被刪除。' });
                            });
                    } else {
                        setDialog({ type: 'alert', title: '共編中斷', message: '目前網路連線不穩定，請稍後再試。' });
                    }
                });
                return () => {
                    disposed = true;
                    unsubscribe();
                };
            }, [user, currentProjectId, view, activeSyncRevision]);

            const showMessage = (opt) => setDialog({ type: 'alert', title: opt.title || '提示', message: opt.message });

            const createProject = async (type) => {
                if (!user) return showMessage({ message: '請先使用 Google 帳號登入。' });
                const now = new Date().toISOString();
                const projectId = createInviteToken();
                const newProject = {
                    id: projectId,
                    schemaVersion: DATA_SCHEMA_VERSION,
                    name: type === 'dining' ? '未命名聚餐' : '未命名旅遊',
                    type,
                    ownerId: user.uid,
                    ownerName: user.displayName || '',
                    createdAt: now,
                    updatedAt: now,
                    recoveryWriteToken: createInviteToken(), recoveryWriteRevision: 1,
                    data: type === 'dining'
                        ? { title: '', date: now.split('T')[0], people: [{ id: 1, name: '', payerId: 1 }, { id: 2, name: '', payerId: 2 }], totalBill: '', serviceChargeType: 'percent', serviceChargeValue: 10, splitMode: 'even', customAmounts: {}, diningItems: [], billPayerId: 1, invoiceMeta: null }
                        : { name: '', days: 1, people: [{id: 1, name: '', payerId: 1}, {id: 2, name: '', payerId: 2}], expenses: [] }
                };
                try {
                    const batch = writeBatch(db);
                    batch.set(projectRefFor(projectId), newProject);
                    batch.set(memberRefFor(projectId, user.uid), {
                        role: 'owner',
                        joinedAt: now,
                        displayName: user.displayName || '',
                        email: user.email || ''
                    });
                    batch.set(userProjectRefFor(user.uid, projectId), {
                        role: 'owner',
                        joinedAt: now,
                        projectName: newProject.name,
                        projectType: newProject.type,
                        lastConfirmedAt: now
                    });
                    await batch.commit();
                    try {
                        await ensureUserProjectIndex({ uid: user.uid, projectId, role: 'owner', joinedAt: now, project: newProject });
                        ensuredIndexKeysRef.current.add(`${user.uid}:${projectId}`);
                    } catch (indexError) {
                        console.warn('Post-create index confirmation failed:', indexError);
                        setProjectIndexWarning('專案已成功建立，但首頁索引仍在等待確認；系統不會刪除已建立的專案。');
                    }
                    const localProject = { ...newProject, currentUserRole: 'owner' };
                    setProjects(prev => [localProject, ...prev.filter(project => project.id !== projectId)]);
                    setCurrentProjectId(projectId);
                    setActiveProjectData(localProject);
                    setView('activeProject');
                } catch (error) {
                    console.error('Create project error:', error);
                    showMessage({ title: '建立失敗', message: '尚未成功建立雲端專案，請檢查網路或 Firebase 權限設定。' });
                }
            };

            const removeOwnedProject = async project => {
                const members = await getDocs(collection(db, 'apps', DATA_SPACE, 'projects', project.id, 'members'));
                const invites = await getDocs(collection(db, 'apps', DATA_SPACE, 'projects', project.id, 'invites'));
                if ((members.size * 2) + invites.size + 1 > 450) throw new Error('專案成員或邀請資料過多，請由管理者協助刪除。');
                const batch = writeBatch(db);
                members.docs.forEach(memberDoc => {
                    batch.delete(memberDoc.ref);
                    batch.delete(userProjectRefFor(memberDoc.id, project.id));
                });
                invites.docs.forEach(inviteDoc => batch.delete(inviteDoc.ref));
                batch.delete(projectRefFor(project.id));
                await batch.commit();
            };

            const handleRemoveProject = (project, event) => {
                event.stopPropagation();
                const isOwner = project.currentUserRole === 'owner' || project.ownerId === user?.uid;
                setDialog({
                    type: 'confirm',
                    title: isOwner ? '永久刪除專案' : '離開共編專案',
                    message: isOwner
                        ? '確定要永久刪除這個專案嗎？所有協作者都會失去存取權，且無法復原。'
                        : '確定要從自己的清單移除並離開這個共編專案嗎？專案本身不會被刪除。',
                    confirmText: isOwner ? '永久刪除' : '確認離開',
                    onConfirm: async () => {
                        if (!user) return;
                        try {
                            if (isOwner) {
                                await removeOwnedProject(project);
                            } else {
                                const batch = writeBatch(db);
                                batch.delete(memberRefFor(project.id, user.uid));
                                batch.delete(userProjectRefFor(user.uid, project.id));
                                await batch.commit();
                            }
                            setProjects(prev => prev.filter(item => item.id !== project.id));
                        } catch (error) {
                            console.error('Remove project error:', error);
                            showMessage({ title: '操作失敗', message: error.message || '目前無法完成，請稍後再試。' });
                        }
                    }
                });
            };

            const flushPendingProjectUpdate = async () => {
                if (syncInFlightRef.current) return;
                const pendingUpdate = pendingProjectUpdateRef.current;
                const currentUser = auth.currentUser;
                if (!pendingUpdate?.operations?.length || !currentUser) return;
                if (pendingUpdate.actorUid && pendingUpdate.actorUid !== currentUser.uid) {
                    setSyncConflict({ projectId: pendingUpdate.projectId, message: '這份草稿屬於先前登入的帳號，請切回原帳號或先下載備份。' });
                    return;
                }

                const projectId = pendingUpdate.projectId;
                const batchLength = pendingUpdate.operations.length;
                const batchOperations = pendingUpdate.operations.slice(0, batchLength);
                syncInFlightRef.current = true;
                const actionToken = createInviteToken(), actionTime = Date.now();
                let syncFailed = false;

                try {
                    const committedProject = await runTransaction(db, async transaction => {
                        const projectRef = projectRefFor(projectId);
                        const snapshot = await transaction.get(projectRef);
                        if (!snapshot.exists()) throw new Error('找不到共編專案，可能已被刪除。');
                        if (auth.currentUser?.uid !== currentUser.uid) throw new Error('登入帳號已變更，未送出這份草稿。');

                        const latestProject = snapshot.data();
                        assertRecoverableOperations(latestProject, batchOperations);
                        const mergedData = applyDataOperations(latestProject.data || {}, batchOperations);
                        const nextProject = {
                            ...latestProject,
                            data: mergedData,
                            name: getProjectDisplayName(latestProject.type, mergedData),
                            updatedAt: new Date().toISOString(),
                            lastUpdatedBy: currentUser.uid
                        };
                        const auditedProject = window.EntryRecycleBin.appendHistory(latestProject, nextProject, recoveryActor(currentUser), actionToken, actionTime);
                        auditedProject.recoveryWriteToken = actionToken;
                        auditedProject.recoveryWriteRevision = (Number(latestProject.recoveryWriteRevision) || 0) + 1;
                        transaction.set(projectRef, auditedProject);
                        return { id: snapshot.id, ...auditedProject };
                    });

                    setSyncConflict(null);
                    const currentPending = pendingProjectUpdateRef.current;
                    let remainingOperations = [];
                    if (currentPending?.projectId === projectId) {
                        remainingOperations = currentPending.operations.slice(batchLength);
                        pendingProjectUpdateRef.current = remainingOperations.length
                            ? { ...currentPending, operations: remainingOperations }
                            : null;
                    }

                    const displayData = applyDataOperations(committedProject.data || {}, remainingOperations);
                    const displayProject = {
                        ...committedProject,
                        data: displayData,
                        name: getProjectDisplayName(committedProject.type, displayData),
                        currentUserRole: activeProjectRef.current?.currentUserRole || (committedProject.ownerId === currentUser.uid ? 'owner' : 'editor')
                    };
                    if (activeProjectRef.current?.id === projectId) {
                        activeProjectRef.current = displayProject;
                        setActiveProjectData(displayProject);
                    }
                    setProjects(prev => prev.map(project => project.id === projectId ? { ...displayProject, currentUserRole: project.currentUserRole || displayProject.currentUserRole } : project));
                } catch (error) {
                    syncFailed = true;
                    console.error('Transaction sync error:', error);
                    setSyncConflict({ projectId, message: error.message || '目前無法連線。' });
                    showMessage({ title: error.code === 'collab-conflict' ? '共編內容已變更' : '同步失敗', message: `${error.message || '目前無法連線。'}\n\n這次修改尚未寫入雲端。未同步草稿仍保留；可下載備份，再載入最新帳目。` });
                } finally {
                    syncInFlightRef.current = false;
                    if (!syncFailed && pendingProjectUpdateRef.current?.operations?.length) {
                        if (debounceTimer.current) clearTimeout(debounceTimer.current);
                        debounceTimer.current = setTimeout(flushPendingProjectUpdate, 250);
                    }
                }
            };

            const runRecoveryAction = async (projectId, action, payload) => {
                if (recoveryBusyRef.current) return null;
                recoveryBusyRef.current = true;
                setRecoveryBusy(true);
                const clearingHistory = action === 'clear-history';
                try {
                    const currentUser = auth.currentUser;
                    if (!currentUser || activeProjectRef.current?.id !== projectId) throw new Error('請先開啟原本的帳本。');
                    if (syncInFlightRef.current) throw new Error('帳目正在同步，請稍候再試。');
                    if (debounceTimer.current) clearTimeout(debounceTimer.current);
                    if (!clearingHistory) {
                        await flushPendingProjectUpdate();
                        if (syncInFlightRef.current || pendingProjectUpdateRef.current?.operations?.length) throw new Error('還有尚未同步的修改，請先處理未同步草稿再試。');
                    }
                    if (auth.currentUser?.uid !== currentUser.uid || activeProjectRef.current?.id !== projectId) throw new Error('登入或帳本已變更，這次操作未執行。');
                    const token = createInviteToken();
                    const committed = await runTransaction(db, async transaction => {
                        const ref = projectRefFor(projectId), snapshot = await transaction.get(ref);
                        if (!snapshot.exists()) throw new Error('找不到原本的帳本。');
                        if (auth.currentUser?.uid !== currentUser.uid) throw new Error('登入帳號已變更，這次操作未執行。');
                        const latest = snapshot.data(), api = window.EntryRecycleBin, actor = recoveryActor(currentUser);
                        const now = Date.now();
                        const result = action === 'delete' ? api.moveToBin(latest, payload, actor, token, now)
                            : action === 'restore' ? api.restore(latest, payload, actor, token, now)
                            : clearingHistory ? api.clearHistory(latest, payload, actor, now)
                            : api.addDay(latest, actor, token, now);
                        if (result === latest) return { ...latest, id: snapshot.id };
                        const next = { ...result, recoveryWriteToken: token, recoveryWriteRevision: (Number(latest.recoveryWriteRevision) || 0) + 1, updatedAt: new Date(now).toISOString(), lastUpdatedBy: currentUser.uid };
                        transaction.set(ref, next);
                        return { ...next, id: snapshot.id };
                    });
                    const pending = pendingProjectUpdateRef.current;
                    const canResumeDraft = clearingHistory && pending?.projectId === projectId && pending.actorUid === currentUser.uid
                        && pending.operations?.length;
                    const displayData = canResumeDraft ? applyDataOperations(committed.data, pending.operations) : committed.data;
                    const display = { ...committed, data: displayData, name: getProjectDisplayName(committed.type, displayData),
                        currentUserRole: committed.ownerId === currentUser.uid ? 'owner' : 'editor' };
                    if (activeProjectRef.current?.id === projectId) {
                        activeProjectRef.current = display;
                        setActiveProjectData(display);
                    }
                    setProjects(previous => previous.map(project => project.id === projectId ? display : project));
                    if (canResumeDraft) debounceTimer.current = setTimeout(flushPendingProjectUpdate, 800);
                    if (clearingHistory) showMessage({ title: '已整理修改紀錄', message: '最近兩天的品項紀錄已保留。之後的品項異動仍會記錄。' });
                    else if (action !== 'add') showMessage({ title: action === 'restore' ? '已還原' : '已移到回收桶', message: action === 'restore' ? '帳目已還原，修改紀錄也已更新。' : '可在帳本上方的「回收桶與紀錄」找回，保留七天。' });
                    return committed;
                } catch (error) {
                    console.error('Recovery action failed:', error);
                    showMessage({ title: '這次操作未完成', message: error.message || '請確認網路與共編權限後再試。' });
                    return null;
                } finally {
                    recoveryBusyRef.current = false;
                    setRecoveryBusy(false);
                }
            };

            const requestClearHistory = () => {
                const project = activeProjectRef.current;
                if (!project || project.ownerId !== auth.currentUser?.uid) return;
                const ids = window.EntryRecycleBin.getHistoryCleanupIds(project.data);
                if (!ids.length) return showMessage({ title: '沒有舊紀錄需要清理', message: '這個帳本的品項紀錄都在最近兩天內。' });
                setDialog({ type: 'confirm', title: '清除舊紀錄', confirmText: '確定清理',
                    message: `會保留最近 48 小時的品項紀錄，並清除 ${ids.length} 筆較舊或非品項紀錄。清除後無法還原。帳目和回收桶內容會保留。`,
                    onConfirm: () => runRecoveryAction(project.id, 'clear-history', ids) });
            };

            const requestDeleteEntry = (collection, item) => {
                const project = activeProjectRef.current;
                if (!project) return;
                const label = item.desc || item.name || '未命名帳目';
                setDialog({ type: 'confirm', title: '刪除這筆帳目', confirmText: '移到回收桶',
                    message: `確定刪除「${label}」嗎？\n\n刪除後可在回收桶還原，保留七天。若共編者已修改這筆帳目，會請你重新確認。`,
                    onConfirm: () => runRecoveryAction(project.id, 'delete', { kind: 'entry', collection, item: cloneDataValue(item) }) });
            };

            const requestDeleteTravelDay = snapshot => {
                const project = activeProjectRef.current;
                if (!project || project.type !== 'travel') return;
                const days = window.EntryRecycleBin.getDayNumbers(project.data);
                if (days.length <= 1) return showMessage({ message: '至少需要保留一天。' });
                const label = window.EntryRecycleBin.getDayLabel(project.data, snapshot.day);
                setDialog({ type: 'confirm', title: `刪除第 ${label} 天`, confirmText: '整天移到回收桶',
                    message: `這一天有 ${snapshot.expenses.length} 筆支出。確定將整天及所有支出移到回收桶嗎？\n只填品項或金額為 0 的紀錄也會一併保留。\n\n七天內可以整天還原。若有人剛新增或修改當天帳目，本次會停止，請重新確認。`,
                    onConfirm: () => runRecoveryAction(project.id, 'delete', { kind: 'day', snapshot: cloneDataValue(snapshot) }) });
            };

            const addTravelDay = async () => {
                const id = activeProjectRef.current?.id;
                if (!id) return null;
                const result = await runRecoveryAction(id, 'add');
                return result ? window.EntryRecycleBin.getDayNumbers(result.data).at(-1) : null;
            };

            const downloadPendingDraft = () => {
                const pending = pendingProjectUpdateRef.current;
                if (!pending) return;
                const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), projectId: pending.projectId, operations: pending.operations }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob), link = document.createElement('a');
                link.href = url; link.download = `aa-2gether-unsynced-${Date.now()}.json`; link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const requestDiscardConflictingDraft = () => setDialog({ type: 'confirm', title: '捨棄未同步草稿', confirmText: '捨棄並載入最新',
                message: '這會捨棄本機尚未同步的修改，雲端帳目保留。建議先下載未同步修改備份。',
                onConfirm: async () => {
                    if (syncInFlightRef.current || recoveryBusyRef.current) return;
                    const id = activeProjectRef.current?.id;
                    recoveryBusyRef.current = true; setRecoveryBusy(true);
                    try {
                        const snapshot = await getDoc(projectRefFor(id));
                        if (!snapshot.exists() || activeProjectRef.current?.id !== id) throw new Error('目前無法載入原帳本。');
                        if (debounceTimer.current) clearTimeout(debounceTimer.current);
                        pendingProjectUpdateRef.current = null;
                        const latest = { ...snapshot.data(), id, currentUserRole: activeProjectRef.current.currentUserRole };
                        activeProjectRef.current = latest; setActiveProjectData(latest); setSyncConflict(null);
                    } catch (error) { showMessage({ title: '草稿仍保留', message: error.message }); }
                    finally { recoveryBusyRef.current = false; setRecoveryBusy(false); }
                } });

            const hasActiveProject = activeProjectData?.id === currentProjectId;
            useEffect(() => {
                if (!user || !currentProjectId || view !== 'activeProject' || !hasActiveProject) return;
                let disposed = false;
                let inFlight = false;
                const bin = window.EntryRecycleBin;
                const needsMaintenance = (project, now) => !project.recoveryWriteToken || bin.hasExpiredArchives(project.data, now);
                const removeExpiredTrash = async () => {
                    const current = activeProjectRef.current;
                    if (disposed || inFlight || current?.id !== currentProjectId || auth.currentUser?.uid !== user.uid) return;
                    if (!needsMaintenance(current, Date.now())) return;
                    inFlight = true;
                    const token = createInviteToken();
                    try {
                        await runTransaction(db, async transaction => {
                            const ref = projectRefFor(currentProjectId), snapshot = await transaction.get(ref);
                            if (!snapshot.exists() || disposed || auth.currentUser?.uid !== user.uid) return;
                            const latest = snapshot.data(), now = Date.now();
                            if (!needsMaintenance(latest, now)) return;
                            transaction.set(ref, {
                                ...bin.pruneExpired(latest, now),
                                recoveryWriteToken: token,
                                recoveryWriteRevision: (Number(latest.recoveryWriteRevision) || 0) + 1
                            });
                        });
                    } catch (error) { console.warn('回收桶清理將於下次連線重試：', error); }
                    finally { inFlight = false; }
                };
                removeExpiredTrash();
                const timer = window.setInterval(removeExpiredTrash, 60000);
                return () => { disposed = true; window.clearInterval(timer); };
            }, [user, currentProjectId, view, hasActiveProject]);

            const leaveActiveProject = async () => {
                if (recoveryBusyRef.current || syncInFlightRef.current) return showMessage({ message: '帳目正在同步，請稍候再回首頁。' });
                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                await flushPendingProjectUpdate();
                if (pendingProjectUpdateRef.current?.operations?.length) return showMessage({ title: '請先處理未同步草稿', message: '仍有修改尚未寫入雲端。請下載備份，再處理草稿，完成後即可切換帳本。' });
                setShowCollaborationManager(false); setShowRecovery(false); setView('projectList'); setCurrentProjectId(null); setActiveProjectData(null);
            };

            useEffect(() => {
                const beforeUnload = event => {
                    if (!pendingProjectUpdateRef.current?.operations?.length && !syncInFlightRef.current && !recoveryBusyRef.current) return;
                    event.preventDefault(); event.returnValue = '';
                };
                window.addEventListener('beforeunload', beforeUnload);
                return () => window.removeEventListener('beforeunload', beforeUnload);
            }, []);

            useEffect(() => {
                if (!recoveryBusy) return;
                const previous = document.activeElement;
                recoveryStatusRef.current?.focus();
                return () => { if (previous?.isConnected) previous.focus(); };
            }, [recoveryBusy]);

            const updateCurrentData = (newData, baseData) => {
                const currentProject = activeProjectRef.current || activeProjectData;
                const actorUid = auth.currentUser?.uid;
                if (!currentProject || !currentProjectId || !actorUid) return;

                const operations = buildDataOperations(baseData || currentProject.data || {}, newData);
                if (!operations.length) return;
                if (recoveryBusyRef.current) return;

                const existingPending = pendingProjectUpdateRef.current;
                if (existingPending?.actorUid && existingPending.actorUid !== actorUid) {
                    setSyncConflict({ projectId: currentProjectId, message: '瀏覽器還有先前帳號的未同步草稿，請切回原帳號處理。' });
                    return;
                }
                if (existingPending?.operations?.length && existingPending.projectId !== currentProjectId) {
                    showMessage({ title: '另一個帳本還有草稿', message: '請先返回原帳本處理未同步草稿，再修改這個帳本。' });
                    return;
                }
                const pendingOperations = existingPending?.projectId === currentProjectId
                    ? [...existingPending.operations, ...operations]
                    : operations;
                pendingProjectUpdateRef.current = { projectId: currentProjectId, actorUid, operations: pendingOperations };

                const optimisticData = applyDataOperations(currentProject.data || {}, operations);
                const updatedProject = {
                    ...currentProject,
                    data: optimisticData,
                    name: getProjectDisplayName(currentProject.type, optimisticData),
                    updatedAt: new Date().toISOString()
                };
                activeProjectRef.current = updatedProject;
                setActiveProjectData(updatedProject);
                setProjects(prev => prev.map(project => project.id === currentProjectId ? { ...updatedProject, currentUserRole: project.currentUserRole || updatedProject.currentUserRole } : project));

                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                debounceTimer.current = setTimeout(flushPendingProjectUpdate, 800);
            };


            const importDiningToTravel = async (request) => {
                const sourceId=currentProjectId,currentUser=auth.currentUser;
                if(!currentUser || activeProjectRef.current?.type!=='dining') throw new Error('請先開啟要匯入的聚餐。');
                if(syncInFlightRef.current) throw new Error('聚餐正在同步，請稍候再按確認匯入。');
                if(debounceTimer.current) clearTimeout(debounceTimer.current);
                await flushPendingProjectUpdate();
                if(syncInFlightRef.current || pendingProjectUpdateRef.current?.operations?.length) throw new Error('聚餐尚未同步完成，請確認網路後再試。');
                const expenseId='dining-'+createInviteToken(),importedAt=new Date().toISOString();
                const result=await runTransaction(db,async transaction=>{
                    const sourceRef=projectRefFor(sourceId),targetRef=projectRefFor(request.targetProjectId);
                    const sourceSnap=await transaction.get(sourceRef),targetSnap=await transaction.get(targetRef);
                    if(!sourceSnap.exists() || !targetSnap.exists()) throw new Error('找不到聚餐或旅遊專案，請重新開啟確認。');
                    if(auth.currentUser?.uid!==currentUser.uid) throw new Error('登入帳號已變更，尚未匯入。');
                    const source=sourceSnap.data(),target=targetSnap.data();
                    if(source.type!=='dining' || target.type!=='travel') throw new Error('請選擇有效的旅遊專案。');
                    const api=window.SplitEasyDiningImport;
                    if(api.fingerprint(source.data)!==request.sourceFingerprint || api.targetFingerprint(target.data)!==request.targetFingerprint) throw new Error('聚餐內容或旅遊成員已變更，請關閉視窗後重新核對。');
                    const calculation=calculateDiningResult(source.data);
                    const expense=api.build(source.data,target.data,{...request,sourceProjectId:sourceId,expenseId,importedAt},calculation,getDiningExpenseRows(source.data,calculation));
                    const targetData={...target.data,expenses:[...(target.data.expenses || []),expense]};
                    const sourceData={...source.data,travelImport:{targetProjectId:request.targetProjectId,targetProjectName:target.data.name || target.name || '未命名旅遊',expenseId,importedAt}};
                    const updatedSource=window.EntryRecycleBin.appendHistory(source,{...source,data:sourceData,updatedAt:importedAt,lastUpdatedBy:currentUser.uid},recoveryActor(currentUser),expenseId+'-source',importedAt);
                    const updatedTarget=window.EntryRecycleBin.appendHistory(target,{...target,data:targetData,updatedAt:importedAt,lastUpdatedBy:currentUser.uid},recoveryActor(currentUser),expenseId+'-target',importedAt);
                    updatedSource.recoveryWriteToken = expenseId+'-source'; updatedTarget.recoveryWriteToken = expenseId+'-target';
                    updatedSource.recoveryWriteRevision = (Number(source.recoveryWriteRevision) || 0) + 1; updatedTarget.recoveryWriteRevision = (Number(target.recoveryWriteRevision) || 0) + 1;
                    transaction.set(targetRef,updatedTarget);transaction.set(sourceRef,updatedSource);
                    return {source:{id:sourceId,...updatedSource},target:{id:request.targetProjectId,...updatedTarget}};
                });
                setProjects(previous=>previous.map(p=>p.id===sourceId?{...p,...result.source}:p.id===request.targetProjectId?{...p,...result.target}:p));
                if(activeProjectRef.current?.id===sourceId){
                    const updated={...activeProjectRef.current,...result.source};
                    activeProjectRef.current=updated;setActiveProjectData(updated);
                }
                showMessage({title:'匯入完成',message:'已新增一筆聚餐支出，請至旅遊結算查看。這餐改由旅遊統一結算。'});
            };
            const handleShareProject = async () => {
                if (!user || !currentProjectId || !activeProjectData) return false;
                if (activeProjectData.ownerId !== user.uid) {
                    showMessage({ title: '無法建立邀請', message: '只有專案擁有者可以建立共編連結。' });
                    return false;
                }
                try {
                    const inviteId = createInviteToken();
                    await setDoc(inviteRefFor(currentProjectId, inviteId), {
                        status: 'active',
                        createdBy: user.uid,
                        createdAt: new Date().toISOString(),
                        role: 'editor'
                    });
                    const shareUrl = `${window.location.origin}${window.location.pathname}?invite=${currentProjectId}.${inviteId}`;
                    setShareInvite({ url: shareUrl, projectName: activeProjectData.name });
                    return true;
                } catch (error) {
                    console.error('Create invite error:', error);
                    showMessage({ title: '建立邀請失敗', message: '請檢查網路或 Firebase 權限設定。' });
                    return false;
                }
            };

            const handleSignOut = () => {
                setDialog({
                    type: 'confirm',
                    title: '登出 A.A 2GETHER',
                    message: '專案仍會安全保存在雲端，下次登入同一個 Google 帳號即可找回。',
                    confirmText: '確認登出',
                    onConfirm: async () => {
                        if (recoveryBusyRef.current || syncInFlightRef.current) return showMessage({ message: '正在同步，請稍候再登出。' });
                        if (debounceTimer.current) clearTimeout(debounceTimer.current);
                        await flushPendingProjectUpdate();
                        if (pendingProjectUpdateRef.current?.operations?.length) return showMessage({ title: '請先處理未同步草稿', message: '仍有修改尚未寫入雲端，請先下載備份並處理草稿，再登出。' });
                        signOut(auth).catch(error => console.error('Sign out error:', error));
                    }
                });
            };

            if (showSplash || !authReady || !splashHoldComplete) return <SplashScreen />;
            if (!user) return <LoginScreen onLogin={handleGoogleLogin} isLoggingIn={isLoggingIn} error={authError} hasInvite={hasPendingInvite} />;

            return (
                <div className="min-h-screen">
                    <DialogModal dialog={dialog} onClose={() => setDialog(null)} />
                    {recoveryBusy && <div ref={recoveryStatusRef} tabIndex={-1} role="status" aria-live="polite" className="fixed inset-0 z-[10000] bg-black/40 flex items-center justify-center p-6"><p className="bg-white rounded-2xl p-6 text-slate-800 font-bold">正在確認雲端帳目，請稍候…</p></div>}
                    {showRecovery && view === 'activeProject' && activeProjectData && <RecoveryPanel project={activeProjectData} onClose={() => setShowRecovery(false)} busy={recoveryBusy} onRestore={id => runRecoveryAction(activeProjectData.id, 'restore', id)} canClearHistory={activeProjectData.ownerId === user.uid} onClearHistory={requestClearHistory} />}
                    <ShareInviteModal invite={shareInvite} onClose={() => setShareInvite(null)} />
                    {showCollaborationManager && activeProjectData?.ownerId === user.uid && <CollaborationManagerModal project={activeProjectData} user={user} onClose={() => setShowCollaborationManager(false)} onCreateInvite={handleShareProject} requestConfirm={setDialog} showMessage={showMessage} />}
                    <header inert={recoveryBusy ? '' : undefined} className="aa-header bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
                        {view === 'activeProject' ? (
                            <button onClick={leaveActiveProject} className="flex items-center gap-1 text-slate-500 font-bold"><i className="fa-solid fa-arrow-left"></i> 首頁</button>
                        ) : (
                            <div className="brand-header-logo"><img className="brand-logo" src="./assets/brand/aa-2gether-logo.webp" alt="A.A 2GETHER" /></div>
                        )}

                        {view === 'activeProject' && activeProjectData ? (
                            <div className="flex items-center gap-2">
                                <h1 className="font-bold text-sm text-slate-800 truncate max-w-[105px]">{activeProjectData.name}</h1>
                                {activeProjectData.ownerId === user.uid ? <button onClick={() => setShowCollaborationManager(true)} className="bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-teal-200 transition"><i className="fa-solid fa-users-gear"></i> 共編管理</button> : <span className="bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full text-xs font-bold">協作者</span>}
                            </div>
                        ) : (
                            <div className="flex items-center gap-2">
                                {user.photoURL ? <img src={user.photoURL} alt="Google 帳號頭像" className="w-8 h-8 rounded-full" referrerPolicy="no-referrer" /> : <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center"><i className="fa-solid fa-user"></i></div>}
                                <div className="max-w-[150px] text-right leading-tight">
                                    <p className="text-[11px] font-bold text-slate-600 truncate" title={user.email || ''}>{user.email || user.displayName}</p>
                                    <p className="text-[9px] text-slate-400">UID …{user.uid.slice(-6)}</p>
                                </div>
                                <button onClick={handleSignOut} aria-label="登出" className="p-2 text-slate-400 hover:text-red-500"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                            </div>
                        )}
                    </header>

                    {authPersistenceWarning && <div className="max-w-md mx-auto bg-amber-50 border-b border-amber-100 px-4 py-3 text-xs leading-relaxed text-amber-800"><i className="fa-solid fa-lock-open mr-2"></i>{authPersistenceWarning}</div>}

                    <main inert={recoveryBusy ? '' : undefined} className="aa-main max-w-md mx-auto min-h-[calc(100vh-60px)] relative bg-slate-50">
                        {view === 'activeProject' && activeProjectData && <div className="aa-recovery-toolbar px-4 py-2 flex justify-end"><button type="button" className="px-3 py-2 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold" onClick={() => setShowRecovery(true)}><i className="fa-solid fa-clock-rotate-left mr-2" aria-hidden="true"></i>回收桶與紀錄</button></div>}
                        {view === 'activeProject' && syncConflict?.projectId === currentProjectId && <div role="alert" className="m-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-sm"><p className="font-bold">有修改尚未同步</p><p className="my-2">{syncConflict.message}</p><div className="flex flex-wrap gap-2"><button className="p-2 border rounded-lg" onClick={downloadPendingDraft}>下載未同步修改</button><button className="p-2 border rounded-lg" onClick={requestDiscardConflictingDraft}>捨棄草稿並載入最新</button></div></div>}
                        {view === 'projectList' && <ProjectList projects={projects} isLoading={projectsLoading} warning={projectIndexWarning} onSelect={(id) => { const selected = projects.find(project => project.id === id); if (selected?.accessPending) { setProjectsLoading(true); setProjectListRetryRevision(revision => revision + 1); setDialog({ type: 'alert', title: '正在重新確認', message: '這筆首頁索引仍保留。系統正在重新確認登入與專案權限，請稍後再點一次。' }); return; } setCurrentProjectId(id); setActiveProjectData(selected || null); setView('activeProject'); }} onCreate={() => setView('createProject')} onRemove={handleRemoveProject} />}
                        {view === 'createProject' && <CreateProjectScreen onCancel={() => setView('projectList')} onCreate={createProject} showMessage={showMessage} />}
                        {view === 'activeProject' && !activeProjectData && <div className="py-20 text-center text-slate-400"><i className="fa-solid fa-spinner fa-spin text-2xl"></i><p className="mt-3 text-sm">正在載入共編專案…</p></div>}
                        {view === 'activeProject' && activeProjectData?.type === 'travel' && <TravelMode key={currentProjectId} projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} onDeleteEntry={requestDeleteEntry} onDeleteDay={requestDeleteTravelDay} onAddDay={addTravelDay} />}
                        {view === 'activeProject' && activeProjectData?.type === 'dining' && <DiningMode key={currentProjectId} projectData={activeProjectData.data} onDeleteEntry={requestDeleteEntry} onUpdate={updateCurrentData} showMessage={showMessage} sourceProjectId={currentProjectId} travelProjects={projects.filter(p=>p.type==='travel' && !p.accessPending && p.data)} onImportToTravel={importDiningToTravel} />}
                        <div className="py-5 text-center"><VersionBadge /></div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
