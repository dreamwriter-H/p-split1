                                    <label className="text-xs font-bold text-slate-500">收據主要語言</label>
                                    <select value={language} onChange={event => setLanguage(event.target.value)} disabled={isReading} className="w-full mt-1 p-3 rounded-xl border border-slate-200 bg-slate-50 font-bold">
                                        <option value="eng">英文／拉丁字母</option>
                                        <option value="jpn+eng">日文＋英文</option>
                                        <option value="kor+eng">韓文＋英文</option>
                                        <option value="chi_tra+eng">繁體中文＋英文</option>
                                    </select>
                                </div>
                                <div className="rounded-2xl bg-blue-50 border border-blue-100 p-4">
                                    <p className="text-sm font-bold text-blue-800"><i className="fa-solid fa-camera mr-2"></i>拍完整張收據</p>
                                    <p className="text-xs text-blue-700 mt-1">攤平、對焦清楚、避免陰影；辨識後仍可手動修正。</p>
                                    <div className="grid grid-cols-2 gap-3 mt-3">
                                        <button onClick={() => cameraInputRef.current?.click()} disabled={isReading} className="bg-blue-600 disabled:opacity-50 text-white p-3 rounded-xl font-bold">
                                            <i className="fa-solid fa-camera mr-2"></i>拍照辨識
                                        </button>
                                        <button onClick={() => galleryInputRef.current?.click()} disabled={isReading} className="bg-white border border-blue-300 disabled:opacity-50 text-blue-700 p-3 rounded-xl font-bold">
                                            <i className="fa-solid fa-images mr-2"></i>從相簿選取
                                        </button>
                                    </div>
                                    <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
                                    <input ref={galleryInputRef} type="file" accept="image/*" onChange={handleFile} className="hidden" />
                                    {isReading && <div className="mt-3 h-2 rounded-full bg-blue-100 overflow-hidden"><div className="h-full bg-blue-500 transition-all" style={{ width: `${Math.max(5, Math.round(progress.value * 100))}%` }}></div></div>}
                                </div>

                                {processedImage && <div className="rounded-xl overflow-hidden border border-slate-200 bg-slate-100"><img src={processedImage.dataUrl} alt="待辨識收據預覽" className="w-full max-h-52 object-contain" /></div>}

                                {processedImage && !isReading && (
                                    <div className="space-y-4">
                                        <div className={`rounded-xl border p-3 text-xs leading-relaxed ${ocrResult?.amountConfident && !ocrResult?.currencyAmbiguous ? 'bg-emerald-50 border-emerald-100 text-emerald-800' : 'bg-amber-50 border-amber-100 text-amber-800'}`}>
                                            {ocrResult?.amountConfident ? '已找到可能的收據總額，請核對下方資料。' : '總額辨識信心不足，請以紙本收據為準手動核對。'}
                                            {ocrResult?.currencyAmbiguous && ' 幣別無法完全確認，請務必選擇正確幣別。'}
                                            {ocrResult?.dateAmbiguous && ` 日期「${ocrResult.rawDate}」格式不明，請手動填寫。`}
                                        </div>
                                        <div><label className="text-xs font-bold text-slate-500">店家／支出名稱</label><input value={merchant} onChange={event => applyInputValue(event, setMerchant)} className="w-full mt-1 p-3 rounded-xl border border-slate-200 bg-slate-50" placeholder="例如：東京食堂" /></div>
                                        <div><label className="text-xs font-bold text-slate-500">收據日期（選填）</label><input type="date" value={receiptDate} onChange={event => setReceiptDate(event.target.value)} className="w-full mt-1 p-3 rounded-xl border border-slate-200 bg-slate-50" /></div>
                                        <div className="grid grid-cols-[1fr_132px] gap-3">
                                            <div><label className="text-xs font-bold text-slate-500">原幣總額</label><input type="number" inputMode="decimal" value={originalAmount} onChange={event => setOriginalAmount(event.target.value)} className="w-full mt-1 p-3 rounded-xl border border-slate-200 bg-slate-50 text-lg font-black" placeholder="0" /></div>
                                            <div><label className="text-xs font-bold text-slate-500">幣別</label><select value={currency} onChange={event => handleCurrencyChange(event.target.value)} className="w-full mt-1 p-3 rounded-xl border border-slate-200 bg-slate-50">{window.SplitEasyReceiptOcr.currencies.map(item => <option key={item.code} value={item.code}>{item.code}</option>)}</select></div>
                                        </div>
                                        <div><label className="text-xs font-bold text-slate-500">換算匯率</label><div className="flex items-center gap-2 mt-1"><span className="text-xs text-slate-500 shrink-0">1 {currency} =</span><input type="number" inputMode="decimal" step="any" value={exchangeRate} onChange={event => setExchangeRate(event.target.value)} className="flex-1 min-w-0 p-3 rounded-xl border border-slate-200 bg-slate-50" placeholder="請填當時匯率" /><span className="text-xs text-slate-500">TWD</span></div><p className="text-[11px] text-slate-400 mt-1">可填信用卡帳單或換匯時的實際匯率；系統不會連網抓匯率。</p></div>
                                        <div className="rounded-2xl bg-slate-800 text-white p-4"><p className="text-xs text-slate-300">折合記帳金額</p><p className="text-3xl font-black mt-1">{formatMoney(convertedAmount)}</p></div>
                                        <button onClick={() => recognizeImage(processedImage.dataUrl, language)} className="w-full p-3 rounded-xl bg-slate-100 text-slate-600 text-sm font-bold"><i className="fa-solid fa-rotate mr-2"></i>依目前語言重新辨識</button>
                                        <button onClick={handleApplyOverseas} disabled={!originalAmount || !exchangeRate} className="w-full p-4 rounded-xl bg-orange-500 disabled:opacity-40 text-white font-black shadow-lg">確認資料，繼續選付款人與分攤者</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DiningWalletSettings = ({ people, expanded, onToggle, onChange }) => {
            const [selectedId, setSelectedId] = useState(null);
            const wallets = getDiningWalletGroups(people);
            const sharedWallets = wallets.filter(wallet => wallet.members.length > 1);
            const selectedWallet = wallets.find(wallet => wallet.id === selectedId);
            useEffect(() => {
                if (selectedId !== null && (!expanded || !wallets.some(wallet => wallet.id === selectedId))) setSelectedId(null);
            }, [people, expanded, selectedId]);
            const handleWalletClick = (id) => {
                if (selectedId === null) return setSelectedId(id);
                if (selectedId !== id) onChange(selectedId, id);
                setSelectedId(null);
            };
            const handleUnbind = (id) => {
                onChange(id, id);
                setSelectedId(null);
            };
            return (
                <section aria-label="共同錢包設定" className="aa-dining-wallets mb-6 rounded-2xl border border-orange-200 bg-white overflow-hidden">
                    <button type="button" onClick={onToggle} aria-expanded={expanded} aria-controls="dining-wallet-options" className="w-full p-4 flex items-center gap-3 text-left hover:bg-orange-50 transition">
                        <span className="w-10 h-10 shrink-0 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center"><i className="fa-solid fa-wallet" aria-hidden="true"></i></span>
                        <span className="flex-1 min-w-0"><span className="block font-bold text-slate-800">共同錢包 <span className="text-xs font-normal text-slate-400">選填</span></span><span className="block text-xs text-slate-500 mt-1">{sharedWallets.length ? `已設定 ${sharedWallets.length} 個共同錢包・共 ${wallets.length} 組結算` : '家人、情侶可由一人代表結算'}</span></span>
                        <span className="text-xs font-bold text-orange-600 shrink-0">{expanded ? '收合' : '設定'} <i className={`fa-solid fa-chevron-${expanded ? 'up' : 'down'} ml-1`} aria-hidden="true"></i></span>
                    </button>
                    {expanded && <div id="dining-wallet-options" className="px-4 pb-4 border-t border-orange-100">
                        <p className="text-xs text-slate-500 leading-relaxed py-3">和旅遊模式一樣：先點要移動的頭像，再點要併入的錢包。餐費仍按每個人計算，最後才合併結算。</p>
                        <div role="status" aria-live="polite" className={`mb-4 rounded-xl p-3 text-xs leading-relaxed ${selectedWallet ? 'bg-orange-100 text-orange-800' : 'bg-slate-50 text-slate-500'}`}>
                            {selectedWallet ? <div className="flex items-start justify-between gap-2"><span className="min-w-0 break-words">已選取 <b>{selectedWallet.name}</b>{selectedWallet.members.length > 1 ? ` 的錢包（${selectedWallet.members.length} 人）` : ''}，請點選要併入的錢包。</span><button type="button" onClick={() => setSelectedId(null)} className="font-bold underline underline-offset-2 shrink-0">取消選取</button></div> : '① 點選要移動的成員或錢包　② 點選結算代表'}
                        </div>
                        <div className="grid grid-cols-2 gap-3 items-start">{wallets.map(wallet => {
                            const selected = selectedId === wallet.id;
                            const target = selectedId !== null && !selected;
                            const children = wallet.members.filter(member => member.id !== wallet.id);
                            return <div key={wallet.id} role="group" aria-label={`${wallet.name}的錢包分組`} className={`relative min-w-0 rounded-2xl border-2 transition-colors ${selected ? 'border-orange-500 bg-orange-50 ring-2 ring-orange-100' : target ? 'border-dashed border-orange-300 bg-white' : 'border-slate-200 bg-white'}`}>
                                <button type="button" onClick={() => handleWalletClick(wallet.id)} aria-label={`選取${wallet.name}的錢包`} aria-pressed={selected} className="w-full min-w-0 min-h-[140px] p-3 flex flex-col items-center justify-center rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 focus-visible:ring-inset hover:bg-orange-50 transition">
                                    <span className="w-14 h-14 rounded-full bg-gradient-to-br from-orange-100 to-amber-100 text-orange-600 flex items-center justify-center text-xl font-bold shadow-sm mb-2">{Array.from(wallet.name)[0]}</span>
                                    <span className="font-bold text-sm text-slate-700 w-full break-words text-center">{wallet.name}</span>
                                    <span className="text-[11px] text-slate-400 mt-1">{children.length ? `錢包代表・共 ${wallet.members.length} 人` : '獨立結算'}</span>
                                    {selected && <span className="mt-2 text-[11px] font-bold text-orange-700"><i className="fa-solid fa-check mr-1" aria-hidden="true"></i>已選取</span>}
                                    {target && <span className="mt-2 text-[11px] font-bold text-orange-600">併入這個錢包</span>}
                                </button>
                                {children.length > 0 && <div className="mx-2 mb-2 p-2 rounded-xl bg-slate-50 border border-slate-100 flex flex-wrap justify-center gap-2">{children.map(member => {
                                    const name = getPersonNameHelper(member.id, people);
                                    const longName = Array.from(name).length > 6;
                                    return <button key={member.id} type="button" onClick={() => handleUnbind(member.id)} aria-label={`將${name}移出${wallet.name}的錢包`} className={`relative flex ${longName ? 'flex-col w-full' : 'items-center'} gap-1.5 min-w-0 max-w-full min-h-[36px] rounded-xl border border-slate-200 bg-white px-2 py-2 text-xs text-slate-600 hover:border-red-200 hover:bg-red-50 hover:text-red-600 focus-visible:ring-2 focus-visible:ring-orange-500`}>
                                        <span className="w-5 h-5 shrink-0 rounded-full bg-orange-100 text-orange-700 flex items-center justify-center text-[10px] font-bold">{Array.from(name)[0]}</span><span className={`min-w-0 break-words ${longName ? 'w-full text-center' : ''}`}>{name}</span><i className={`fa-solid fa-xmark shrink-0 text-slate-400 ${longName ? 'absolute right-1.5 top-1.5' : 'ml-1'}`} aria-hidden="true"></i>
                                    </button>;
                                })}</div>}
                            </div>;
                        })}</div>
                        <p className="text-xs font-bold text-orange-800 mt-4">共 {wallets.length} 組結算{sharedWallets.length ? `・${sharedWallets.length} 個共同錢包` : '・目前每人各自結算'}</p>
                        <p className="text-[11px] text-slate-400 mt-2 leading-relaxed">點同組成員的「×」即可退出。移動錢包代表會將整組一起合併；移除代表後，其他人會恢復各自結算。</p>
                    </div>}
                    {!expanded && sharedWallets.length > 0 && <div className="px-4 pb-4 grid grid-cols-2 gap-3">{sharedWallets.map(wallet => <button key={wallet.id} type="button" onClick={onToggle} aria-label={`編輯${wallet.name}的錢包`} className="min-w-0 rounded-xl bg-orange-50 border border-orange-100 p-3 text-left hover:bg-orange-100 transition">
                        <span className="flex items-center gap-2 min-w-0"><span className="w-8 h-8 shrink-0 rounded-full bg-orange-100 text-orange-700 flex items-center justify-center font-bold text-xs">{Array.from(wallet.name)[0]}</span><span className="min-w-0 text-xs font-bold text-orange-800 break-words">{wallet.name} 的錢包</span></span>
                        <span className="flex flex-wrap gap-1.5 mt-2">{wallet.members.filter(member => member.id !== wallet.id).map(member => <span key={member.id} className="min-w-0 text-[11px] text-orange-700 bg-white border border-orange-100 rounded-lg px-2 py-1 break-words">{getPersonNameHelper(member.id, people)}</span>)}</span>
                    </button>)}</div>}
                </section>
            );
        };

        const DiningMode = ({ projectData, onUpdate, showMessage, onDeleteEntry, initialStep = 1, sourceProjectId, travelProjects = [], onImportToTravel }) => {
            const [step, setStep] = useState(initialStep);
            const [showReceiptItems, setShowReceiptItems] = useState(false);
            const [showInvoiceScanner, setShowInvoiceScanner] = useState(false);
            const [showWalletSettings, setShowWalletSettings] = useState(false);
            const withDiningDefaults = (source) => ({
                ...source,
                people: normalizeDiningWalletPeople(source.people || []),
                customAmounts: { ...(source.customAmounts || {}) },
                diningItems: (source.diningItems || []).map(item => ({ ...item, participantIds: [...(item.participantIds || [])] })),
                billPayerId: source.billPayerId || source.people?.[0]?.id || null,
                invoiceMeta: source.invoiceMeta || null
            });
            const [data, setData] = useState(() => withDiningDefaults(projectData));
            const [compositionRevision, setCompositionRevision] = useState(0);
            const isComposingRef = useRef(false);
            const syncBaseRef = useRef(withDiningDefaults(projectData));

            useEffect(() => {
                if (isComposingRef.current) return;
                const normalized = withDiningDefaults(projectData);
                syncBaseRef.current = normalized;
                setData(normalized);
            }, [projectData]);
            useEffect(() => {
                if (isComposingRef.current) return;
                const normalizedProjectData = withDiningDefaults(projectData);
                if (!dataValuesEqual(data, normalizedProjectData)) onUpdate(data, syncBaseRef.current);
            }, [data, compositionRevision]);

            const beginTextComposition = () => { isComposingRef.current = true; };
            const finishTextComposition = () => {
                isComposingRef.current = false;
                setCompositionRevision(revision => revision + 1);
            };

            const updateData = (key, value) => setData(prev => ({ ...prev, [key]: value }));
            const addPerson = () => {
                const id = Date.now();
                setData(prev => ({ ...prev, people: [...prev.people, { id, name: '', payerId: id }] }));
            };
            const removePerson = (id) => {
                if (data.people.length <= 1) return;
                setData(prev => {
                    const people = normalizeDiningWalletPeople(prev.people.filter(p => p.id !== id));
                    const diningItems = (prev.diningItems || []).map(item => ({ ...item, participantIds: (item.participantIds || []).filter(personId => personId !== id) }));
                    const customAmounts = { ...prev.customAmounts };
                    delete customAmounts[id];
                    return { ...prev, people, diningItems, customAmounts, billPayerId: prev.billPayerId === id ? people[0]?.id : prev.billPayerId };
                });
            };
            const updatePersonName = (id, name) => setData(prev => ({ ...prev, people: prev.people.map(p => p.id === id ? { ...p, name } : p) }));
            const getDisplayName = (person, index) => person.name || ANIMAL_NAMES[(person.id + index) % ANIMAL_NAMES.length];
            const getCustomSubtotal = () => data.people.reduce((sum, person) => sum + Math.max(0, parseFloat(data.customAmounts[person.id]) || 0), 0);
            const getMixedSubtotal = () => Math.max(0, (data.diningItems || []).reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0));
            const updateCustomAmount = (personId, value) => setData(prev => {
                const customAmounts = { ...prev.customAmounts, [personId]: value };
                const totalBill = prev.people.reduce((sum, person) => sum + Math.max(0, parseFloat(customAmounts[person.id]) || 0), 0);
                return { ...prev, customAmounts, totalBill };
            });
            const createDiningItem = (people = data.people) => ({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, name: '', amount: '', participantIds: people.map(p => p.id) });
            const selectMixedMode = () => setData(prev => ({ ...prev, splitMode: 'mixed', diningItems: prev.diningItems?.length ? prev.diningItems : [createDiningItem(prev.people)] }));
            const addDiningItem = () => setData(prev => ({ ...prev, diningItems: [...(prev.diningItems || []), createDiningItem(prev.people)] }));
            const updateDiningItem = (itemId, patch) => setData(prev => ({ ...prev, diningItems: (prev.diningItems || []).map(item => item.id === itemId ? { ...item, ...patch } : item) }));
            const deleteDiningItem = itemId => { const item = data.diningItems.find(entry => entry.id === itemId); if (item) onDeleteEntry?.('diningItems', item); };
            const toggleItemParticipant = (item, personId) => {
                const participantIds = (item.participantIds || []).includes(personId)
                    ? item.participantIds.filter(id => id !== personId)
                    : [...(item.participantIds || []), personId];
                updateDiningItem(item.id, { participantIds });
            };
            const toggleAllItemParticipants = (item) => {
                const allPersonIds = data.people.map(person => person.id);
                const selectedIds = (item.participantIds || []).filter(id => allPersonIds.includes(id));
                const isEveryoneSelected = allPersonIds.length > 0 && selectedIds.length === allPersonIds.length;
                updateDiningItem(item.id, { participantIds: isEveryoneSelected ? [] : allPersonIds });
            };

            const importReceiptItems = items => {
                if (!data.people.length) { showMessage({ message: '請先新增成員，再匯入品項。' }); return false; }
                const batchId = createInviteToken();
                const ids = items.map((_, index) => `${batchId}-${index}`);
                setData(prev => {
                    const all = prev.people.map(person => person.id);
                    const existing = prev.splitMode === 'mixed' ? (prev.diningItems || [])
                        : prev.splitMode === 'custom' ? prev.people.filter(person => parseFloat(prev.customAmounts?.[person.id]) > 0).map(person => ({ id: `${batchId}-old-${person.id}`, name: `${getPersonNameHelper(person.id, prev.people)}原有餐費`, amount: parseFloat(prev.customAmounts[person.id]), participantIds: [person.id] }))
                        : parseFloat(prev.totalBill) > 0 ? [{ id: `${batchId}-old`, name: '原有聚餐費用', amount: parseFloat(prev.totalBill), participantIds: all }] : [];
                    const added = items.map((item, index) => ({ id: ids[index], name: receiptItemName(item), quantity: item.quantity, amount: item.amount, participantIds: all }));
                    return { ...prev, splitMode: 'mixed', diningItems: [...existing, ...added] };
                });
                setStep(3);
                showMessage({ title: '品項已新增', message: `已追加 ${items.length} 筆品項。請在下方逐筆調整誰該負擔；服務費沿用原設定，折扣請另行核對。` });
                return true;
            };
            const handleInvoiceApply = ({ items, invoice }) => {
                const subtotal = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                setData(prev => ({
                    ...prev,
                    splitMode: 'mixed',
                    diningItems: items,
                    totalBill: String(invoice.totalAmount || subtotal),
                    serviceChargeType: 'fixed',
                    serviceChargeValue: 0,
                    invoiceMeta: invoice,
                    date: invoice.date || prev.date
                }));
                showMessage({ title: '電子發票已匯入', message: `已帶入 ${items.length} 筆品項。發票總額已含稅，因此服務費已歸零；接著請為每筆品項選擇分攤成員。` });
            };
            const goToResult = () => {
                if (data.splitMode === 'custom' && getCustomSubtotal() <= 0) {
                    showMessage({ message: '請至少輸入一位成員的套餐金額。' });
                    return;
                }
                if (data.splitMode === 'mixed') {
                    const validItems = (data.diningItems || []).filter(item => Math.abs(parseFloat(item.amount) || 0) > 0);
                    if (validItems.length === 0) return showMessage({ message: '請至少新增一筆有金額的聚餐品項。' });
                    if (validItems.some(item => !(item.participantIds || []).length)) return showMessage({ message: '每一筆品項至少要選擇一位分攤成員。' });
                }
                setStep(4);
            };
            const getBillPreview = () => {
                const subtotal = data.splitMode === 'custom' ? getCustomSubtotal() : data.splitMode === 'mixed' ? getMixedSubtotal() : Math.max(0, parseFloat(data.totalBill) || 0);
                const serviceValue = Math.max(0, parseFloat(data.serviceChargeValue) || 0);
                const serviceCharge = data.serviceChargeType === 'percent' ? subtotal * (serviceValue / 100) : serviceValue;
                return { subtotal, serviceCharge, total: subtotal + serviceCharge };
            };

            const calculation = calculateDiningResult(data);
            const sharedWallets = calculation.wallets.filter(wallet => wallet.members.length > 1);

            return (
                <div className="aa-dining pb-20">
                    <ol className="aa-dining-steps" aria-label="聚餐設定進度">{['基本資料', '成員', '帳單', '結算'].map((label, index) => <li key={label} data-complete={index + 1 <= step} aria-current={index + 1 === step ? 'step' : undefined}><span>{index + 1}</span><b>{label}</b></li>)}</ol>
                    {step === 1 && (
                        <div className="px-6 animate-fade-in">
                            <h2 className="text-2xl font-bold mb-6">這次聚餐是...</h2>
                            <div className="space-y-4">
                                <div><label className="block text-sm font-medium text-slate-500 mb-1">聚餐名稱</label><input type="text" placeholder="例如：慶祝小明升職" className="w-full p-4 rounded-xl bg-white border border-slate-200 outline-none" value={data.title} onCompositionStart={beginTextComposition} onCompositionEnd={event => { applyInputValue(event, value => updateData('title', value)); finishTextComposition(); }} onChange={event => applyInputValue(event, value => updateData('title', value))} /></div>
                                <div><label className="block text-sm font-medium text-slate-500 mb-1">日期</label><input type="date" className="w-full p-4 rounded-xl bg-white border border-slate-200 outline-none" value={data.date} onChange={e => updateData('date', e.target.value)} /></div>
                            </div>
                            <button onClick={() => setStep(2)} className="w-full mt-8 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">下一步</button>
                        </div>
                    )}
                    {step === 2 && (
                        <div className="px-6 animate-fade-in">
                            <h2 className="text-2xl font-bold mb-2">誰有來吃？</h2>
                            <div className="space-y-3 mb-6 max-h-[60vh] overflow-y-auto pr-2">
                                {data.people.map((p, idx) => (
                                    <div key={p.id} className="flex gap-2 items-center">
                                        <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-lg">{idx + 1}</div>
                                            <input type="text" aria-label={`成員 ${idx + 1} 姓名`} placeholder={getDisplayName(p, idx)} className="flex-1 min-w-0 p-3 rounded-xl bg-white border border-slate-200 outline-none" value={p.name} onCompositionStart={beginTextComposition} onCompositionEnd={event => { applyInputValue(event, value => updatePersonName(p.id, value)); finishTextComposition(); }} onChange={event => applyInputValue(event, value => updatePersonName(p.id, value))} />
                                        {data.people.length > 1 && <button onClick={() => removePerson(p.id)} aria-label={`移除成員 ${getDisplayName(p, idx)}`} className="p-3 text-slate-400 hover:text-red-500"><i className="fa-solid fa-trash"></i></button>}
                                    </div>
                                ))}
                                <button onClick={addPerson} className="flex items-center gap-2 text-orange-600 font-medium p-2 hover:bg-orange-50 rounded-lg transition w-full justify-center border border-dashed border-orange-300"><i className="fa-solid fa-plus"></i> 新增成員</button>
                            </div>
                            <DiningWalletSettings people={data.people} expanded={showWalletSettings} onToggle={() => setShowWalletSettings(value => !value)} onChange={(memberId, representativeId) => setData(prev => ({ ...prev, people: changeDiningWallet(prev.people, memberId, representativeId) }))} />
                            <div className="flex gap-4">
                                <button onClick={() => setStep(1)} className="flex-1 bg-slate-100 text-slate-600 p-4 rounded-xl font-bold">上一步</button>
                                <button onClick={() => setStep(3)} className="flex-1 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">下一步</button>
                            </div>
                        </div>
                    )}
                    {step === 3 && (
                        <div className="px-6 animate-fade-in">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold">帳單金額</h2>
                                <button onClick={() => setShowInvoiceScanner(true)} className="flex items-center gap-1 text-xs font-bold px-3 py-2 rounded-full shadow-sm transition bg-gradient-to-r from-teal-500 to-emerald-500 text-white hover:opacity-90 relative z-10">
                                    <i className="fa-solid fa-qrcode"></i> 掃描電子發票
                                </button>
                            </div>
                            <button type="button" onClick={() => setShowReceiptItems(true)} className="w-full mb-4 p-3 rounded-xl bg-teal-50 border border-teal-200 text-teal-700 font-bold">拍帳單批次新增</button>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
                                {data.splitMode === 'even' ? <div><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">餐點小計</label><div className="relative"><i className="fa-solid fa-dollar-sign absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="number" min="0" placeholder="0" className="w-full pl-10 pr-4 py-4 rounded-xl border border-slate-200 text-2xl font-bold outline-none bg-slate-50" value={data.totalBill} onChange={e => updateData('totalBill', e.target.value)} /></div></div> : <p className="text-xs text-orange-600">{data.splitMode === 'mixed' ? '各筆共享或個人品項會在下方自動加總。' : '個別套餐會在下方自動加總，不需要重複填寫餐點小計。'}</p>}
                                <div>
                                    <div className="flex justify-between items-center mb-2"><label className="block text-xs font-bold text-slate-400 uppercase tracking-wider">服務費</label><div className="flex bg-slate-100 rounded-lg p-1"><button onClick={() => updateData('serviceChargeType', 'percent')} className={`px-3 py-1 text-xs rounded-md transition ${data.serviceChargeType === 'percent' ? 'bg-white shadow text-orange-600 font-bold' : 'text-slate-500'}`}>%</button><button onClick={() => updateData('serviceChargeType', 'fixed')} className={`px-3 py-1 text-xs rounded-md transition ${data.serviceChargeType === 'fixed' ? 'bg-white shadow text-orange-600 font-bold' : 'text-slate-500'}`}>$</button></div></div>
                                    <input type="number" min="0" className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 font-medium outline-none" value={data.serviceChargeValue} onChange={e => updateData('serviceChargeValue', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">分帳方式</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={() => updateData('splitMode', 'even')} className={`p-3 rounded-xl border-2 transition text-center ${data.splitMode === 'even' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-100 text-slate-500'}`}>完全均攤</button>
                                        <button onClick={() => updateData('splitMode', 'custom')} className={`p-3 rounded-xl border-2 transition text-center ${data.splitMode === 'custom' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-100 text-slate-500'}`}>各付各的</button>
                                        <button onClick={selectMixedMode} className={`p-3 rounded-xl border-2 transition text-center ${data.splitMode === 'mixed' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-100 text-slate-500'}`}>混合分攤</button>
                                    </div>
                                </div>
                                <div><label htmlFor="dining-bill-payer" className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">這次由誰先付款？</label><select id="dining-bill-payer" className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 font-medium" value={calculation.payerId} onChange={e => updateData('billPayerId', parseInt(e.target.value))}>{data.people.map((person, index) => <option key={person.id} value={person.id}>{getDisplayName(person, index)}</option>)}</select><p className="text-xs text-slate-400 mt-1 leading-relaxed">{sharedWallets.length ? '結算時由各錢包代表轉帳，同一錢包內不另外轉帳。' : '結算時會顯示其他人應轉給付款人的金額。'}</p></div>
                                <div className="rounded-xl border border-orange-100 bg-orange-50 p-3">
                                    <div className="flex items-center justify-between gap-2"><span className="text-sm font-bold text-orange-800"><i className="fa-solid fa-wallet mr-2" aria-hidden="true"></i>{sharedWallets.length ? `${calculation.wallets.length} 組錢包結算` : '目前每人各自結算'}</span><button type="button" onClick={() => { setShowWalletSettings(true); setStep(2); }} className="text-xs font-bold text-orange-700 underline underline-offset-2 shrink-0">調整分組</button></div>
                                    {sharedWallets.map(wallet => <p key={wallet.id} className="mt-2 text-xs text-orange-800 break-words">{wallet.members.map(member => member.name).join('、')} → {wallet.name} 代表</p>)}
                                    {calculation.payerId !== calculation.payerWalletId && <p className="mt-2 text-xs text-orange-800 leading-relaxed">付款人與 {getPersonNameHelper(calculation.payerWalletId, data.people)} 共用錢包，對外收款統一由該代表結算。</p>}
                                </div>
                                <div className="aa-bill-summary aa-total-summary rounded-2xl bg-gradient-to-br from-slate-800 to-slate-700 text-white p-5 shadow-lg"><p className="text-sm font-medium text-slate-300">預估應付總額</p><p className="text-4xl font-black mt-1 tracking-tight">{formatMoney(getBillPreview().total)}</p><div className="mt-4 pt-3 border-t border-white/20 flex items-center justify-between text-sm"><span className="text-slate-300">套餐合計 <span className="text-white font-bold">{formatMoney(getBillPreview().subtotal)}</span></span><span className="text-slate-300">服務費 <span className="text-white font-bold">{formatMoney(getBillPreview().serviceCharge)}</span></span></div></div>
                                {data.splitMode === 'custom' && (
                                    <div className="space-y-3 pt-4 border-t border-slate-100">
                                        <div><p className="text-sm font-bold text-slate-700">逐人輸入套餐</p><p className="text-xs text-slate-500 mt-1">填寫每個人的餐點小計；百分比服務費會直接加到各自餐點，固定服務費則依餐點比例分攤。</p></div>
                                        {data.people.map((p, idx) => (
                                            <div key={p.id} className="flex justify-between items-center">
                                                <span className="text-sm font-medium w-24 truncate">{getDisplayName(p, idx)}</span>
                                                <div className="flex items-center gap-2"><span className="text-slate-400 text-sm">$</span><input type="number" min="0" placeholder="套餐小計" className="w-32 p-2 text-right rounded-lg border border-slate-200 bg-slate-50 outline-none" value={data.customAmounts[p.id] || ''} onChange={e => updateCustomAmount(p.id, e.target.value)} /></div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {data.splitMode === 'mixed' && (
                                    <div className="space-y-4 pt-4 border-t border-slate-100">
                                        <div><p className="text-sm font-bold text-slate-700">共享與個人品項</p><p className="text-xs text-slate-500 mt-1">每筆可選全員、部分成員或單一成員分攤。</p></div>
                                        {(data.diningItems || []).map((item, itemIndex) => {
                                            const selectedCount = (item.participantIds || []).length;
                                            const shareLabel = selectedCount === data.people.length ? '全員共享' : selectedCount === 1 ? '個人負擔' : selectedCount > 1 ? `${selectedCount} 人共享` : '尚未選人';
                                            return (
                                                <div key={item.id} className="rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-3">
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-orange-600">品項 {itemIndex + 1}・{shareLabel}</span><button onClick={() => deleteDiningItem(item.id)} className="text-slate-300 hover:text-red-500 p-1" aria-label={`刪除品項 ${itemIndex + 1}`}><i className="fa-solid fa-trash"></i></button></div>
                                                    <div className="grid grid-cols-[1fr_110px] gap-2"><input type="text" placeholder="例如：包廂費、酒水、主餐" className="w-full p-3 rounded-xl border border-slate-200 bg-white" value={item.name} onCompositionStart={beginTextComposition} onCompositionEnd={event => { applyInputValue(event, value => updateDiningItem(item.id, { name: value })); finishTextComposition(); }} onChange={event => applyInputValue(event, value => updateDiningItem(item.id, { name: value }))} /><div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">$</span><input type="number" placeholder="金額" className="w-full pl-7 pr-2 py-3 rounded-xl border border-slate-200 bg-white text-right" value={item.amount} onChange={e => updateDiningItem(item.id, { amount: e.target.value })} /></div></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-slate-500">誰要分攤？</span><button type="button" onClick={() => toggleAllItemParticipants(item)} aria-pressed={selectedCount === data.people.length} aria-label={selectedCount === data.people.length ? '取消全員分攤' : '選取全員分攤'} className={`text-xs font-bold px-3 py-1.5 rounded-full border transition ${selectedCount === data.people.length ? 'bg-teal-100 text-teal-700 border-teal-200' : 'bg-white text-teal-600 border-teal-200'}`}><i className={`fa-solid ${selectedCount === data.people.length ? 'fa-check-double' : 'fa-users'} mr-1`}></i>全員</button></div>
                                                    <div className="flex flex-wrap gap-2">{data.people.map((person, index) => { const selected = (item.participantIds || []).includes(person.id); return <button key={person.id} onClick={() => toggleItemParticipant(item, person.id)} className={`px-3 py-2 rounded-full text-sm border transition ${selected ? 'bg-teal-100 text-teal-700 border-teal-200 font-bold' : 'bg-white text-slate-400 border-slate-200'}`}>{getDisplayName(person, index)} {selected && <i className="fa-solid fa-check ml-1 text-xs"></i>}</button>; })}</div>
                                                </div>
                                            );
                                        })}
                                        <button onClick={addDiningItem} className="w-full p-3 rounded-xl border-2 border-dashed border-orange-300 text-orange-600 font-bold hover:bg-orange-50"><i className="fa-solid fa-plus mr-2"></i>新增一筆品項</button>
                                    </div>
                                )}
                            </div>
                            <div className="flex gap-4 mt-8">
                                <button onClick={() => setStep(2)} className="flex-1 bg-slate-100 text-slate-600 p-4 rounded-xl font-bold">上一步</button>
                                <button onClick={goToResult} className="flex-1 bg-orange-500 text-white p-4 rounded-xl font-bold shadow-lg">開始計算</button>
                            </div>
                        </div>
                    )}
                    {step === 4 && <DiningResult data={data} calculation={calculation} onBack={() => setStep(3)} showMessage={showMessage} sourceProjectId={sourceProjectId} travelProjects={travelProjects} onImportToTravel={onImportToTravel} />}
                    {showReceiptItems && <ReceiptItemsModal onClose={() => setShowReceiptItems(false)} onApply={importReceiptItems} />}
                    {showInvoiceScanner && <TaiwanInvoiceScannerModal people={data.people} onClose={() => setShowInvoiceScanner(false)} onApply={handleInvoiceApply} showMessage={showMessage} />}
                </div>
            );
        };

        const DiningResult = ({ data, calculation, onBack, showMessage, sourceProjectId, travelProjects = [], onImportToTravel }) => {
            const [showTripImport,setShowTripImport] = useState(false);
            const { finalTotal, results, payerId, payerWalletId, wallets, transfers } = calculation;
            const payerIndex = data.people.findIndex(person => person.id === payerId);
            const payerName = payerIndex >= 0 ? getPersonNameHelper(payerId, data.people) : '付款人';
            const hasSharedWallet = wallets.some(wallet => wallet.members.length > 1);
            const receivingName = getPersonNameHelper(payerWalletId, data.people);
            const expenseRows = getDiningExpenseRows(data, calculation);
            const resultText = [
                `${data.title || '本次聚餐'}｜總額 ${formatMoney(finalTotal)}`,
                `付款人：${payerName}`,
                ...(payerId !== payerWalletId ? [`對外收款代表：${receivingName}（與付款人共用錢包）`] : []),
                '個人餐費明細',
                ...results.map(result => `．${result.name}負擔 ${formatMoney(result.amount)}${result.detail ? `（${result.detail}）` : ''}`),
                ...(hasSharedWallet ? ['', '錢包結算合計', ...wallets.map(wallet => `．${wallet.name}${wallet.members.length > 1 ? ` 的錢包（${wallet.members.map(member => member.name).join('、')}）` : ''}：${formatMoney(wallet.amount)}`)] : []),
                '', '建議轉帳',
                ...(transfers.length ? transfers.map(item => `．${item.from} 轉給 ${item.to} ${formatMoney(item.amount)}`) : ['無需轉帳']),
                '', '費用明細', ...expenseRows.map(row => `．${row.name} ${formatMoney(row.amount)}`), `本次合計 ${formatMoney(finalTotal)}`
            ].join('\n');


            return (
                <div className="aa-dining-result px-6 animate-fade-in pb-10">
                    <h2 className="text-2xl font-bold mb-4">計算結果</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 mb-6 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-400 to-red-500"></div>
                        <div className="aa-total-summary flex flex-wrap justify-between items-end gap-3 mb-6 pb-6 border-b border-dashed border-slate-200">
                            <div className="min-w-0 flex-1"><h3 className="text-xl font-bold text-slate-800 break-words">{data.title || '快樂聚餐'}</h3><p className="text-slate-500 text-sm">{data.date}</p></div>
                            <div className="text-right shrink-0"><p className="text-xs text-slate-400 uppercase">Total</p><p className="text-2xl font-black text-orange-600">{formatMoney(Math.round(finalTotal))}</p></div>
                        </div>
                        <div className="mb-5 rounded-xl bg-orange-50 border border-orange-100 p-3 space-y-2">
                            <div className="flex items-start justify-between gap-3"><span className="text-sm text-orange-700 shrink-0">本次付款人</span><span className="font-black text-orange-700 break-words min-w-0 text-right">{payerName}</span></div>
                            {payerId !== payerWalletId && <div className="text-xs text-orange-800 border-t border-orange-100 pt-2 leading-relaxed">對外收款代表：<b>{receivingName}</b>（與付款人共用錢包）</div>}
                        </div>
                        <h4 className="text-xs font-bold text-slate-400 mb-3">{hasSharedWallet ? '各錢包負擔・含個人明細' : '各人負擔'}</h4>
                        <div className="space-y-3">{wallets.map(wallet => (
                            <div key={wallet.id} className={wallet.members.length > 1 ? 'aa-wallet-group rounded-xl border border-orange-100 overflow-hidden' : 'py-2'}>
                                {wallet.members.length > 1 && <div className="bg-orange-50 px-3 py-3 flex justify-between items-start gap-3"><div className="min-w-0"><p className="text-sm font-bold text-orange-800 break-words"><i className="fa-solid fa-wallet mr-2" aria-hidden="true"></i>{wallet.name} 的錢包</p><p className="text-[11px] text-orange-600 mt-1">{wallet.members.length} 人合併結算</p></div><b className="text-orange-800 shrink-0">{formatMoney(wallet.amount)}</b></div>}
                                <div className={wallet.members.length > 1 ? 'p-3 space-y-3' : 'space-y-3'}>{wallet.members.map(member => <div key={member.id} className="flex justify-between items-start gap-3"><span className="text-sm font-medium text-slate-700 min-w-0 break-words">{member.name}</span><div className="text-right min-w-0"><span className="block font-bold text-slate-800">{formatMoney(member.amount)}</span>{member.detail && <span className="block text-[10px] text-slate-400 max-w-[160px] break-words">{member.detail}</span>}</div></div>)}</div>
                            </div>
                        ))}</div>
                        <div className="mt-6 pt-5 border-t border-dashed border-slate-200"><h4 className="text-xs font-bold text-slate-400 uppercase mb-3">建議轉帳</h4>{transfers.length > 0 ? <div className="space-y-2">{transfers.map((item, index) => <div key={index} className="aa-transfer-row flex justify-between items-start gap-3 rounded-lg bg-teal-50 px-3 py-3 text-sm"><span className="min-w-0 break-words"><b>{item.from}</b> 轉給 {item.to}</span><b className="text-teal-700 shrink-0">{formatMoney(item.amount)}</b></div>)}</div> : <p className="rounded-xl bg-teal-50 p-3 text-sm text-teal-700">無需轉帳{hasSharedWallet && wallets.length === 1 ? '，所有成員都在同一個錢包。' : '。'}</p>}{hasSharedWallet && <p className="text-[11px] text-slate-400 leading-relaxed mt-3">以上由錢包代表統一結算，同一錢包內不另列轉帳。</p>}</div>
                        <section aria-label="聚餐費用明細" className="mt-6 pt-5 border-t border-slate-100">
                            <h4 className="font-bold text-slate-800 mb-4">費用明細</h4>
                            <ExpenseRows rows={expenseRows} />
                            {expenseRows.length === 0 && <p className="text-sm text-slate-400">尚無費用紀錄。</p>}
                            <div className="flex justify-between gap-3 border-t border-slate-100 mt-4 pt-4 font-bold"><span>本次合計</span><span className="shrink-0 text-orange-600">{formatMoney(finalTotal)}</span></div>
                        </section>
                    </div>
                    <div className="mb-4"><button onClick={() => {copyToClipboard(resultText); showMessage({message: '明細已複製！'});}} className="aa-primary w-full bg-blue-50 text-blue-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2"><i className="fa-solid fa-copy"></i> 複製文字</button></div>
                    {onImportToTravel && <div className="mb-4">{data.travelImport && <p className="text-xs text-teal-700 mb-3 leading-relaxed">上次匯入：{data.travelImport.targetProjectName}。請至旅遊確認紀錄並統一結算；修改本餐不會自動更新旅遊。</p>}<button onClick={()=>setShowTripImport(true)} className="w-full p-4 bg-teal-600 text-white rounded-xl font-bold">匯入旅遊專案</button></div>}
                    <button onClick={onBack} className="w-full bg-slate-100 text-slate-600 p-4 rounded-xl font-bold">修改設定</button>
                    {showTripImport && <DiningTripImportModal sourceId={sourceProjectId} data={data} calculation={calculation} travelProjects={travelProjects} onImport={onImportToTravel} onClose={()=>setShowTripImport(false)}/>}

                </div>
            );
        };

        const TravelMode = ({ projectData, onUpdate, showMessage, onDeleteEntry, onDeleteDay, onAddDay, initialTab = 'setup' }) => {
            const normalizeTravelData = (source) => {
                const expenses = (source?.expenses || []).map(expense => ({
                    ...expense,
                    day: Math.max(1, parseInt(expense.day, 10) || 1)
                }));
                const highestExpenseDay = expenses.reduce((highest, expense) => Math.max(highest, expense.day), 1);
                return {
                    ...(source || {}),
                    people: (source?.people || []).map(person => ({ ...person })),
                    expenses,
                    days: Math.max(1, parseInt(source?.days, 10) || 1, highestExpenseDay)
                };
            };
            const [tab, setTab] = useState(initialTab);
            const [showReceiptItems, setShowReceiptItems] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [showReceiptScanner, setShowReceiptScanner] = useState(false);
            const [receiptDraft, setReceiptDraft] = useState(null);
            const [editingExpense, setEditingExpense] = useState(null);
            const [modalDay, setModalDay] = useState(() => window.EntryRecycleBin.getDayNumbers(projectData)[0]);
            const [importedExpense,setImportedExpense] = useState(null);
            const [trip, setTrip] = useState(() => normalizeTravelData(projectData));
            const [showWalletSetup, setShowWalletSetup] = useState(false);
            const [activeDay, setActiveDay] = useState(() => window.EntryRecycleBin.getDayNumbers(projectData)[0]);
            const [compositionRevision, setCompositionRevision] = useState(0);
            const isComposingRef = useRef(false);
            const syncBaseRef = useRef(normalizeTravelData(projectData));

            useEffect(() => {
                if (isComposingRef.current) return;
                const normalized = normalizeTravelData(projectData);
                syncBaseRef.current = normalized;
                setTrip(normalized);
                setActiveDay(currentDay => { const days = window.EntryRecycleBin.getDayNumbers(normalized); return days.includes(currentDay) ? currentDay : days[0]; });
            }, [projectData]);
            useEffect(() => {
                if (isComposingRef.current) return;
                const normalizedProjectData = normalizeTravelData(projectData);
                if (!dataValuesEqual(trip, normalizedProjectData)) onUpdate(trip, syncBaseRef.current);
            }, [trip, compositionRevision]);

            const beginTextComposition = () => { isComposingRef.current = true; };
            const finishTextComposition = () => {
                isComposingRef.current = false;
                setCompositionRevision(revision => revision + 1);
            };

            const dayNumbers = window.EntryRecycleBin.getDayNumbers(trip);
            const tripDayCount = dayNumbers.length;
            const activeDayLabel = window.EntryRecycleBin.getDayLabel(trip, activeDay);
            const activeDayExpenses = trip.expenses.filter(expense => (parseInt(expense.day, 10) || 1) === activeDay);
            const activeDayTotal = activeDayExpenses.reduce((sum, expense) => sum + (parseFloat(expense.amount) || 0), 0);
            const tripTotal = trip.expenses.reduce((sum, expense) => sum + (parseFloat(expense.amount) || 0), 0);

            const addPerson = () => {
                const id = Date.now();
                setTrip(prev => ({ ...prev, people: [...prev.people, { id, name: '', payerId: id }] }));
            };
            const removePerson = (id) => {
                if (trip.expenses.some(e=>e.diningImport && (Object.prototype.hasOwnProperty.call(e.splitAmounts || {},id) || Object.prototype.hasOwnProperty.call(e.payers || {},id)))) {
                    showMessage({message:'這位成員仍在匯入的聚餐中，請先刪除該聚餐支出再移除成員。'}); return;
                }
                if (trip.people.length > 1) setTrip(prev => ({ ...prev, people: prev.people.filter(p => p.id !== id) })); };
            const addTripDay = async () => { const nextDay = await onAddDay?.(); if (nextDay) setActiveDay(nextDay); };

            const importReceiptItems = items => {
                if (!trip.people.length) { showMessage({ message: '請先新增成員，再匯入品項。' }); return false; }
                const batchId = createInviteToken();
                const importedAt = new Date().toISOString();
                const importedDay = activeDay;
                setTrip(prev => ({
                    ...prev,
                    expenses: [...prev.expenses, ...items.map((item, index) => ({
                        id: `${batchId}-${index}`, desc: receiptItemName(item), amount: item.amount, day: importedDay,
                        payers: { [prev.people[0].id]: item.amount }, splitBetween: prev.people.map(person => person.id),
                        receiptMeta: { source: 'receipt-items-ocr', currency: 'TWD', originalAmount: item.amount, exchangeRate: 1, quantity: item.quantity, batchId, importedAt }
                    }))]
                }));
                showMessage({ title: '品項已新增', message: `已追加 ${items.length} 筆至第 ${window.EntryRecycleBin.getDayLabel(trip, importedDay)} 天。請逐筆編輯付款人與分攤者；服務費／折扣請另行核對。` });
                return true;
            };
            const addExpense = (newEx) => {
                const expenseDay = Math.max(1, parseInt(newEx.day, 10) || activeDay);
                setTrip(prev => ({ ...prev, expenses: [...prev.expenses, { ...newEx, day: expenseDay, id: createInviteToken() }] }));
                setActiveDay(expenseDay);
            };
            const mergeExpenseDraft = (original, patch) => {
                const current = trip.expenses.find(expense => expense.id === original?.id);
                if (!current || (current._recoveryGeneration || 0) !== (original?._recoveryGeneration || 0)) {
                    showMessage({ title: '帳目已被刪除或還原', message: '這個編輯視窗的原始帳目已變更，未覆蓋目前的帳目。已填內容仍保留；請先確認最新帳目。' });
                    return false;
                }
                const changes = {};
                Object.keys(patch).forEach(field => {
                    if (field !== 'id' && field !== '_recoveryGeneration' && !dataValuesEqual(original[field], patch[field])) changes[field] = patch[field];
                });
                setTrip(prev => ({ ...prev, expenses: prev.expenses.map(expense => expense.id === original.id ? { ...expense, ...changes } : expense) }));
                setActiveDay(Math.max(1, parseInt(changes.day ?? current.day, 10) || 1));
                return true;
            };
            const updateExpense = updated => mergeExpenseDraft(editingExpense, updated);
            const saveImportedExpense = patch => mergeExpenseDraft(importedExpense, patch);
            const deleteExpense = id => { const item = trip.expenses.find(entry => entry.id === id); if (item) onDeleteEntry?.('expenses', item); };
            const handleEditClick = (expense) => {
                if (expense.diningImport) { setImportedExpense(expense); return; }
                setReceiptDraft(null);
                setEditingExpense(expense);
                setModalDay(Math.max(1, parseInt(expense.day, 10) || 1));
                setActiveDay(Math.max(1, parseInt(expense.day, 10) || 1));
                setShowAddModal(true);
            };
            const handleReceiptDraft = draft => {
                const proposedDay = parseInt(draft.day, 10) || activeDay;
                const draftDay = dayNumbers.includes(proposedDay) ? proposedDay : activeDay;
                setModalDay(draftDay);
                setReceiptDraft({ ...draft, day: draftDay });
                setEditingExpense(null);
                setActiveDay(draftDay);
                setShowReceiptScanner(false);
                setShowAddModal(true);
            };

            if (showWalletSetup) return <WalletSetupScreen people={trip.people} onUpdate={(newPeople) => setTrip(prev => ({ ...prev, people: newPeople }))} onNext={() => setShowWalletSetup(false)} onBack={() => setShowWalletSetup(false)} showMessage={showMessage} />;

            return (
                <div className="aa-travel h-full flex flex-col relative" data-tab={tab}>
                    <div className="aa-tabs flex bg-white border-b border-slate-200" role="tablist" aria-label="旅遊記帳分頁">
                        {['setup', 'expenses', 'settle'].map(t => <button key={t} id={`travel-tab-${t}`} type="button" role="tab" data-tab={t} aria-selected={tab === t} aria-controls="travel-panel" tabIndex={tab === t ? 0 : -1} onKeyDown={event => { const tabs = ['setup', 'expenses', 'settle']; let next; if (event.key === 'ArrowRight') next = (tabs.indexOf(t) + 1) % 3; if (event.key === 'ArrowLeft') next = (tabs.indexOf(t) + 2) % 3; if (event.key === 'Home') next = 0; if (event.key === 'End') next = 2; if (next !== undefined) { event.preventDefault(); setTab(tabs[next]); event.currentTarget.parentElement.querySelectorAll('[role="tab"]')[next].focus(); } }} onClick={() => setTab(t)} className={`flex-1 py-3 text-sm font-bold ${tab === t ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-400'}`}>{t === 'setup' ? '設定' : t === 'expenses' ? '記帳' : '結算'}</button>)}
                    </div>
                    <div className="flex-1 overflow-y-auto bg-slate-50 no-scrollbar" id="travel-panel" role="tabpanel" aria-labelledby={`travel-tab-${tab}`} tabIndex={0}>
                        {tab === 'setup' && (
                            <div className="aa-setup-pane p-4 pb-24"><div className="aa-setup-banner"><h2>一起出發，先設定</h2><span>旅遊設定</span></div><div className="aa-setup-form p-6 space-y-4 bg-white rounded-2xl shadow-sm">
                                <div><label className="block text-sm text-slate-500 mb-1">旅遊名稱</label><input className="w-full p-3 border rounded-xl bg-slate-50" value={trip.name} onCompositionStart={beginTextComposition} onCompositionEnd={event => { applyInputValue(event, value => setTrip(prev => ({ ...prev, name: value }))); finishTextComposition(); }} onChange={event => applyInputValue(event, value => setTrip(prev => ({ ...prev, name: value })))} /></div>
                                <div><label className="block text-sm text-slate-500 mb-2">成員</label><div className="space-y-2">{trip.people.map((p, idx) => (<div key={p.id} className="flex gap-2"><input className="flex-1 p-2 border rounded-lg" placeholder={getPersonNameHelper(p.id, trip.people)} value={p.name} onCompositionStart={beginTextComposition} onCompositionEnd={event => { applyInputValue(event, value => setTrip(prev => ({ ...prev, people: prev.people.map(person => person.id === p.id ? { ...person, name: value } : person) }))); finishTextComposition(); }} onChange={event => applyInputValue(event, value => setTrip(prev => ({ ...prev, people: prev.people.map(person => person.id === p.id ? { ...person, name: value } : person) })))} />{trip.people.length > 1 && <button aria-label={`移除成員 ${getPersonNameHelper(p.id, trip.people)}`} onClick={() => removePerson(p.id)}><i className="fa-solid fa-trash text-slate-300"></i></button>}</div>))}<button onClick={addPerson} className="text-sm text-teal-600 font-bold">+ 新增成員</button></div></div>
                                <div className="pt-4 border-t border-slate-100"><button onClick={() => setShowWalletSetup(true)} className="w-full py-3 bg-teal-50 text-teal-700 rounded-xl font-bold flex items-center justify-center gap-2 border border-teal-200 hover:bg-teal-100"><i className="fa-solid fa-wallet"></i> 設定共同錢包 (家庭/情侶)</button></div>
                            </div></div>
                        )}
                        {tab === 'expenses' && (
                            <div className="p-4 pb-24">
                                <div className="mb-4">
                                    <div className="aa-day-heading flex flex-wrap items-end justify-between gap-3 mb-3">
                                        <div><p className="text-sm font-bold text-slate-700">旅遊日程</p><p className="text-xs text-slate-400 mt-1">可隨時切回前面的天數新增或編輯</p></div>
                                        <div className="aa-day-actions flex flex-wrap gap-2">
                                            <button type="button" onClick={addTripDay} className="shrink-0 px-3 py-2 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 text-xs font-bold"><i className="fa-solid fa-plus mr-1"></i>新增一天</button>
                                            <button type="button" disabled={tripDayCount <= 1} onClick={() => onDeleteDay?.(window.EntryRecycleBin.daySnapshot(trip, activeDay))} aria-label={`刪除第 ${activeDayLabel} 天`} title="整天與支出移入回收桶，保留七天；至少保留一天" className="aa-delete-day px-3 py-2 rounded-xl border text-xs font-bold disabled:opacity-40"><i className="fa-solid fa-trash mr-1" aria-hidden="true"></i>刪除這一天</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                        {dayNumbers.map(day => {
                                            const expenseCount = trip.expenses.filter(expense => (parseInt(expense.day, 10) || 1) === day).length;
                                            const selected = activeDay === day;
                                            return <button type="button" key={day} aria-pressed={selected} onClick={() => setActiveDay(day)} className={`shrink-0 min-w-[88px] px-4 py-3 rounded-xl border text-sm font-bold transition ${selected ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>第 {window.EntryRecycleBin.getDayLabel(trip, day)} 天 <span className={`ml-1 text-[10px] ${selected ? 'text-blue-100' : 'text-slate-300'}`}>{expenseCount} 筆</span></button>;
                                        })}
                                    </div>
                                </div>
                                <button type="button" onClick={() => setShowReceiptItems(true)} className="w-full mb-4 p-3 rounded-xl bg-teal-50 border border-teal-200 text-teal-700 font-bold">拍帳單批次新增</button>
                                <div className="aa-day-summary bg-teal-600 text-white p-6 rounded-2xl shadow-lg mb-6">

                                            <div className="pt-2 border-t border-slate-50 flex items-start gap-2"><i className="fa-solid fa-users text-xs text-slate-400 mt-1"></i><p className="text-xs text-slate-400">{exp.diningImport ? '依原聚餐個人金額分攤: ' : '分攤: '}{exp.splitBetween.length === trip.people.length ? '全員' : exp.splitBetween.map(id => getPersonNameHelper(id, trip.people)).join(', ')}</p></div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => { setEditingExpense(null); setReceiptDraft(null); setModalDay(activeDay); setShowAddModal(true); }} aria-label={`新增第 ${activeDayLabel} 天支出`} className="fixed bottom-24 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center z-10"><i className="fa-solid fa-plus text-xl"></i></button>
                            </div>
                        )}
                        {tab === 'settle' && <SettlementView trip={trip} showMessage={showMessage} />}
                    </div>
                    {importedExpense && <ImportedDiningEditModal expense={importedExpense} dayNumbers={dayNumbers} onClose={()=>setImportedExpense(null)} onSave={saveImportedExpense}/>}
                    {showAddModal && <AddExpenseModal people={trip.people} dayNumbers={dayNumbers} defaultDay={modalDay} initialData={editingExpense} prefillData={receiptDraft} onScanReceipt={() => { setShowAddModal(false); setShowReceiptScanner(true); }} onClose={() => { setShowAddModal(false); setEditingExpense(null); setReceiptDraft(null); }} onAdd={addExpense} onUpdate={updateExpense} getPersonName={(id) => getPersonNameHelper(id, trip.people)} showMessage={showMessage} />}
                    {showReceiptItems && <ReceiptItemsModal onClose={() => setShowReceiptItems(false)} onApply={importReceiptItems} />}
                    {showReceiptScanner && <TravelReceiptCaptureModal people={trip.people} defaultDay={modalDay} onClose={() => { setShowReceiptScanner(false); setShowAddModal(true); }} onCreateDraft={handleReceiptDraft} showMessage={showMessage} />}
                </div>
            );
        };

        const SettlementView = ({ trip, showMessage }) => {
            const result = calculateSettlementHelper(trip);
            if (result.error) return <div className="p-6 pb-24 flex flex-col items-center justify-center h-full text-center"><div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i></div><h3 className="font-bold text-xl text-slate-800">資料格式異常</h3><p className="text-slate-500 text-sm mt-2 max-w-xs">偵測到異常，無法結算。</p></div>;
            const { overview, transactions } = result;
            const expenseGroups = getTravelExpenseGroups(trip);
            const expenseCount = expenseGroups.reduce((sum, group) => sum + group.rows.length, 0);
            const expenseTotal = expenseGroups.reduce((sum, group) => sum + group.total, 0);
            const settlementText = [`${trip.name || '本次旅遊'}｜全旅程結算`, ...transactions.map(transaction => `．${getPersonNameHelper(transaction.from, trip.people)} 付給 ${getPersonNameHelper(transaction.to, trip.people)} ${formatMoney(Math.round(transaction.amount))}`), ...(transactions.length ? [] : ['無需轉帳']), '', '費用明細', ...expenseGroups.flatMap(group => [`第 ${group.label} 天｜小計 ${formatMoney(group.total)}`, ...group.rows.map(row => `．${row.name} ${formatMoney(row.amount)}`)]), `全旅程合計 ${formatMoney(expenseTotal)}`].join('\n');


            return (
                <div className="aa-trip-result p-6 pb-24">
