<body class="aa-ui bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, browserLocalPersistence, setPersistence, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, deleteDoc, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyAK7SbGI_32ShLGvGeo0S5fa7ZvtxHPBM8",
            authDomain: "spliteasy-2026.firebaseapp.com",
            projectId: "spliteasy-2026",
            storageBucket: "spliteasy-2026.firebasestorage.app",
            messagingSenderId: "759829684406",
            appId: "1:759829684406:web:6d966fc7b7c2da5ed9c617"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const FIREBASE_APP_ID = 'spliteasy-2026';
        const APP_VERSION = '2.6.2';
        const BUILD_ID = 'v2.6.2-prod-r1';
        // v2.2 正式版使用全新的資料空間與首頁索引，不載入任何舊版帳本。
        const DATA_SPACE = 'spliteasy-v2-2-prod';
        const USER_INDEX_SPACE = 'spliteasy-v2-2-prod';
        const DATA_SCHEMA_VERSION = '2.2.0';
        const projectRefFor = (projectId) => doc(db, 'apps', DATA_SPACE, 'projects', projectId);
        const memberRefFor = (projectId, uid) => doc(db, 'apps', DATA_SPACE, 'projects', projectId, 'members', uid);
        const inviteRefFor = (projectId, inviteId) => doc(db, 'apps', DATA_SPACE, 'projects', projectId, 'invites', inviteId);
        const userProjectRefFor = (uid, projectId) => doc(db, 'users', uid, 'spaces', USER_INDEX_SPACE, 'projects', projectId);
        const userProjectCollectionFor = (uid) => collection(db, 'users', uid, 'spaces', USER_INDEX_SPACE, 'projects');

        // 共編時只合併實際變動的欄位；避免兩台裝置用舊的整份資料互相覆蓋。
        const COLLAB_ENTITY_ARRAY_KEYS = new Set(['people', 'diningItems', 'expenses']);
        const COLLAB_MAP_KEYS = new Set(['customAmounts']);
        // Recovery metadata and day structure are written only by their own transactions.
        const RECOVERY_DATA_KEYS = new Set(['recycleBin', 'activityLog', 'historyGuards', 'dayOrder', 'daySequence', 'days']);
        const RecoveryPanel = globalThis.RecoveryPanel;
        const recoveryActor = user => ({ uid: user.uid, name: user.displayName || user.email || '共編成員' });
        const cloneDataValue = (value) => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
        const dataValuesEqual = (left, right) => JSON.stringify(left) === JSON.stringify(right);
        const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value || {}, key);
        const entityKey = (value) => String(value?.id);
        const readInputValue = (event) => {
            // React SyntheticEvent 離開 handler 後可能失效；所有 IME handler 都必須在此刻先取值。
            const value = event?.currentTarget?.value ?? event?.target?.value;
            return value == null ? '' : value;
        };
        const applyInputValue = (event, applyValue) => {
            const value = readInputValue(event);
            applyValue(value);
            return value;
        };
        const waitFor = (milliseconds) => new Promise(resolve => window.setTimeout(resolve, milliseconds));
        const RETRYABLE_PROJECT_READ_CODES = new Set(['permission-denied', 'unavailable', 'deadline-exceeded', 'cancelled', 'unknown']);

        const getProjectWithRetry = async (projectId, attempts = 3) => {
            let lastError = null;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
                try {
                    return await getDoc(projectRefFor(projectId));
                } catch (error) {
                    lastError = error;
                    if (!RETRYABLE_PROJECT_READ_CODES.has(error?.code) || attempt === attempts - 1) throw error;
                    await waitFor(350 * (attempt + 1));
                }
            }
            throw lastError;
        };

        const ensureUserProjectIndex = async ({ uid, projectId, role, joinedAt, project }) => {
            if (!uid || !projectId) return;
            await setDoc(userProjectRefFor(uid, projectId), {
                role: role || (project?.ownerId === uid ? 'owner' : 'editor'),
                joinedAt: joinedAt || new Date().toISOString(),
                projectName: project?.name || '',
                projectType: project?.type || '',
                lastConfirmedAt: new Date().toISOString()
            }, { merge: true });
        };

        const buildDataOperations = (baseData = {}, nextData = {}) => {
            const operations = [];
            const keys = new Set([...Object.keys(baseData || {}), ...Object.keys(nextData || {})]);

            keys.forEach(key => {
                if (RECOVERY_DATA_KEYS.has(key)) return;
                const baseValue = baseData?.[key];
                const nextValue = nextData?.[key];
                if (dataValuesEqual(baseValue, nextValue)) return;

                if (COLLAB_ENTITY_ARRAY_KEYS.has(key) && Array.isArray(baseValue) && Array.isArray(nextValue)) {
                    const baseMap = new Map(baseValue.map(item => [entityKey(item), item]));
                    const nextMap = new Map(nextValue.map(item => [entityKey(item), item]));

                    baseMap.forEach((item, id) => {
                        if (!nextMap.has(id)) operations.push({ type: 'entity-delete', key, id });
                    });

                    nextMap.forEach((item, id) => {
                        const baseItem = baseMap.get(id);
                        if (!baseItem) {
                            operations.push({ type: 'entity-upsert', key, id, value: cloneDataValue(item) });
                            return;
                        }
                        const itemFields = new Set([...Object.keys(baseItem), ...Object.keys(item)]);
                        itemFields.delete('id');
                        itemFields.delete('_recoveryGeneration');
                        itemFields.forEach(field => {
                            if (dataValuesEqual(baseItem[field], item[field])) return;
                            operations.push({
                                type: 'entity-field',
                                key,
                                id,
                                field,
                                expectedGeneration: baseItem._recoveryGeneration || 0,
                                remove: !hasOwn(item, field),
                                value: cloneDataValue(item[field])
                            });
                        });
                    });
                    return;
                }

                if (COLLAB_MAP_KEYS.has(key) && baseValue && nextValue && typeof baseValue === 'object' && typeof nextValue === 'object' && !Array.isArray(baseValue) && !Array.isArray(nextValue)) {
                    const mapFields = new Set([...Object.keys(baseValue), ...Object.keys(nextValue)]);
                    mapFields.forEach(field => {
                        if (dataValuesEqual(baseValue[field], nextValue[field])) return;
                        operations.push({
                            type: 'map-field',
                            key,
                            field,
                            remove: !hasOwn(nextValue, field),
                            value: cloneDataValue(nextValue[field])
                        });
                    });
                    return;
                }

                operations.push({
                    type: 'data-field',
                    key,
                    remove: !hasOwn(nextData, key),
                    value: cloneDataValue(nextValue)
                });
            });

            return operations;
        };

        const applyDataOperations = (sourceData = {}, operations = []) => {
            const result = cloneDataValue(sourceData) || {};
            operations.forEach(operation => {
                if (RECOVERY_DATA_KEYS.has(operation.key)) return;
                if (operation.key === 'expenses' && operation.type === 'entity-upsert' && !window.EntryRecycleBin.getDayNumbers(result).includes(Math.max(1, parseInt(operation.value?.day, 10) || 1))) return;
                if (operation.type === 'data-field') {
                    if (operation.remove) delete result[operation.key];
                    else result[operation.key] = cloneDataValue(operation.value);
                    return;
                }

                if (operation.type === 'map-field') {
                    const mapValue = { ...(result[operation.key] || {}) };
                    if (operation.remove) delete mapValue[operation.field];
                    else mapValue[operation.field] = cloneDataValue(operation.value);
                    result[operation.key] = mapValue;
                    return;
                }

                const entities = Array.isArray(result[operation.key]) ? [...result[operation.key]] : [];
                const index = entities.findIndex(item => entityKey(item) === operation.id);
                if (operation.type === 'entity-upsert' && ['expenses', 'diningItems'].includes(operation.key)
                    && (index >= 0 || window.EntryRecycleBin.hasDeletedEntry(result, operation.key, operation.id))) return;
                if (operation.type === 'entity-delete') {
                    if (index >= 0) entities.splice(index, 1);
                } else if (operation.type === 'entity-upsert') {
                    if (index >= 0) entities[index] = { ...entities[index], ...cloneDataValue(operation.value) };
                    else entities.push(cloneDataValue(operation.value));
                } else if (operation.type === 'entity-field') {
                    // A stale edit must never recreate an entry another collaborator deleted.
                    if (index < 0) return;
                    if ((entities[index]._recoveryGeneration || 0) !== (operation.expectedGeneration || 0)) return;
                    const entity = { ...entities[index] };
                    if (operation.remove) delete entity[operation.field];
                    else entity[operation.field] = cloneDataValue(operation.value);
                    if (index >= 0) entities[index] = entity;
                    else entities.push(entity);
                }
                result[operation.key] = entities;
            });
            return result;
        };

        const assertRecoverableOperations = (project, operations) => {
            let data = project.data || {};
            const activeDays = project.type === 'travel' ? window.EntryRecycleBin.getDayNumbers(data) : [];
            for (const operation of operations) {
                if (!['expenses', 'diningItems'].includes(operation.key)) continue;
                const existing = (data[operation.key] || []).find(item => entityKey(item) === operation.id);
                let message = '';
                if (operation.type === 'entity-delete') message = '請使用帳目旁的刪除按鈕，將帳目移入回收桶。';
                if (operation.type === 'entity-field' && !existing) message = '這筆帳目已被其他共編者刪除。';
                if (operation.type === 'entity-field' && existing && (existing._recoveryGeneration || 0) !== (operation.expectedGeneration || 0)) message = '這筆帳目已刪除並還原，請以還原後的內容重新編輯。';
                if (operation.type === 'entity-upsert' && existing) message = '帳目識別碼重複，未覆蓋既有帳目。';
                if (operation.type === 'entity-upsert' && window.EntryRecycleBin.hasDeletedEntry(data, operation.key, operation.id)) message = '這筆識別碼的帳目曾被刪除，請從回收桶還原，或新增一筆新的帳目。';
                const targetDay = operation.type === 'entity-upsert' ? operation.value?.day : operation.field === 'day' ? operation.value : existing?.day;
                if (operation.key === 'expenses' && !activeDays.includes(Math.max(1, parseInt(targetDay, 10) || 1))) message = '這筆支出所屬的天數已被刪除。';
                if (message) { const error = new Error(message); error.code = 'collab-conflict'; throw error; }
                data = applyDataOperations(data, [operation]);
            }
        };

        const getProjectDisplayName = (type, data) => {
            const activityName = type === 'dining' ? data?.title : data?.name;
            return activityName?.trim() || (type === 'dining' ? '未命名聚餐' : '未命名旅遊');
        };

        // 只清除 Split Easy 舊版鍵值，不觸碰同一瀏覽器的其他網站資料。
        try {
            const productionSchemaKey = 'splitEasy_v2_2_prod_schemaVersion';
            if (localStorage.getItem(productionSchemaKey) !== DATA_SCHEMA_VERSION) {
                [
                    'splitEasy_apiKey',
                    'splitEasy_currentProject',
                    'splitEasy_myProjects',
                    'splitEasy_schemaVersion',
                    'splitEasy_v2_2_preview_schemaVersion'
                ].forEach(key => localStorage.removeItem(key));
                localStorage.setItem(productionSchemaKey, DATA_SCHEMA_VERSION);
            }
        } catch (error) {
            console.warn('無法清理舊版瀏覽器快取：', error);
        }

        // --- 工具 ---
        const copyToClipboard = async (text) => {
            if (navigator.clipboard?.writeText && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (error) {
                    console.warn('Clipboard API 失敗，改用相容模式：', error);
                }
            }
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            let copied = false;
            try { copied = document.execCommand('copy'); } catch (err) { console.error(err); }
            document.body.removeChild(textArea);
            return copied;
        };

        const createInviteToken = () => {
            if (window.crypto?.randomUUID) return window.crypto.randomUUID();
            const bytes = new Uint8Array(24);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
        };

        const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(amount);
        const ANIMAL_NAMES = ['水豚君', '小海獺', '胖企鵝', '圓仔', '吉娃娃', '樹懶', '蜜袋鼯', '柯基', '兔兔', '招財貓'];

        const parseTaiwanInvoiceQrCodes = (rawCodes) => window.SplitEasyInvoice.parse(rawCodes);
        
        const getPersonNameHelper = (id, people) => {
            const p = people.find(x => x.id === parseInt(id));
            if (!p) return '未知';
            const idx = people.findIndex(x => x.id === parseInt(id));
            return p.name || ANIMAL_NAMES[(p.id + idx) % ANIMAL_NAMES.length];
        };

        // --- 旅遊結算邏輯 ---
        const calculateSettlementHelper = (data) => {
            try {
                let balances = {}; 
                const people = data.people || [];
                people.forEach(p => balances[p.id] = 0);

                const expenses = data.expenses || [];

                expenses.forEach(exp => {
                    if (!exp || !exp.payers || !exp.splitBetween) return;
                    const amount = parseFloat(exp.amount) || 0;
                    
                    Object.entries(exp.payers).forEach(([pId, amt]) => {
                        const cleanAmt = parseFloat(amt) || 0; 
                        balances[pId] = (balances[pId] || 0) + cleanAmt;
                    });

                    if (exp.splitAmounts) {
                        const entries = Object.entries(exp.splitAmounts);
                        if (Math.abs(entries.reduce((sum, [, value]) => sum + Number(value), 0) - amount) > 0.005 ||
                            entries.some(([id, value]) => !people.some(p => String(p.id) === id) || !Number.isFinite(Number(value))) ||
                            Object.keys(exp.payers).some(id => !people.some(p => String(p.id) === id))) throw new Error('匯入聚餐的成員或金額異常');
                        entries.forEach(([id, value]) => { balances[id] = (balances[id] || 0) - Number(value); });
                        return;
                    }
                    const splitCount = exp.splitBetween.length;
                    if (splitCount > 0) {
                        const perPerson = amount / splitCount;
                        exp.splitBetween.forEach(pId => {
                            if (balances[pId] !== undefined) balances[pId] -= perPerson;
                            else balances[pId] = (balances[pId] || 0) - perPerson;
                        });
                    }
                });

                people.forEach(p => {
                    if (p.payerId && p.payerId !== p.id) {
                        const mainPayerId = p.payerId;
                        const boundBalance = balances[p.id] || 0;
                        if (balances[mainPayerId] !== undefined) {
                            balances[mainPayerId] += boundBalance; 
                            balances[p.id] = 0; 
                        }
                    }
                });

                let debtors = [], creditors = [];
                Object.entries(balances).forEach(([id, amt]) => {
                    const val = Math.round(amt * 100) / 100;
                    if (val <= -0.01) debtors.push({ id: parseInt(id), amount: val });
                    if (val >= 0.01) creditors.push({ id: parseInt(id), amount: val });
                });

                debtors.sort((a, b) => a.amount - b.amount);
                creditors.sort((a, b) => b.amount - a.amount);

                const transactions = [];
                let i = 0, j = 0;
                let safety = 0;

                while (i < debtors.length && j < creditors.length && safety < 3000) {
                    safety++;
                    const debtor = debtors[i];
                    const creditor = creditors[j];
                    if(!debtor || !creditor) break;

                    const amount = Math.min(Math.abs(debtor.amount), creditor.amount);
                    if (amount < 0.01) {
                        if(Math.abs(debtor.amount) < creditor.amount) i++; else j++;
                        continue;
                    }

                    transactions.push({ from: debtor.id, to: creditor.id, amount });
                    debtor.amount += amount;
                    creditor.amount -= amount;

                    if (Math.abs(debtor.amount) < 0.005) i++;
                    if (creditor.amount < 0.005) j++;
                }

                return {
                    overview: people.map(p => ({ id: p.id, name: getPersonNameHelper(p.id, people), balance: balances[p.id] || 0, payerId: p.payerId })),
                    transactions,
                    error: false
                };
            } catch (e) {
                console.error("Critical Settlement Error:", e);
                return { overview: [], transactions: [], error: true };
            }
        };

        // 舊帳本沒有 payerId 時各自結算；失效、循環或多層關係都先正規化。
        const normalizeDiningWalletPeople = (people = []) => {
            const peopleById = new Map(people.map(person => [String(person.id), person]));
            return people.map(person => {
                let current = person;
                const visited = new Set();
                while (current.payerId != null && String(current.payerId) !== String(current.id)) {
                    const key = String(current.id);
                    if (visited.has(key) || !peopleById.has(String(current.payerId))) return { ...person, payerId: person.id };
                    visited.add(key);
                    current = peopleById.get(String(current.payerId));
                }
                return { ...person, payerId: current.id };
            });
        };

        const changeDiningWallet = (people, memberId, representativeId) => {
            const normalized = normalizeDiningWalletPeople(people);
            const member = normalized.find(person => person.id === memberId);
            const representative = normalized.find(person => person.id === representativeId);
            if (!member || !representative) return normalized;
            const targetId = representativeId === memberId ? memberId : representative.payerId;
            if (targetId === memberId && member.payerId === memberId) return normalized;
            return normalized.map(person => {
                const movesWithGroup = member.payerId === member.id && person.payerId === member.id;
                return person.id === memberId || movesWithGroup ? { ...person, payerId: targetId } : person;
            });
        };

        const getDiningWalletGroups = (people) => {
            const normalized = normalizeDiningWalletPeople(people);
            return normalized.filter(person => person.payerId === person.id).map(owner => ({
                id: owner.id,
                name: getPersonNameHelper(owner.id, normalized),
                members: normalized.filter(person => person.payerId === owner.id)
            }));
        };

        // 先依個人餐點分攤服務費及整數尾差，再合併錢包，避免分組改變餐費。
        const calculateDiningResult = (data) => {
            const people = normalizeDiningWalletPeople(data.people || []);
            const customAmounts = data.customAmounts || {};
            const diningItems = data.diningItems || [];
            const bill = data.splitMode === 'custom'
                ? people.reduce((sum, person) => sum + Math.max(0, parseFloat(customAmounts[person.id]) || 0), 0)
                : data.splitMode === 'mixed'
                    ? Math.max(0, diningItems.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0))
                    : Math.max(0, parseFloat(data.totalBill) || 0);
            const scValue = Math.max(0, parseFloat(data.serviceChargeValue) || 0);
            const scAmt = data.serviceChargeType === 'percent' ? bill * (scValue / 100) : scValue;
            const final = bill + scAmt;
            const results = [];
            if (data.splitMode === 'even') {
                const per = people.length ? final / people.length : 0;
                people.forEach(p => results.push({ id: p.id, name: getPersonNameHelper(p.id, people), amount: per, detail: '均攤' }));
            } else if (data.splitMode === 'custom') {
                people.forEach(p => {
                    const raw = Math.max(0, parseFloat(customAmounts[p.id]) || 0);
                    const service = data.serviceChargeType === 'percent' ? raw * (scValue / 100) : scAmt * (bill > 0 ? raw / bill : 1 / people.length);
                    const amount = data.serviceChargeType === 'percent' ? raw * (1 + scValue / 100) : raw + service;
                    results.push({ id: p.id, name: getPersonNameHelper(p.id, people), amount, detail: `個人餐點 ${formatMoney(raw)}` });
                });
            } else {
                const rawShares = Object.fromEntries(people.map(p => [p.id, 0]));
                const itemNames = Object.fromEntries(people.map(p => [p.id, []]));
                diningItems.forEach(item => {
                    const amount = parseFloat(item.amount) || 0;
                    const participantIds = (item.participantIds || []).filter(id => people.some(p => p.id === id));
                    if (!amount || !participantIds.length) return;
                    participantIds.forEach(id => {
                        rawShares[id] += amount / participantIds.length;
                        itemNames[id].push(item.name?.trim() || '未命名品項');
                    });
                });
                people.forEach(p => {
                    const raw = rawShares[p.id] || 0;
                    const service = data.serviceChargeType === 'percent' ? raw * (scValue / 100) : (bill > 0 ? scAmt * (raw / bill) : 0);
                    results.push({ id: p.id, name: getPersonNameHelper(p.id, people), amount: raw + service, detail: itemNames[p.id].join('、') || '未分攤品項' });
                });
            }
            const roundedTotal = Math.round(final);
            const roundedResults = results.map((result, index) => ({ ...result, amount: Math.floor(result.amount), fraction: result.amount - Math.floor(result.amount), index }));
            let remaining = roundedTotal - roundedResults.reduce((sum, result) => sum + result.amount, 0);
            [...roundedResults].sort((a, b) => b.fraction - a.fraction || a.index - b.index).forEach(result => {
                if (remaining > 0) { roundedResults[result.index].amount += 1; remaining -= 1; }
            });
            const payerId = people.some(person => person.id === data.billPayerId) ? data.billPayerId : people[0]?.id;
            const payerWalletId = people.find(person => person.id === payerId)?.payerId;
            const wallets = getDiningWalletGroups(people).map(wallet => {
                const members = roundedResults.filter(result => wallet.members.some(person => person.id === result.id));
                return { ...wallet, members, amount: members.reduce((sum, member) => sum + member.amount, 0) };
            });
            const receivingWallet = wallets.find(wallet => wallet.id === payerWalletId);
            const transfers = wallets.filter(wallet => wallet.id !== payerWalletId && wallet.amount !== 0)
                .map(wallet => wallet.amount > 0
                    ? { fromId: wallet.id, toId: payerWalletId, from: wallet.name, to: receivingWallet?.name || '', amount: wallet.amount }
                    : { fromId: payerWalletId, toId: wallet.id, from: receivingWallet?.name || '', to: wallet.name, amount: -wallet.amount });
            return { finalTotal: roundedTotal, serviceChargeAmount: scAmt, results: roundedResults, payerId, payerWalletId, wallets, transfers };
        };

        // --- UI 元件 ---

        // 結算明細只讀取現有資料，不參與原本的分帳計算。
        const getDiningExpenseRows = (data, calculation) => {
            let rows;
            if (data.splitMode === 'mixed') {
                rows = (data.diningItems || []).filter(item => parseFloat(item.amount)).map((item, index) => ({
                    id: item.id || index, name: item.name?.trim() || '未命名品項', amount: parseFloat(item.amount) || 0
                }));
            } else if (data.splitMode === 'custom') {
                rows = (data.people || []).map(person => ({

                    amount: Math.max(0, parseFloat(data.customAmounts?.[person.id]) || 0)
                })).filter(row => row.amount > 0);
            } else {
                rows = [{ id: 'bill', name: '聚餐費用', amount: Math.max(0, parseFloat(data.totalBill) || 0) }].filter(row => row.amount > 0);
            }
            if (calculation.serviceChargeAmount) rows.push({ id: 'service', name: '服務費', amount: calculation.serviceChargeAmount });
            const difference = Math.round((calculation.finalTotal - rows.reduce((sum, row) => sum + row.amount, 0)) * 100) / 100;
            if (difference) rows.push({ id: 'rounding', name: '尾差調整', amount: difference });
            return rows;
        };

        const getTravelExpenseGroups = (trip) => {

            const modalRef = useRef(null);
            useEffect(() => {
                if (!dialog) return;
                const previous = document.activeElement;
                const node = modalRef.current;
                node?.querySelector('button')?.focus();
                const handleKey = event => {
                    if (event.key === 'Escape') { event.preventDefault(); onClose(); return; }
                    if (event.key !== 'Tab') return;
                    const buttons = [...(node?.querySelectorAll('button:not(:disabled)') || [])];
                    const first = buttons[0], last = buttons.at(-1);
                    if (event.shiftKey && (document.activeElement === first || !node?.contains(document.activeElement))) { event.preventDefault(); last?.focus(); }
                    if (!event.shiftKey && (document.activeElement === last || !node?.contains(document.activeElement))) { event.preventDefault(); first?.focus(); }
                };
                document.addEventListener('keydown', handleKey);
                return () => { document.removeEventListener('keydown', handleKey); if (previous?.isConnected) previous.focus(); };
            }, [dialog]);
            if (!dialog) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4 animate-fade-in">

        const CollaborationManagerModal = ({ project, user, onClose, onCreateInvite, requestConfirm, showMessage }) => {
            const [members, setMembers] = useState([]);
            const [invites, setInvites] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [busyKey, setBusyKey] = useState('');

            const loadData = async () => {
                setIsLoading(true);
                try {
                    const [memberSnapshot, inviteSnapshot] = await Promise.all([
                        getDocs(collection(db, 'apps', DATA_SPACE, 'projects', project.id, 'members')),
                        getDocs(collection(db, 'apps', DATA_SPACE, 'projects', project.id, 'invites'))
                    ]);
                    const loadedMembers = memberSnapshot.docs.map(memberDoc => ({ id: memberDoc.id, ...memberDoc.data() }))
                        .sort((left, right) => left.role === 'owner' ? -1 : right.role === 'owner' ? 1 : String(left.joinedAt || '').localeCompare(String(right.joinedAt || '')));
                    const loadedInvites = inviteSnapshot.docs.map(inviteDoc => ({ id: inviteDoc.id, ...inviteDoc.data() }))
                        .sort((left, right) => String(right.createdAt || '').localeCompare(String(left.createdAt || '')));
                    setMembers(loadedMembers);
                    setInvites(loadedInvites);
                } catch (error) {
                    console.error('Load collaboration manager error:', error);
                    showMessage({ title: '無法載入共編管理', message: '請確認網路連線與 Firebase 權限後再試。' });
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { loadData(); }, [project.id]);

            const formatDateTime = value => {
                if (!value) return '時間不明';
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? '時間不明' : date.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            };

            const createInvite = async () => {
                setBusyKey('create');
                try {
                    const created = await onCreateInvite();
                    if (created) await loadData();
                } finally {
                    setBusyKey('');
                }
            };

            const removeMember = member => requestConfirm({
                type: 'confirm',
                title: '移除共編成員',
                message: `確定要移除「${member.displayName || member.email || '這位成員'}」嗎？\n\n移除後會立即失去此專案的讀寫權限，對方的首頁索引也會在同一批操作中移除。`,
                confirmText: '確認移除',
                onConfirm: async () => {
                    setBusyKey(`member-${member.id}`);
                    try {
                        const batch = writeBatch(db);
                        batch.delete(memberRefFor(project.id, member.id));
                        batch.delete(userProjectRefFor(member.id, project.id));
                        await batch.commit();
                        await loadData();
                        showMessage({ title: '已移除成員', message: '此帳號已無法再開啟或修改專案，首頁索引也已同步移除。' });
                    } catch (error) {
                        console.error('Remove collaborator error:', error);
                        showMessage({ title: '移除失敗', message: '目前無法移除這位成員，請稍後再試。' });
                    } finally {
                        setBusyKey('');
                    }
                }
            });

            const revokeInvite = invite => requestConfirm({
                type: 'confirm',
                title: '撤銷邀請連結',
                message: '撤銷後，尚未加入的人即使持有這個舊連結也無法加入；已加入的成員不受影響。',
                confirmText: '確認撤銷',
                onConfirm: async () => {
                    setBusyKey(`invite-${invite.id}`);
                    try {
                        await setDoc(inviteRefFor(project.id, invite.id), {
                            status: 'revoked',
                            revokedAt: new Date().toISOString(),
                            revokedBy: user.uid
                        }, { merge: true });
                        await loadData();
                        showMessage({ title: '邀請已撤銷', message: '舊連結已失效；需要時可建立新的邀請連結。' });
                    } catch (error) {
                        console.error('Revoke invite error:', error);
                        showMessage({ title: '撤銷失敗', message: '目前無法撤銷這個邀請，請稍後再試。' });
                    } finally {
                        setBusyKey('');
                    }
                }
            });

            const activeInvites = invites.filter(invite => invite.status === 'active');
            const inactiveInvites = invites.filter(invite => invite.status !== 'active');

            return (
                <div className="fixed inset-0 bg-black/60 z-[9997] flex items-end sm:items-center justify-center sm:p-4 animate-fade-in">

                        <div className="p-5 space-y-6">
                            <button onClick={createInvite} disabled={busyKey === 'create'} className="w-full p-4 rounded-xl bg-teal-600 disabled:opacity-50 text-white font-black shadow-md"><i className={`fa-solid ${busyKey === 'create' ? 'fa-spinner fa-spin' : 'fa-user-plus'} mr-2`}></i>建立新的共編連結</button>

                                <>
                                    <section>
                                        <div className="flex items-center justify-between mb-3"><h4 className="font-black text-slate-800">專案成員</h4><span className="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">{members.length} 人</span></div>
                                        <div className="space-y-2">
                                            {members.map(member => {
                                                const isOwner = member.role === 'owner' || member.id === project.ownerId;
                                                return <div key={member.id} className="rounded-xl border border-slate-100 bg-slate-50 p-3 flex items-center gap-3"><div className={`w-9 h-9 rounded-full flex items-center justify-center ${isOwner ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-600'}`}><i className={`fa-solid ${isOwner ? 'fa-crown' : 'fa-user'}`}></i></div><div className="min-w-0 flex-1"><p className="font-bold text-sm truncate">{member.displayName || member.email || '未命名成員'} {member.id === user.uid && <span className="text-teal-600 text-[10px]">（你）</span>}</p><p className="text-[11px] text-slate-400 truncate">{member.email || (isOwner ? '專案擁有者' : 'Google 帳號')}</p></div>{isOwner ? <span className="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-full">擁有者</span> : <button onClick={() => removeMember(member)} disabled={busyKey === `member-${member.id}`} className="px-3 py-2 rounded-lg bg-red-50 text-red-500 text-xs font-bold disabled:opacity-40">移除</button>}</div>;
                                            })}
                                        </div>
                                    </section>

                                    <section>
                                        <div className="flex items-center justify-between mb-3"><h4 className="font-black text-slate-800">有效邀請連結</h4><span className="text-xs bg-teal-50 text-teal-600 px-2 py-1 rounded-full">{activeInvites.length} 組</span></div>
                                        <div className="space-y-2">
                                            {activeInvites.length === 0 && <div className="rounded-xl border border-dashed border-slate-200 p-5 text-center text-xs text-slate-400">目前沒有可用的邀請連結</div>}
                                            {activeInvites.map(invite => <div key={invite.id} className="rounded-xl border border-teal-100 bg-teal-50 p-3 flex items-center gap-3"><div className="w-9 h-9 rounded-full bg-white text-teal-600 flex items-center justify-center"><i className="fa-solid fa-link"></i></div><div className="min-w-0 flex-1"><p className="font-bold text-sm">邀請碼 …{invite.id.slice(-8)}</p><p className="text-[11px] text-slate-400">建立於 {formatDateTime(invite.createdAt)}</p></div><button onClick={() => revokeInvite(invite)} disabled={busyKey === `invite-${invite.id}`} className="px-3 py-2 rounded-lg bg-white text-red-500 text-xs font-bold disabled:opacity-40">撤銷</button></div>)}
                                        </div>
                                    </section>

                                    {inactiveInvites.length > 0 && <details className="rounded-xl border border-slate-100 bg-slate-50 p-3"><summary className="cursor-pointer text-xs font-bold text-slate-500">查看已失效邀請（{inactiveInvites.length}）</summary><div className="mt-3 space-y-2">{inactiveInvites.map(invite => <div key={invite.id} className="flex items-center justify-between text-xs text-slate-400"><span>…{invite.id.slice(-8)}</span><span>{invite.status === 'revoked' ? '已撤銷' : '已使用／失效'}</span></div>)}</div></details>}
                                </>
                            )}
                            <div className="rounded-xl bg-amber-50 border border-amber-100 p-3 text-xs text-amber-800 leading-relaxed"><i className="fa-solid fa-circle-info mr-1"></i>撤銷邀請只會阻止新成員加入；若要停止既有成員存取，請在「專案成員」中將他移除。</div>
                        </div>
                    </div>
                </div>

            const handleSave = () => { onUpdate(localPeople); onNext(); };

            const handleAvatarClick = (id, isMaster) => {
                if (selectedId === null) {

                    setSelectedId(id);
                } else {
                    if (selectedId === id) { setSelectedId(null); return; }
                    handleBind(selectedId, id);
                    setSelectedId(null);
                }
            };

            const wallets = localPeople.filter(p => !p.payerId || p.payerId === p.id).map(master => ({

                                <div key={w.master.id} onClick={() => handleAvatarClick(w.master.id, true)} className={`relative p-4 rounded-2xl border-2 transition-all flex flex-col items-center justify-center min-h-[140px] ${selectedId === w.master.id ? 'border-teal-500 bg-teal-50 ring-2 ring-teal-200 scale-105 z-10' : 'border-slate-200 bg-white hover:border-teal-300'} ${selectedId !== null && selectedId !== w.master.id ? 'animate-pulse cursor-pointer border-dashed border-teal-400' : ''}`}>
                                    <div className="w-16 h-16 rounded-full bg-gradient-to-br from-orange-100 to-amber-100 flex items-center justify-center text-2xl font-bold text-orange-600 shadow-sm mb-2">{masterName[0]}</div>
                                    <span className="font-bold text-slate-700 truncate max-w-full">{masterName}</span>
                                    {w.children.length > 0 && <span className="text-xs text-slate-400">錢包主</span>}
                                    {w.children.length > 0 && (
                                        <div className="mt-3 flex flex-wrap justify-center gap-2 bg-slate-50 w-full p-2 rounded-xl border border-slate-100">
                                            {w.children.map(child => {

                                                return (
                                                    <div key={child.id} onClick={(e) => { e.stopPropagation(); handleUnbind(child.id); }} className="flex items-center gap-1 bg-white px-2 py-1 rounded-full shadow-sm text-xs text-slate-600 border border-slate-200 cursor-pointer hover:bg-red-50 hover:text-red-500 hover:border-red-200">
                                                        <div className="w-4 h-4 rounded-full bg-slate-200 flex items-center justify-center text-[8px]">{childName[0]}</div>{childName}<i className="fa-solid fa-xmark ml-1 opacity-50"></i>
                                                    </div>

                                </div>
                            );

                    <div className="mt-auto pt-4 flex gap-4">

                    </div>
                </div>

        };

        const SplashScreen = ({ fadeOut }) => (
            <div className={`intro-surface fixed inset-0 z-50 flex items-center justify-center overflow-y-auto transition-opacity duration-500 ${fadeOut ? 'opacity-0 pointer-events-none' : 'opacity-100'}`} role="status" aria-label="正在載入 A.A 2GETHER">
                <div className="brand-stage">
                    <img className="brand-scene brand-scene-enter" src="./assets/brand/colorful-cards-scene.webp" alt="" fetchPriority="high" />

                    <p className="brand-descriptor">聚餐・旅遊・共同分帳</p>
                    <div className="brand-loading" aria-hidden="true"><i className="fa-solid fa-circle"></i><i className="fa-solid fa-circle"></i><i className="fa-solid fa-circle"></i></div>

        const LoginScreen = ({ onLogin, isLoggingIn, error, hasInvite }) => (
            <div className="intro-surface min-h-screen px-6 py-10 flex items-center justify-center">
                <div className="brand-login-layout">

                <div className="brand-login-card text-center">
                    <h1 className="brand-login-logo"><img src="./assets/brand/aa-2gether-logo.webp" className="brand-logo" alt="A.A 2GETHER" /></h1>
                    <p className="brand-login-tagline">數學不好，錢算得清楚就好</p>

                    {hasInvite && <div className="mt-4 p-3 bg-amber-50 text-amber-700 rounded-xl text-sm font-bold"><i className="fa-solid fa-envelope-open-text mr-2"></i>登入後就會加入朋友的共編專案</div>}

                    <button onClick={onLogin} disabled={isLoggingIn} className="w-full mt-6 p-4 rounded-xl border brand-login-button font-bold flex items-center justify-center gap-3 disabled:opacity-60">

                    <p className="mt-3 text-xs text-blue-800 bg-blue-50 rounded-xl p-3"><i className="fa-solid fa-window-restore mr-2"></i>將開啟 Google 安全登入視窗；若視窗未出現，請改用外部 Chrome／Safari。</p>
                    <p className="mt-5 text-xs text-slate-400 leading-relaxed">Google 登入只用來辨認「哪些專案屬於你」。我們不會取得你的 Google 密碼。</p>
                    <div className="mt-3"><VersionBadge /></div>
                </div>
                </div>
            </div>
        );

        const ProjectList = ({ projects, onSelect, onCreate, onRemove, isLoading, warning }) => (
            <div className="aa-home p-6 animate-fade-in pb-24">
                <div className="mb-6">

                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">我的記帳本 <span className="relative flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-teal-500"></span></span></h2>
                        <p className="text-slate-500 text-sm">你建立的，以及朋友分享給你的專案</p>

                {isLoading ? (

                                        <div>

            return (
                <div className="aa-create p-6 h-full flex flex-col animate-slide-up">

        };


        const receiptItemName = item => item.quantity > 1 ? `${item.name} ×${item.quantity}` : item.name;
        let receiptItemsRuntimePromise = null;
        const loadReceiptItemsRuntime = () => {
            if (window.Tesseract?.createWorker) return Promise.resolve(window.Tesseract);
            if (receiptItemsRuntimePromise) return receiptItemsRuntimePromise;
            receiptItemsRuntimePromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
                script.crossOrigin = 'anonymous';
                const timer = window.setTimeout(() => { script.remove(); reject(new Error('辨識元件下載逾時，請確認網路後重試。')); }, 25000);
                script.onload = () => { window.clearTimeout(timer); if (window.Tesseract?.createWorker) resolve(window.Tesseract); else reject(new Error('辨識元件未正確載入。')); };
                script.onerror = () => { window.clearTimeout(timer); script.remove(); reject(new Error('無法下載辨識元件，請確認公司網路是否允許 jsDelivr。')); };
                document.head.appendChild(script);
            }).catch(error => { receiptItemsRuntimePromise = null; throw error; });
            return receiptItemsRuntimePromise;
        };

        const ReceiptItemsModal = ({ onClose, onApply }) => {
            const cameraRef = useRef(null), galleryRef = useRef(null), workerRef = useRef(null);
            const liveRef = useRef(true), runRef = useRef(0), appliedRef = useRef(false);
            const [text, setText] = useState(''), [raw, setRaw] = useState('');
            const [busy, setBusy] = useState(false), [progress, setProgress] = useState(''), [error, setError] = useState('');
            const [language, setLanguage] = useState('chi_tra'), [adjustments, setAdjustments] = useState([]), [receiptTotal, setReceiptTotal] = useState(null);
            useEffect(() => () => { liveRef.current = false; runRef.current += 1; workerRef.current?.terminate().catch(() => {}); }, []);
            const parsed = window.SplitEasyReceiptItems?.parse(text) || { items: [], unresolved: [], ignored: [], total: null };
            const items = parsed.items.filter(item => item.kind === 'item' && item.amount > 0);
            const detectedAdjustments = [...adjustments, ...parsed.items.filter(item => item.kind !== 'item')].filter((item, index, all) => all.findIndex(other => other.name === item.name && other.amount === item.amount) === index);
            const subtotal = items.reduce((sum, item) => sum + item.amount, 0);
            const billTotal = parsed.total ?? receiptTotal;
            const organize = (input, newPhoto = false) => {
                const result = window.SplitEasyReceiptItems.parse(input);
                const detected = result.items.filter(item => item.kind !== 'item');
                setAdjustments(current => newPhoto || detected.length ? detected : current);
                setReceiptTotal(current => newPhoto ? result.total : result.total ?? current);
                const rows = String(input).split(/\r?\n/).flatMap(line => {
                    const item = result.items.find(candidate => candidate.rawLine === line);
                    if (item) return item.kind === 'item' && item.amount > 0 ? [receiptItemName(item) + '  ' + item.amount] : [];
                    return result.unresolved.includes(line) ? [line] : [];
                });
                setText(rows.join('\n'));
            };
            const handleFile = async event => {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;
                const run = ++runRef.current;
                const active = () => liveRef.current && run === runRef.current;
                setBusy(true); setError(''); setProgress('準備照片與下載辨識元件');
                let worker;
                try {
                    const image = await window.SplitEasyReceiptOcr.preprocessImage(file);
                    const Tesseract = await loadReceiptItemsRuntime();
                    if (!active()) return;
                    worker = await Tesseract.createWorker(language === 'eng' ? ['eng'] : ['chi_tra', 'eng'], 1, {
                        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
                        corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
                        workerBlobURL: true,
                        logger: message => {
                            if (!active()) return;
                            const label = message.status === 'recognizing text' ? '辨識帳單文字' : message.status === 'loading language traineddata' ? '下載語言字庫' : '準備辨識';
                            setProgress(`${label} ${Math.round((message.progress || 0) * 100)}%`);
                        }
                    });
                    workerRef.current = worker;
                    if (!active()) return;
                    await worker.setParameters({ preserve_interword_spaces: '1' });
                    const result = await worker.recognize(image.dataUrl);
                    if (!active()) return;
                    setRaw(result.data.text);
                    organize(result.data.text, true);
                    if (!result.data.text.trim()) setError('沒有讀到文字，請換一張清楚、平整且沒有反光的照片。');
                } catch (problem) {
                    if (active()) setError(`辨識未完成：${problem.message || '請重試。'} 可重新選圖，或在預覽框直接輸入品項。`);
                } finally {
                    if (worker) await worker.terminate().catch(() => {});
                    if (workerRef.current === worker) workerRef.current = null;
                    if (active()) { setBusy(false); setProgress(''); }
                }
            };
            const apply = () => {
                if (appliedRef.current || busy || !items.length || parsed.unresolved.length) return;
                appliedRef.current = true;
                if (onApply(items) === false) { appliedRef.current = false; return; }
                onClose();

            return <div role="dialog" aria-modal="true" aria-labelledby="receipt-items-title" className="fixed inset-0 bg-black/60 z-[9998] flex items-end sm:items-center justify-center sm:p-4">
                <div className="aa-receipt-modal bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto">
                    <div className="sticky top-0 bg-white z-10 border-b border-slate-100 px-5 py-4 flex items-center justify-between gap-3">

                    </div>
                    <div className="p-5 space-y-4">
                        <p className="text-xs text-slate-500 leading-relaxed">拍照後會依品項分行。先修正內容再匯入，誰該負擔留在原頁設定。照片只在這台裝置辨識；首次使用需連網下載元件與字庫。</p>
                        <label className="block text-xs text-slate-500">辨識語言<select value={language} disabled={busy} onChange={event => setLanguage(event.target.value)} className="block w-full mt-1 p-3 bg-slate-50 border rounded-xl"><option value="chi_tra">繁體中文＋英文</option><option value="eng">英文</option></select></label>
                        <div className="grid grid-cols-2 gap-3">
                            <button type="button" disabled={busy} onClick={() => cameraRef.current?.click()} className="p-3 rounded-xl bg-teal-600 text-white font-bold disabled:opacity-40">拍照辨識</button>
                            <button type="button" disabled={busy} onClick={() => galleryRef.current?.click()} className="p-3 rounded-xl border border-teal-300 text-teal-700 font-bold disabled:opacity-40">從相簿選取</button>
                        </div>
                        <input ref={cameraRef} data-testid="receipt-camera" type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
                        <input ref={galleryRef} data-testid="receipt-gallery" type="file" accept="image/*" onChange={handleFile} className="hidden" />
                        {busy && <p role="status" className="text-sm font-bold text-teal-700">{progress}，請稍候…</p>}
                        {error && <p role="alert" className="rounded-xl bg-red-50 p-3 text-xs text-red-700 whitespace-pre-wrap">{error}</p>}
                        <div>
                            <label htmlFor="receipt-items-text" className="block text-sm font-bold mb-2">品項預覽（可直接修改）</label>
                            <textarea id="receipt-items-text" rows="8" value={text} disabled={busy} onChange={event => applyInputValue(event, setText)} placeholder={'牛肉麵 ×2 300\n鮭魚丼飯 220'} className="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm leading-relaxed" />
                            <div className="flex justify-between items-start gap-3 mt-2">
                                <p className="text-[11px] text-slate-500">格式：品項名稱 ×數量 小計。數量與小計之間請留空白，例如「牛肉麵 ×2 300」，代表 2 碗合計 300 元。</p>
                                <button type="button" disabled={busy || !text.trim()} onClick={() => organize(text)} className="shrink-0 text-xs text-teal-700 font-bold disabled:opacity-40">整理分行</button>
                            </div>
                        </div>
                        {parsed.unresolved.length > 0 && <p role="alert" className="rounded-xl bg-amber-50 p-3 text-xs text-amber-800">有 {parsed.unresolved.length} 行尚無法辨識。請在預覽框修正或刪除非品項文字，再確認匯入。</p>}
                        {detectedAdjustments.length > 0 && <div className="rounded-xl bg-amber-50 p-3 text-xs text-amber-800 leading-relaxed"><b>以下不列入本次品項匯入，請回原頁另行處理：</b>{detectedAdjustments.map((item, index) => <p key={index}>{item.name}　{formatMoney(item.amount)}</p>)}</div>}
                        <div className="rounded-xl bg-teal-50 p-3 space-y-1 text-sm">
                            <div className="flex justify-between gap-3 font-bold text-teal-800"><span>將新增 {items.length} 筆品項</span><span>{formatMoney(subtotal)}</span></div>
                            <p className="text-[11px] text-teal-700">未含服務費與折扣；匯入後請核對原頁設定。</p>
                            {billTotal != null && <p className="text-[11px] text-slate-500">辨識到帳單總額 {formatMoney(billTotal)}，供你核對。</p>}
                        </div>
                        {raw && <details className="text-xs text-slate-500"><summary className="cursor-pointer">查看原始辨識文字</summary><pre className="mt-2 whitespace-pre-wrap break-words bg-slate-50 p-3 rounded-xl">{raw}</pre></details>}
                        <button type="button" onClick={apply} disabled={busy || !items.length || parsed.unresolved.length > 0} className="w-full p-4 rounded-xl bg-teal-600 text-white font-bold disabled:opacity-40">確認並匯入品項</button>
                    </div>
                </div>
            </div>;
        };

        const TaiwanInvoiceScannerModal = ({ people, onClose, onApply, showMessage, applyLabel = '確認並匯入混合分攤' }) => {
            const cameraInputRef = useRef(null);
            const galleryInputRef = useRef(null);
            const singleQrCameraInputRef = useRef(null);
            const singleQrGalleryInputRef = useRef(null);
            const [rawCodes, setRawCodes] = useState([]);
            const [parsed, setParsed] = useState(null);
            const [editableItems, setEditableItems] = useState([]);
            const [isScanning, setIsScanning] = useState(false);
            const [scanProgress, setScanProgress] = useState(null);
            const [scanNotice, setScanNotice] = useState('');
            const [needsCloseup, setNeedsCloseup] = useState(false);

            const prepareEditableItems = (result) => {
                if (result.status !== 'ready') {
                    setEditableItems([]);
                    return;
                }
                const participantIds = people.map(person => person.id);
                let nextItems = (result.items || []).map((item, index) => ({
                    id: `invoice-${Date.now()}-${index}`,
                    name: item.name,
                    amount: String(Math.round(item.amount * 100) / 100),
                    participantIds: [...participantIds]
                }));
                const itemTotal = nextItems.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                const invoiceTotal = result.invoice?.totalAmount || 0;
                const difference = Math.round((invoiceTotal - itemTotal) * 100) / 100;
                if (nextItems.length === 0 && invoiceTotal > 0) {
                    nextItems = [{ id: `invoice-total-${Date.now()}`, name: '電子發票總額', amount: String(invoiceTotal), participantIds: [...participantIds] }];
                } else if (invoiceTotal > 0 && Math.abs(difference) >= 0.01) {
                    nextItems.push({ id: `invoice-adjustment-${Date.now()}`, name: difference < 0 ? '發票折扣／差額' : '發票稅額／差額', amount: String(difference), participantIds: [...participantIds] });
                }
                setEditableItems(nextItems);
            };

            const consumeCodes = (codes) => {
                const uniqueCodes = [...new Set(codes.map(code => String(code || '').trim()).filter(Boolean))];
                const result = parseTaiwanInvoiceQrCodes(uniqueCodes);
                setRawCodes(uniqueCodes);
                setParsed(result);
                prepareEditableItems(result);
                return result;
            };

            const handleFile = async (event, scanMode = 'receipt') => {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;
                if (!window.SplitEasyInvoiceImageScanner || !window.jsQR) return showMessage({ title: '掃描元件未載入', message: '請確認網路連線後重新開啟頁面。發票照片不會上傳。' });
                setIsScanning(true);
                setNeedsCloseup(false);
                setScanNotice('');
                try {
                    const scanResult = await window.SplitEasyInvoiceImageScanner.scanFile(file, {
                        mode: scanMode,
                        onProgress: progress => setScanProgress(progress)
                    });
                    if (!scanResult.codes.length) {
                        setNeedsCloseup(true);
                        setScanNotice('照片已直接從原圖分區放大、加強對比並嘗試方向修正，仍未找到 QR。請補拍較清楚的 QR 特寫。');
                        return;
                    }

                    const combinedCodes = [...new Set([...rawCodes, ...scanResult.codes])];
                    const parseResult = consumeCodes(combinedCodes);
                    const codeTypes = combinedCodes.map(code => window.SplitEasyInvoiceImageScanner.classifyCode(code));
                    const foundLeft = codeTypes.includes('left');
                    const foundRight = codeTypes.includes('right');
                    const foundPair = foundLeft && foundRight;
                    setNeedsCloseup(!foundPair && parseResult.status !== 'ready');
                    if (foundPair) {
                        setScanNotice('左右 QR 都已自動辨識完成，請核對下方品項與總額。');
                    } else if (foundLeft) {
                        setScanNotice(parseResult.status === 'ready' ? '已讀到左方 QR 的基本資料，但右方品項可能不完整；請只拍右方 QR 特寫，讓 QR 約佔畫面寬度 1/3～1/2 並保留四周空白。' : '已讀到左方 QR，請補拍右方 QR 特寫。');
                    } else if (foundRight) {
                        setScanNotice('已讀到右方 QR，請補拍左方 QR 特寫。');
                    } else {
                        setNeedsCloseup(true);
                        setScanNotice('照片中找到其他 QR，但不是有效的臺灣電子發票左方 QR。');
                    }
                } catch (error) {
                    console.warn('QR 掃描失敗：', error);
                    setNeedsCloseup(true);
                    setScanNotice(error?.message || '照片無法解析，請重新拍攝。');
                } finally {
                    setIsScanning(false);
                    setScanProgress(null);
                }
            };

            const updateEditableItem = (id, patch) => setEditableItems(items => items.map(item => item.id === id ? { ...item, ...patch } : item));
            const removeEditableItem = (id) => setEditableItems(items => items.filter(item => item.id !== id));
            const addEditableItem = () => setEditableItems(items => [...items, { id: `invoice-manual-${Date.now()}`, name: '', amount: '', participantIds: people.map(person => person.id) }]);
            const currentTotal = editableItems.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
            const scannedTypes = rawCodes.map(code => window.SplitEasyInvoiceImageScanner?.classifyCode(code));
            const hasLeftQr = scannedTypes.includes('left');
            const hasRightQr = scannedTypes.includes('right');

            const handleApply = () => {
                const items = editableItems.filter(item => item.name.trim() && Number.isFinite(parseFloat(item.amount)) && parseFloat(item.amount) !== 0);
                if (!parsed?.invoice || !items.length) return showMessage({ message: '請先讀取發票並保留至少一筆有效品項。' });
                onApply({

                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-[9998] flex items-end sm:items-center justify-center sm:p-4 animate-fade-in">
                    <div className="aa-receipt-modal bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto shadow-2xl">
                        <div className="sticky top-0 bg-white z-10 px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                            <div><h3 className="font-black text-lg">掃描臺灣電子發票</h3><p className="text-xs text-slate-400">拍一張完整發票，自動尋找左右 QR</p></div>
                            <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 text-slate-500"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="p-5 space-y-5">
                            <div className="rounded-2xl bg-teal-50 border border-teal-100 p-4">
                                <p className="font-bold text-teal-800 text-sm"><i className="fa-solid fa-receipt mr-2"></i>整張發票一次拍</p>
                                <p className="text-xs text-teal-700 mt-1">把發票攤平，讓左右 QR 都完整入鏡、對焦清楚並避開反光；照片只會留在這支手機內辨識。</p>
                                <div className="grid grid-cols-2 gap-3 mt-3">
                                    <button onClick={() => cameraInputRef.current?.click()} disabled={isScanning} className="bg-teal-600 disabled:opacity-50 text-white p-3 rounded-xl font-bold shadow-sm">
                                        <i className="fa-solid fa-camera mr-2"></i>拍照辨識
                                    </button>
                                    <button onClick={() => galleryInputRef.current?.click()} disabled={isScanning} className="bg-white border border-teal-300 disabled:opacity-50 text-teal-700 p-3 rounded-xl font-bold shadow-sm">
                                        <i className="fa-solid fa-images mr-2"></i>從相簿選取
                                    </button>
                                </div>
                                <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={event => handleFile(event, 'receipt')} className="hidden" />
                                <input ref={galleryInputRef} type="file" accept="image/*" onChange={event => handleFile(event, 'receipt')} className="hidden" />
                                {isScanning && scanProgress && <div className="mt-3"><div className="h-2 bg-teal-100 rounded-full overflow-hidden"><div className="h-full bg-teal-500 transition-all" style={{ width: `${Math.round(scanProgress.current / scanProgress.total * 100)}%` }}></div></div><p className="mt-1 text-[11px] text-teal-700">正在檢查：{scanProgress.label}</p></div>}
                            </div>

                            {(scanNotice || rawCodes.length > 0) && <div className={`rounded-xl border p-3 ${hasLeftQr && hasRightQr ? 'bg-emerald-50 border-emerald-100 text-emerald-800' : 'bg-amber-50 border-amber-100 text-amber-800'}`}><div className="flex gap-2 mb-2"><span className={`px-2 py-1 rounded-full text-[11px] font-bold ${hasLeftQr ? 'bg-emerald-100 text-emerald-700' : 'bg-white/70 text-slate-400'}`}>{hasLeftQr ? '✓ 左方 QR' : '○ 左方 QR'}</span><span className={`px-2 py-1 rounded-full text-[11px] font-bold ${hasRightQr ? 'bg-emerald-100 text-emerald-700' : 'bg-white/70 text-slate-400'}`}>{hasRightQr ? '✓ 右方 QR' : '○ 右方 QR'}</span></div>{scanNotice && <p className="text-xs leading-relaxed">{scanNotice}</p>}</div>}

                            {(needsCloseup || (rawCodes.length > 0 && !hasRightQr)) && <div className="rounded-xl border border-slate-200 p-3"><p className="text-xs font-bold text-slate-700">需要補拍時</p><p className="text-xs text-slate-500 mt-1">只把尚未讀到的單一 QR 放大拍清楚，不需要輸入看不懂的 QR 原始文字。</p><div className="grid grid-cols-2 gap-3 mt-3"><button onClick={() => singleQrCameraInputRef.current?.click()} disabled={isScanning} className="p-3 rounded-xl bg-slate-800 disabled:opacity-50 text-white text-sm font-bold"><i className="fa-solid fa-camera mr-2"></i>拍攝 QR 特寫</button><button onClick={() => singleQrGalleryInputRef.current?.click()} disabled={isScanning} className="p-3 rounded-xl border border-slate-300 bg-white disabled:opacity-50 text-slate-700 text-sm font-bold"><i className="fa-solid fa-images mr-2"></i>從相簿選 QR</button></div><input ref={singleQrCameraInputRef} type="file" accept="image/*" capture="environment" onChange={event => handleFile(event, 'closeup')} className="hidden" /><input ref={singleQrGalleryInputRef} type="file" accept="image/*" onChange={event => handleFile(event, 'closeup')} className="hidden" /></div>}

                            {parsed && (
                                <div className={`rounded-2xl border p-4 ${parsed.status === 'ready' ? 'bg-white border-slate-200' : 'bg-amber-50 border-amber-200'}`}>
                                    <p className={`text-sm font-bold ${parsed.status === 'ready' ? 'text-slate-800' : 'text-amber-800'}`}>{parsed.message}</p>
                                    {parsed.status === 'ready' && <div className="grid grid-cols-2 gap-3 mt-3 text-xs"><div><span className="text-slate-400">發票號碼</span><p className="font-bold">{parsed.invoice.invoiceNumber}</p></div><div><span className="text-slate-400">日期</span><p className="font-bold">{parsed.invoice.date || '未提供'}</p></div><div><span className="text-slate-400">發票總額</span><p className="font-bold text-teal-700">{formatMoney(parsed.invoice.totalAmount)}</p></div><div><span className="text-slate-400">賣方統編</span><p className="font-bold">{parsed.invoice.sellerId}</p></div></div>}
                                </div>
                            )}

                            {parsed?.status === 'ready' && (
                                <div className="space-y-3">
                                    <div className="flex items-end justify-between"><div><h4 className="font-bold">確認匯入品項</h4><p className="text-xs text-slate-400">名稱與金額都可以修改</p></div><span className="text-sm font-black text-teal-700">{formatMoney(currentTotal)}</span></div>
                                    {editableItems.map((item, index) => <div key={item.id} className="grid grid-cols-[1fr_100px_32px] gap-2 items-center"><input value={item.name} onChange={event => applyInputValue(event, value => updateEditableItem(item.id, { name: value }))} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm" placeholder={`品項 ${index + 1}`} /><input type="number" value={item.amount} onChange={event => updateEditableItem(item.id, { amount: event.target.value })} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-right" placeholder="金額" /><button onClick={() => removeEditableItem(item.id)} className="text-slate-300 hover:text-red-500"><i className="fa-solid fa-trash"></i></button></div>)}
                                    <button onClick={addEditableItem} className="w-full p-3 rounded-xl border-2 border-dashed border-slate-200 text-slate-500 text-sm font-bold"><i className="fa-solid fa-plus mr-2"></i>補一筆品項</button>
                                </div>
                            )}

                            <div className="rounded-xl bg-amber-50 border border-amber-100 p-3 text-xs text-amber-800"><i className="fa-solid fa-triangle-exclamation mr-1"></i>本功能只解析發票 QR 內容，不會向財政部查驗真偽；匯入前請核對紙本總額。發票照片不會儲存或上傳。</div>
                            <button onClick={handleApply} disabled={parsed?.status !== 'ready' || editableItems.length === 0} className="w-full p-4 rounded-xl bg-orange-500 disabled:opacity-40 text-white font-black shadow-lg">{applyLabel}</button>
                        </div>
                    </div>
                </div>
            );
        };

        let tesseractLoaderPromise = null;
        const loadTesseractRuntime = () => {
            if (window.Tesseract) return Promise.resolve(window.Tesseract);
            if (tesseractLoaderPromise) return tesseractLoaderPromise;
            tesseractLoaderPromise = new Promise((resolve, reject) => {
                const existingScript = document.getElementById('split-easy-tesseract');
                const script = existingScript || document.createElement('script');
                const handleLoaded = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('OCR 元件載入失敗'));
                script.addEventListener('load', handleLoaded, { once: true });
                script.addEventListener('error', () => reject(new Error('無法載入本機 OCR 元件，請確認網路後重試。')), { once: true });
                if (!existingScript) {
                    script.id = 'split-easy-tesseract';
                    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                    script.crossOrigin = 'anonymous';
                    document.head.appendChild(script);
                }
            }).catch(error => {
                tesseractLoaderPromise = null;
                throw error;
            });
            return tesseractLoaderPromise;
        };

        const TravelReceiptCaptureModal = ({ people, defaultDay, onClose, onCreateDraft, showMessage }) => {
            const cameraInputRef = useRef(null);
            const galleryInputRef = useRef(null);
            const workerRef = useRef(null);
            const [mode, setMode] = useState(null);
            const [language, setLanguage] = useState('eng');
            const [processedImage, setProcessedImage] = useState(null);
            const [isReading, setIsReading] = useState(false);
            const [progress, setProgress] = useState({ status: '', value: 0 });
            const [ocrResult, setOcrResult] = useState(null);
            const [merchant, setMerchant] = useState('');
            const [receiptDate, setReceiptDate] = useState('');
            const [originalAmount, setOriginalAmount] = useState('');
            const [currency, setCurrency] = useState('USD');
            const [exchangeRate, setExchangeRate] = useState('');

            useEffect(() => () => {
                if (workerRef.current) workerRef.current.terminate().catch(() => {});
            }, []);

            const preferredCurrencyForLanguage = value => value.startsWith('jpn') ? 'JPY' : value.startsWith('kor') ? 'KRW' : value.startsWith('chi') ? 'TWD' : 'USD';

            const fillParsedFields = (parsed) => {
                setOcrResult(parsed);
                setMerchant(parsed.merchant || '海外收據');
                setReceiptDate(parsed.date || '');
                setOriginalAmount(parsed.amount ? String(parsed.amount) : '');
                setCurrency(parsed.currency || preferredCurrencyForLanguage(language));
                setExchangeRate(parsed.currency === 'TWD' ? '1' : '');
            };

            const recognizeImage = async (imageDataUrl, selectedLanguage = language) => {
                if (!imageDataUrl) return;
                setIsReading(true);
                setProgress({ status: '正在載入離線辨識元件', value: 0 });
                try {
                    if (!window.SplitEasyReceiptOcr) throw new Error('收據解析元件未載入，請重新整理頁面。');
                    const Tesseract = await loadTesseractRuntime();
                    const worker = await Tesseract.createWorker(selectedLanguage, undefined, {
                        logger: message => {
                            const labels = {
                                'loading tesseract core': '載入文字辨識核心',
                                'initializing tesseract': '初始化文字辨識',
                                'loading language traineddata': '載入語言資料',
                                'initializing api': '準備辨識',
                                'recognizing text': '辨識收據文字'
                            };
                            setProgress({ status: labels[message.status] || '處理收據影像', value: message.progress || 0 });
                        }
                    });
                    workerRef.current = worker;
                    await worker.setParameters({ preserve_interword_spaces: '1' });
                    const result = await worker.recognize(imageDataUrl);
                    await worker.terminate();
                    workerRef.current = null;
                    const parsed = window.SplitEasyReceiptOcr.parseText(result.data.text, {
                        preferredCurrency: preferredCurrencyForLanguage(selectedLanguage)
                    });
                    fillParsedFields(parsed);
                    if (!parsed.amount) {
                        showMessage({ title: '沒有可靠讀到總額', message: '你仍可直接在欄位中填入店名、幣別與金額，再繼續記帳。' });
                    }
                } catch (error) {
                    console.error('Receipt OCR error:', error);
                    setOcrResult({ amountConfident: false, currencyAmbiguous: true, dateAmbiguous: false, amountSourceLine: '' });
                    showMessage({ title: '自動辨識未完成', message: `${error.message || '這張照片無法辨識。'}\n你仍可手動填寫下方資料，照片不會上傳。` });
                } finally {
                    setIsReading(false);
                    setProgress({ status: '', value: 0 });
                }
            };

            const handleFile = async event => {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;
                setOcrResult(null);
                try {
                    const prepared = await window.SplitEasyReceiptOcr.preprocessImage(file);
                    setProcessedImage(prepared);
                    await recognizeImage(prepared.dataUrl, language);
                } catch (error) {
                    console.error('Receipt image error:', error);
                    showMessage({ title: '照片讀取失敗', message: error.message || '請改用 JPG 或 PNG 相片再試。' });
                }
            };

            const handleTaiwanInvoice = ({ items, invoice }) => {
                const total = invoice.totalAmount || items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                onCreateDraft({
                    desc: `電子發票 ${invoice.invoiceNumber || ''}`.trim(),
                    amount: total,
                    day: defaultDay,
                    receiptMeta: {
                        source: 'taiwan-einvoice',
                        invoiceNumber: invoice.invoiceNumber || '',
                        receiptDate: invoice.date || '',
                        currency: 'TWD',
                        originalAmount: total,
                        exchangeRate: 1,
                        importedAt: new Date().toISOString()
                    }
                });
            };

            const handleCurrencyChange = nextCurrency => {
                setCurrency(nextCurrency);
                if (nextCurrency === 'TWD') setExchangeRate('1');
                else if (currency === 'TWD' && exchangeRate === '1') setExchangeRate('');
            };

            const convertedAmount = (parseFloat(originalAmount) || 0) * (parseFloat(exchangeRate) || 0);
            const handleApplyOverseas = () => {
                const original = parseFloat(originalAmount);
                const rate = parseFloat(exchangeRate);
                if (!Number.isFinite(original) || original <= 0) return showMessage({ message: '請確認收據的原幣總額。' });
                if (!Number.isFinite(rate) || rate <= 0) return showMessage({ message: '請填寫換算匯率，例如 1 日圓等於多少新臺幣。' });
                const twdAmount = Math.round(original * rate * 100) / 100;
                onCreateDraft({
                    desc: merchant.trim() || '海外收據',
                    amount: twdAmount,
                    day: defaultDay,
                    receiptMeta: {
                        source: 'local-ocr',
                        merchant: merchant.trim() || '海外收據',
                        receiptDate,
                        currency,
                        originalAmount: original,
                        exchangeRate: rate,
                        importedAt: new Date().toISOString()
                    }
                });
            };

            if (mode === 'taiwan') {
                return <TaiwanInvoiceScannerModal people={people} onClose={() => setMode(null)} onApply={handleTaiwanInvoice} showMessage={showMessage} applyLabel="使用這張發票繼續記帳" />;
            }

            return (
                <div className="fixed inset-0 bg-black/60 z-[9998] flex items-end sm:items-center justify-center sm:p-4 animate-fade-in">
                    <div className="aa-receipt-modal bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto shadow-2xl">
                        <div className="sticky top-0 bg-white z-10 px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                            <div><h3 className="font-black text-lg">拍收據建立旅遊支出</h3><p className="text-xs text-slate-400">照片只在這台裝置處理，不會上傳</p></div>
                            <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 text-slate-500"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        {!mode ? (
                            <div className="p-5 space-y-4">
                                <button onClick={() => setMode('taiwan')} className="w-full p-5 rounded-2xl border-2 border-teal-100 bg-teal-50 text-left hover:border-teal-300">
                                    <div className="flex items-center gap-3"><span className="w-11 h-11 rounded-full bg-teal-600 text-white flex items-center justify-center"><i className="fa-solid fa-qrcode"></i></span><div><p className="font-black text-slate-800">臺灣電子發票</p><p className="text-xs text-slate-500 mt-1">讀取左右 QR，適合臺灣消費</p></div></div>
                                </button>
                                <button onClick={() => setMode('overseas')} className="w-full p-5 rounded-2xl border-2 border-blue-100 bg-blue-50 text-left hover:border-blue-300">
                                    <div className="flex items-center gap-3"><span className="w-11 h-11 rounded-full bg-blue-600 text-white flex items-center justify-center"><i className="fa-solid fa-earth-asia"></i></span><div><p className="font-black text-slate-800">海外一般收據</p><p className="text-xs text-slate-500 mt-1">英文、日文、韓文、繁中，本機 OCR 辨識</p></div></div>
                                </button>
                                <div className="rounded-xl bg-slate-50 border border-slate-100 p-3 text-xs text-slate-500 leading-relaxed"><i className="fa-solid fa-shield-halved text-teal-600 mr-1"></i>不需要 Gemini 或個人 API Key。第一次使用某個語言時會下載辨識字庫，但收據照片與辨識文字不會送到 Firebase。</div>
                            </div>
                        ) : (
                            <div className="p-5 space-y-5">
                                <button onClick={() => setMode(null)} className="text-sm font-bold text-slate-500"><i className="fa-solid fa-arrow-left mr-2"></i>改選收據類型</button>
                                <div>
