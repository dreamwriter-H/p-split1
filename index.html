                                <div className="flex justify-between items-center mb-2"><label className="text-xs text-slate-500 font-bold block">分攤給？ <span className="text-teal-600 font-normal">{isAllSplit ? '(預設：全員均攤)' : `(指定 ${activeSplitCount} 人)`}</span></label><button onClick={handleToggleAll} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded transition">{splitExcludes.length === 0 ? '全不選' : '全選'}</button></div>
                                <div className="flex flex-wrap gap-2">{people.map(p => (<button key={p.id} onClick={() => setSplitExcludes(prev => prev.includes(p.id) ? prev.filter(id=>id!==p.id) : [...prev, p.id])} className={`px-3 py-2 rounded-full text-sm border transition-all ${!splitExcludes.includes(p.id) ? 'bg-teal-100 text-teal-700 font-bold border-teal-200' : 'bg-white text-slate-300 border-slate-100'}`}>{getPersonName(p.id)} {!splitExcludes.includes(p.id) && <i className="fa-solid fa-check ml-1 text-xs"></i>}</button>))}</div>
                            </div>
                        </div>
                        <button onClick={handleSubmit} className="w-full mt-8 bg-slate-800 text-white p-4 rounded-xl font-bold shadow-lg">確認</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [view, setView] = useState('projectList'); 
            
            const [projects, setProjects] = useState([]);
            const [activeProjectData, setActiveProjectData] = useState(null);
            const [currentProjectId, setCurrentProjectId] = useState(null);
            
            const [user, setUser] = useState(null);
            const [dialog, setDialog] = useState(null);
            
            const debounceTimer = useRef(null);

            useEffect(() => {
                const savedProjects = localStorage.getItem('splitEasy_myProjects');
                if (savedProjects) {
                    setProjects(JSON.parse(savedProjects));
                }

                const initAuth = async () => {
                    try { 
                        await signInAnonymously(auth); 
                    } catch (e) { 
                        console.error("Firebase Login Error:", e);
                        if (e.code === 'auth/configuration-not-found') {
                            setDialog({ type: 'alert', title: '系統提示', message: "請前往 Firebase 後台 -> Authentication -> Sign-in method，啟用「匿名登入 (Anonymous)」以開始使用！" });
                        }
                        setShowSplash(false);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const params = new URLSearchParams(window.location.search);
                const inviteCode = params.get('invite');
                const legacyJoinId = params.get('join');
                
                const processJoin = async () => {
                    if (legacyJoinId) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setDialog({ type: 'alert', title: '邀請連結已更新', message: '舊版共編連結已停用，請向專案擁有者索取新的安全邀請連結。' });
                    } else if (inviteCode) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        const [projectId, inviteId] = inviteCode.split('.');
                        if (!projectId || !inviteId) {
                            setDialog({ type: 'alert', title: '邀請連結無效', message: '邀請連結格式錯誤。' });
                        } else {
                            try {
                                const inviteRef = doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', projectId, 'invites', inviteId);
                                const inviteSnap = await getDoc(inviteRef);
                                if (!inviteSnap.exists() || inviteSnap.data().status !== 'active') throw new Error('邀請連結已失效或被撤銷。');
                                const memberRef = doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', projectId, 'members', user.uid);
                                await setDoc(memberRef, { role: 'editor', inviteId, joinedAt: new Date().toISOString() });
                                const projectSnap = await getDoc(doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', projectId));
                                if (!projectSnap.exists()) throw new Error('找不到這個專案，可能已被刪除。');
                                const cloudData = { id: projectSnap.id, ...projectSnap.data() };
                                setProjects(prev => prev.some(p => p.id === cloudData.id) ? prev : [cloudData, ...prev]);
                                setCurrentProjectId(projectId);
                                setActiveProjectData(cloudData);
                                setView('activeProject');
                            } catch(e) {
                                console.error(e);
                                setDialog({ type: 'alert', title: '無法加入專案', message: e.message || '請確認邀請連結是否有效。' });
                            }
                        }
                    }
                    setTimeout(() => setShowSplash(false), 800);
                };
                
                processJoin();
            }, [user]);

            useEffect(() => {
                localStorage.setItem('splitEasy_myProjects', JSON.stringify(projects));
            }, [projects]);

            useEffect(() => {
                if (!user || !currentProjectId || view !== 'activeProject') {
                    if (view === 'projectList' && !showSplash && !new URLSearchParams(window.location.search).get('invite') && !new URLSearchParams(window.location.search).get('join')) {
                        setTimeout(() => setShowSplash(false), 800);
                    }
                    return;
                }

                const projectRef = doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', currentProjectId);
                
                const unsubscribe = onSnapshot(projectRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const cloudData = { id: snapshot.id, ...snapshot.data() };
                        setActiveProjectData(cloudData);
                        setProjects(prev => prev.map(p => p.id === cloudData.id ? { ...p, name: cloudData.name, updatedAt: cloudData.updatedAt } : p));
                        setTimeout(() => setShowSplash(false), 300);
                    } else {
                        setDialog({ type: 'alert', title: '專案已刪除', message: '這個共編專案已經被刪除了。' });
                        setView('projectList');
                        setProjects(prev => prev.filter(p => p.id !== currentProjectId));
                    }
                }, (error) => {
                    console.error("Firestore error:", error);
                    setShowSplash(false);
                });

                return () => unsubscribe();
            }, [user, currentProjectId, view]);

            const showMessage = (opt) => setDialog({ type: 'alert', title: opt.title || '提示', message: opt.message });

            const createProject = async (type) => {
                if (!user) return showMessage({ message: "尚未連線成功，請確認 Firebase 設定。" });
                const newP = {
                    id: Date.now().toString() + Math.floor(Math.random()*1000).toString(),
                    name: type === 'dining' ? '未命名聚餐' : '未命名旅遊',
                    type,
                    updatedAt: new Date().toISOString(),
                    data: type === 'dining' ? { title: '', date: new Date().toISOString().split('T')[0], people: [{ id: 1, name: '', payerId: 1 }, { id: 2, name: '', payerId: 2 }], totalBill: '', serviceChargeType: 'percent', serviceChargeValue: 10, splitMode: 'even', customAmounts: {}, diningItems: [], billPayerId: 1, invoiceMeta: null } : { name: '', days: 1, people: [{id: 1, name: '', payerId: 1}, {id: 2, name: '', payerId: 2}], expenses: [] }
                };
                
                try {
                    const projectRef = doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', newP.id);
                    const ownerRef = doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', newP.id, 'members', user.uid);
                    await setDoc(projectRef, { ...newP, ownerId: user.uid });
                    await setDoc(ownerRef, { role: 'owner', joinedAt: new Date().toISOString() });
                    setProjects(prev => [newP, ...prev]);
                    setCurrentProjectId(newP.id);
                    setActiveProjectData({ ...newP, ownerId: user.uid });
                    setView('activeProject');
                } catch(e) { console.error(e); showMessage({ message: "建立失敗，請檢查網路" }); }
            };

            const handleDeleteProject = (id, e) => {
                e.stopPropagation();
                setDialog({
                    type: 'confirm',
                    title: '刪除專案',
                    message: '確定要刪除這個專案嗎？\n此動作會同時刪除雲端資料，包廂內的所有人都將無法再看到。',
                    confirmText: '永久刪除',
                    onConfirm: async () => {
                        if (!user) return;
                        try {
                            await deleteDoc(doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', id));
                            setProjects(prev => prev.filter(p => p.id !== id));
                            if (currentProjectId === id) setView('projectList');
                        } catch(e) { console.error(e); }
                    }
                });
            };

            const updateCurrentData = (newData) => {
                if (!activeProjectData) return;
                
                const activityName = activeProjectData.type === 'dining' ? newData.title : newData.name;
                const fallbackName = activeProjectData.type === 'dining' ? '未命名聚餐' : '未命名旅遊';
                const updatedProj = { ...activeProjectData, data: newData, name: activityName?.trim() || fallbackName, updatedAt: new Date().toISOString() };
                setActiveProjectData(updatedProj);
                
                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                debounceTimer.current = setTimeout(() => {
                    if (auth.currentUser) {
                        setDoc(doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', currentProjectId), updatedProj)
                        .catch(e => console.error("Sync error:", e));
                    }
                }, 800);
            };

            const handleShareProject = async () => {
                if (!user || !currentProjectId || !activeProjectData) return;
                try {
                    const inviteId = createInviteToken();
                    const inviteRef = doc(db, 'artifacts', FIREBASE_APP_ID, 'public', 'data', 'projects', currentProjectId, 'invites', inviteId);
                    await setDoc(inviteRef, { status: 'active', createdBy: user.uid, createdAt: new Date().toISOString(), role: 'editor' });
                    const shareUrl = `${window.location.origin}${window.location.pathname}?invite=${currentProjectId}.${inviteId}`;
                    copyToClipboard(shareUrl);
                    showMessage({ title: '安全邀請連結已複製', message: '請將連結貼給朋友。對方加入後會成為協作者；之後可在成員管理功能中撤銷此連結。' });
                } catch(e) {
                    console.error(e);
                    showMessage({ title: '建立邀請失敗', message: '請檢查網路或 Firebase 權限設定。' });
                }
            };

            if (showSplash) return <SplashScreen />;

            return (
                <div className="min-h-screen">
                    <DialogModal dialog={dialog} onClose={() => setDialog(null)} />
                    
                    <header className="bg-white shadow-sm sticky top-0 z-10 px-4 py-3 flex items-center justify-between">
                        {view === 'activeProject' ? (
                            <button onClick={() => setView('projectList')} className="flex items-center gap-1 text-slate-500 font-bold"><i className="fa-solid fa-arrow-left"></i> 首頁</button>
                        ) : (
                            <div className="flex items-center gap-2 text-teal-600 font-bold text-lg"><i className="fa-solid fa-calculator"></i> Split Easy</div>
                        )}
                        
                        {view === 'activeProject' && activeProjectData && (
                            <div className="flex items-center gap-3">
                                <h1 className="font-bold text-base text-slate-800 truncate max-w-[120px]">{activeProjectData.name}</h1>
                                {activeProjectData.ownerId === user?.uid ? <button onClick={handleShareProject} className="bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-teal-200 transition"><i className="fa-solid fa-user-plus"></i> 邀請共編</button> : <span className="bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full text-xs font-bold">協作者</span>}
                            </div>
                        )}
                    </header>
                    
                    <main className="max-w-md mx-auto min-h-[calc(100vh-60px)] relative bg-slate-50">
                        {view === 'projectList' && <ProjectList projects={projects} onSelect={(id) => { setCurrentProjectId(id); setView('activeProject'); }} onCreate={() => setView('createProject')} onDelete={handleDeleteProject} />}
                        {view === 'createProject' && <CreateProjectScreen onCancel={() => setView('projectList')} onCreate={createProject} showMessage={showMessage} />}
                        
                        {view === 'activeProject' && activeProjectData?.type === 'travel' && <TravelMode projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} />}
                        {view === 'activeProject' && activeProjectData?.type === 'dining' && <DiningMode projectData={activeProjectData.data} onUpdate={updateCurrentData} showMessage={showMessage} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
